name: Analyze beryl vendor_dlkm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-vendor-dlkm:
    name: Analyze vendor_dlkm
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # INSTALL TOOLS
      # ============================================================

      - name: Install analysis tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            erofs-utils \
            file \
            binutils \
            kmod \
            lz4 \
            python3 \
            python3-pip

          echo "Installed tools:"
          erofsfuse --version 2>/dev/null || true
          fsck.erofs --help | head -n 5 || true
          modinfo --version || true
          lz4 --version || true

      # ============================================================
      # FIND LATEST RELEASE
      # ============================================================

      - name: Find latest release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p analysis/image
          mkdir -p analysis/report
          mkdir -p analysis/extracted

          echo "Repository:"
          echo "$GITHUB_REPOSITORY"

          gh release view \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,publishedAt,assets \
            > analysis/release.json

          python3 <<'PY'
          import json
          import sys

          with open("analysis/release.json") as f:
              data = json.load(f)

          print("Release name:", data.get("name"))
          print("Release tag:", data.get("tagName"))
          print("Published:", data.get("publishedAt"))

          assets = data.get("assets", [])

          print()
          print("Release assets:")

          for asset in assets:
              print(
                  f"  {asset['name']} "
                  f"({asset['size']} bytes)"
              )

          matches = [
              a for a in assets
              if "vendor_dlkm" in a["name"].lower()
              and a["name"].lower().endswith(".img")
          ]

          if not matches:
              print()
              print("ERROR: vendor_dlkm image not found.")
              sys.exit(1)

          # Prefer the exact name if it exists.
          exact = [
              a for a in matches
              if a["name"].lower() == "vendor_dlkm.img"
          ]

          asset = exact[0] if exact else matches[0]

          print()
          print("Selected asset:")
          print("  Name:", asset["name"])
          print("  Size:", asset["size"])
          print("  URL:", asset["url"])

          with open("analysis/asset_name.txt", "w") as f:
              f.write(asset["name"])

          with open("analysis/asset_url.txt", "w") as f:
              f.write(asset["url"])
          PY

      # ============================================================
      # DOWNLOAD
      # ============================================================

      - name: Download vendor_dlkm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          ASSET="$(cat analysis/asset_name.txt)"

          echo "Downloading:"
          echo "$ASSET"

          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" \
            --dir analysis/image \
            --clobber

          # gh already preserves the release asset filename.
          # Rename only when it is actually different.
          if [ "$ASSET" != "vendor_dlkm.img" ]; then
            mv \
              "analysis/image/$ASSET" \
              "analysis/image/vendor_dlkm.img"
          fi

          echo
          echo "Downloaded image:"
          ls -lh analysis/image/vendor_dlkm.img

          echo
          echo "SHA-256:"
          sha256sum analysis/image/vendor_dlkm.img \
            | tee analysis/report/image_sha256.txt

      # ============================================================
      # IMAGE INSPECTION
      # ============================================================

      - name: Inspect vendor_dlkm image
        run: |
          set -e

          {
            echo "=== FILE ==="
            file analysis/image/vendor_dlkm.img

            echo
            echo "=== STAT ==="
            stat analysis/image/vendor_dlkm.img

            echo
            echo "=== SHA256 ==="
            sha256sum analysis/image/vendor_dlkm.img
          } | tee analysis/report/image_info.txt

      # ============================================================
      # EROFS EXTRACTION
      # ============================================================

      - name: Extract EROFS filesystem
        run: |
          set -e

          echo "Extracting vendor_dlkm..."

          fsck.erofs \
            --extract=analysis/extracted \
            analysis/image/vendor_dlkm.img \
            2>&1 | tee analysis/report/erofs_extract.log

          echo
          echo "Extraction complete."

          find analysis/extracted -maxdepth 4 -type f \
            | sort \
            | head -n 100

      # ============================================================
      # COMPLETE FILE INVENTORY
      # ============================================================

      - name: Build file inventory
        run: |
          set -e

          find analysis/extracted \
            -type f \
            | sort \
            > analysis/report/all_files.txt

          find analysis/extracted \
            -type f \
            -name '*.ko' \
            | sort \
            > analysis/report/modules.txt

          find analysis/extracted \
            -type f \
            \( \
              -name '*.bin' \
              -o -name '*.fw' \
              -o -name '*.img' \
              -o -name '*.hex' \
            \) \
            | sort \
            > analysis/report/firmware_candidates.txt

          echo "Total files:"
          wc -l < analysis/report/all_files.txt

          echo "Kernel modules:"
          wc -l < analysis/report/modules.txt

          echo "Possible firmware files:"
          wc -l < analysis/report/firmware_candidates.txt

      # ============================================================
      # LOCATE MODULE DIRECTORY
      # ============================================================

      - name: Locate module directory
        run: |
          set -e

          MODDIR="$(dirname "$(find analysis/extracted \
            -type f \
            -name modules.dep \
            | head -n 1)")"

          if [ -z "$MODDIR" ]; then
            echo "ERROR: modules.dep not found."
            exit 1
          fi

          echo "$MODDIR" \
            | tee analysis/report/module_directory.txt

      # ============================================================
      # COPY MODULE METADATA
      # ============================================================

      - name: Collect module metadata
        run: |
          set -e

          MODDIR="$(cat analysis/report/module_directory.txt)"

          for file in \
            modules.dep \
            modules.load \
            modules.alias \
            modules.softdep \
            modules.symbols \
            modules.symbols.bin
          do
            if [ -f "$MODDIR/$file" ]; then
              cp \
                "$MODDIR/$file" \
                "analysis/report/$file"

              echo "FOUND: $file"
            else
              echo "MISSING: $file"
            fi
          done \
            | tee analysis/report/module_metadata_status.txt

      # ============================================================
      # DEPENDENCY COMPLETENESS
      # ============================================================

      - name: Analyze modules.dep
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path("analysis/extracted")
          report = Path("analysis/report")

          dep_files = list(root.rglob("modules.dep"))

          if not dep_files:
              print("modules.dep not found")
              raise SystemExit(1)

          dep = dep_files[0]

          available = {
              p.name
              for p in root.rglob("*.ko")
          }

          missing = set()
          entries = 0
          dependency_count = 0

          for line in dep.read_text(
              errors="replace"
          ).splitlines():

              if ":" not in line:
                  continue

              entries += 1

              _, dependencies = line.split(
                  ":",
                  1
              )

              for item in dependencies.split():
                  name = Path(item).name

                  if name.endswith(".ko"):
                      dependency_count += 1

                      if name not in available:
                          missing.add(name)

          output = [
              "MODULE DEPENDENCY ANALYSIS",
              "==========================",
              f"modules.dep entries: {entries}",
              f"available .ko files: {len(available)}",
              f"dependency references: {dependency_count}",
              f"missing dependencies: {len(missing)}",
              "",
          ]

          if missing:
              output.append("MISSING MODULES:")
              output.extend(sorted(missing))
          else:
              output.append(
                  "RESULT: No missing .ko dependencies."
              )

          text = "\n".join(output) + "\n"

          print(text)

          (
              report /
              "missing_dependencies.txt"
          ).write_text(text)
          PY

      # ============================================================
      # MODULES.LOAD VALIDATION
      # ============================================================

      - name: Validate modules.load
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path("analysis/extracted")
          report = Path("analysis/report")

          loads = list(root.rglob("modules.load"))

          if not loads:
              print("modules.load not found")
              raise SystemExit(0)

          load_file = loads[0]

          available = {
              p.name
              for p in root.rglob("*.ko")
          }

          entries = []
          missing = []

          for line in load_file.read_text(
              errors="replace"
          ).splitlines():

              line = line.strip()

              if not line or line.startswith("#"):
                  continue

              name = Path(line).name

              entries.append(name)

              if name not in available:
                  missing.append(name)

          output = [
              "MODULES.LOAD ANALYSIS",
              "=====================",
              f"modules.load entries: {len(entries)}",
              f"missing loaded modules: {len(missing)}",
              "",
          ]

          if missing:
              output.append("MISSING:")
              output.extend(sorted(missing))
          else:
              output.append(
                  "RESULT: Every modules.load entry exists."
              )

          text = "\n".join(output) + "\n"

          print(text)

          (
              report /
              "modules_load_check.txt"
          ).write_text(text)
          PY

      # ============================================================
      # VERMAGIC ANALYSIS
      # ============================================================

      - name: Analyze module vermagic
        run: |
          set +e

          : > analysis/report/vermagic.txt

          while IFS= read -r module
          do
            name="$(basename "$module")"

            vermagic="$(
              modinfo \
                -F vermagic \
                "$module" \
                2>/dev/null
            )"

            if [ -z "$vermagic" ]; then
              vermagic="UNAVAILABLE"
            fi

            printf "%-45s %s\n" \
              "$name" \
              "$vermagic" \
              >> analysis/report/vermagic.txt

          done < analysis/report/modules.txt

          echo "VERMAGIC:"
          cat analysis/report/vermagic.txt

      - name: Summarize vermagic variants
        run: |
          awk '
          {
            $1="";
            sub(/^ /,"");
            print
          }
          ' analysis/report/vermagic.txt \
            | sort \
            | uniq -c \
            | sort -nr \
            > analysis/report/vermagic_summary.txt

      # ============================================================
      # TOUCH DRIVER
      # ============================================================

      - name: Analyze FTS touch driver
        run: |
          set +e

          MOD="$(
            find analysis/extracted \
              -type f \
              -name 'fts_touch_i2c.ko' \
              | head -n 1
          )"

          if [ -z "$MOD" ]; then
            echo "fts_touch_i2c.ko NOT FOUND" \
              | tee analysis/report/touch_driver_status.txt
            exit 0
          fi

          echo "Found:"
          echo "$MOD"

          modinfo "$MOD" \
            > analysis/report/fts_touch_modinfo.txt \
            2>&1

          {
            echo "=== FTS TOUCH DRIVER ==="
            echo "$MOD"

            echo
            echo "=== MODINFO ==="
            cat analysis/report/fts_touch_modinfo.txt

            echo
            echo "=== FIRMWARE REFERENCES ==="

            strings -a "$MOD" |
              grep -Ei \
              'request_firmware|firmware|\.bin|\.fw|/odm/|/vendor/' |
              sort -u ||
              true

          } | tee analysis/report/fts_touch_analysis.txt

      # ============================================================
      # TOUCH DEPENDENCY CHAIN
      # ============================================================

      - name: Check touch dependency chain
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path("analysis/extracted")
          report = Path("analysis/report")

          required = [
              "fts_touch_i2c.ko",
              "xiaomi_tp.ko",
              "lct_tp.ko",
              "scp.ko",
              "mtk-afe-external.ko",
              "mtk_tinysys_ipi.ko",
              "mtk_rpmsg_mbox.ko",
              "mtk-mbox.ko",
          ]

          available = {
              p.name
              for p in root.rglob("*.ko")
          }

          lines = [
              "BERYL TOUCH DEPENDENCY CHAIN",
              "============================",
              "",
          ]

          for module in required:
              status = (
                  "PRESENT"
                  if module in available
                  else "MISSING"
              )

              lines.append(
                  f"{module}: {status}"
              )

          text = "\n".join(lines) + "\n"

          print(text)

          (
              report /
              "touch_dependency_check.txt"
          ).write_text(text)
          PY

      # ============================================================
      # ALL FIRMWARE REFERENCES
      # ============================================================

      - name: Search modules for firmware references
        run: |
          set +e

          : > analysis/report/firmware_references.txt

          while IFS= read -r module
          do
            references="$(
              strings -a "$module" 2>/dev/null |
              grep -Ei \
              'request_firmware|/odm/firmware|/vendor/firmware|\.bin|\.fw' |
              sort -u
            )"

            if [ -n "$references" ]; then
              {
                echo "========================================"
                echo "MODULE: $module"
                echo "========================================"
                echo "$references"
                echo
              } >> analysis/report/firmware_references.txt
            fi

          done < analysis/report/modules.txt

      # ============================================================
      # FIRMWARE FILE INVENTORY
      # ============================================================

      - name: Analyze firmware locations
        run: |
          set -e

          find analysis/extracted \
            -type d \
            \( \
              -iname '*firmware*' \
              -o -path '*/odm/*' \
              -o -path '*/vendor/*' \
            \) \
            | sort \
            > analysis/report/firmware_directories.txt

          {
            echo "=== FIRMWARE DIRECTORIES ==="
            cat analysis/report/firmware_directories.txt

            echo
            echo "=== FIRMWARE FILE CANDIDATES ==="
            cat analysis/report/firmware_candidates.txt
          } | tee analysis/report/firmware_inventory.txt

      # ============================================================
      # MODULE COUNT BY CATEGORY
      # ============================================================

      - name: Categorize modules
        run: |
          python3 <<'PY'
          from pathlib import Path
          from collections import Counter

          modules = [
              p.name
              for p in Path("analysis/extracted").rglob("*.ko")
          ]

          categories = {
              "touch": [
                  "touch",
                  "tp",
                  "fts",
                  "goodix",
                  "focal"
              ],
              "display": [
                  "disp",
                  "mdp",
                  "panel",
                  "dsi",
                  "pwm",
                  "backlight"
              ],
              "camera": [
                  "camera",
                  "cam",
                  "isp"
              ],
              "audio": [
                  "audio",
                  "afe",
                  "sound"
              ],
              "storage": [
                  "ufs",
                  "mmc",
                  "sd",
                  "storage"
              ],
              "usb": [
                  "usb",
                  "typec"
              ],
              "thermal": [
                  "thermal",
                  "cooling"
              ],
              "power": [
                  "charger",
                  "battery",
                  "power"
              ],
          }

          counts = Counter()

          for module in modules:
              lower = module.lower()

              matched = False

              for category, keywords in categories.items():
                  if any(
                      key in lower
                      for key in keywords
                  ):
                      counts[category] += 1
                      matched = True
                      break

              if not matched:
                  counts["other"] += 1

          lines = [
              "MODULE CATEGORY SUMMARY",
              "=======================",
              ""
          ]

          for category, count in counts.most_common():
              lines.append(
                  f"{category}: {count}"
              )

          text = "\n".join(lines) + "\n"

          print(text)

          Path(
              "analysis/report/module_categories.txt"
          ).write_text(text)
          PY

      # ============================================================
      # FINAL SUMMARY
      # ============================================================

      - name: Generate final summary
        run: |
          {
            echo "================================================"
            echo "BERYL vendor_dlkm ANALYSIS"
            echo "================================================"
            echo

            echo "REPOSITORY:"
            echo "$GITHUB_REPOSITORY"
            echo

            echo "RELEASE:"
            cat analysis/release.json
            echo

            echo "IMAGE:"
            cat analysis/report/image_info.txt
            echo

            echo "MODULE COUNT:"
            wc -l < analysis/report/modules.txt
            echo

            echo "DEPENDENCY CHECK:"
            cat analysis/report/missing_dependencies.txt
            echo

            echo "MODULES.LOAD CHECK:"
            cat analysis/report/modules_load_check.txt
            echo

            echo "TOUCH DEPENDENCY CHECK:"
            cat analysis/report/touch_dependency_check.txt
            echo

            echo "VERMAGIC SUMMARY:"
            cat analysis/report/vermagic_summary.txt
            echo

            echo "MODULE CATEGORIES:"
            cat analysis/report/module_categories.txt
            echo

            echo "TOUCH FIRMWARE REFERENCES:"
            cat analysis/report/fts_touch_analysis.txt
            echo

            echo "FIRMWARE INVENTORY:"
            cat analysis/report/firmware_inventory.txt

          } | tee analysis/report/SUMMARY.txt

      # ============================================================
      # UPLOAD REPORT
      # ============================================================

      - name: Upload complete analysis
        uses: actions/upload-artifact@v4
        with:
          name: beryl-vendor-dlkm-analysis
          path: analysis/report/
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # UPLOAD EXTRACTED MODULES
      # ============================================================

      - name: Upload extracted module tree
        uses: actions/upload-artifact@v4
        with:
          name: beryl-vendor-dlkm-extracted
          path: analysis/extracted/
          if-no-files-found: error
          retention-days: 7
