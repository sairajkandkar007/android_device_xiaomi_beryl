name: Analyze beryl vendor_dlkm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-vendor-dlkm:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            erofs-utils \
            file \
            binutils \
            kmod \
            lz4 \
            python3

      - name: Find latest release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p analysis/image

          gh release view \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,assets \
            > analysis/release.json

          python3 <<'PY'
          import json
          import sys

          data = json.load(open("analysis/release.json"))

          print("Release:", data["name"])
          print("Tag:", data["tagName"])

          assets = data.get("assets", [])

          for asset in assets:
              name = asset["name"]
              print("Asset:", name)

          matches = [
              a for a in assets
              if "vendor_dlkm" in a["name"].lower()
              and a["name"].lower().endswith(".img")
          ]

          if not matches:
              print("\nERROR: No vendor_dlkm .img asset found.")
              sys.exit(1)

          asset = matches[0]

          print("\nSelected asset:")
          print(asset["name"])
          print(asset["url"])

          open("analysis/asset_name.txt", "w").write(asset["name"])
          open("analysis/asset_url.txt", "w").write(asset["url"])
          PY

      - name: Download vendor_dlkm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          ASSET="$(cat analysis/asset_name.txt)"

          echo "Downloading: $ASSET"

          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" \
            --dir analysis/image \
            --clobber

          mv "analysis/image/$ASSET" \
             analysis/image/vendor_dlkm.img

          ls -lh analysis/image/vendor_dlkm.img

          sha256sum analysis/image/vendor_dlkm.img \
            | tee analysis/report_image_sha256.txt

      - name: Inspect image
        run: |
          mkdir -p analysis/report analysis/extracted

          file analysis/image/vendor_dlkm.img \
            | tee analysis/report/image_type.txt

          stat analysis/image/vendor_dlkm.img \
            | tee analysis/report/image_stat.txt

      - name: Extract EROFS
        run: |
          set -e

          fsck.erofs \
            --extract=analysis/extracted \
            analysis/image/vendor_dlkm.img \
            2>&1 | tee analysis/report/erofs_extract.log

      - name: Inventory files
        run: |
          find analysis/extracted -type f \
            | sort \
            > analysis/report/all_files.txt

          find analysis/extracted -type f -name '*.ko' \
            | sort \
            > analysis/report/modules.txt

          find analysis/extracted -type f \
            \( -name '*.bin' \
            -o -name '*.fw' \
            -o -name '*.img' \) \
            | sort \
            > analysis/report/firmware_candidates.txt

          echo "Modules:"
          wc -l analysis/report/modules.txt

          echo "Firmware candidates:"
          wc -l analysis/report/firmware_candidates.txt

      - name: Analyze module metadata
        run: |
          set -e

          MODDIR="$(dirname "$(find analysis/extracted \
            -type f -name modules.dep | head -n1)")"

          echo "$MODDIR" \
            > analysis/report/module_directory.txt

          for f in \
            modules.dep \
            modules.load \
            modules.alias \
            modules.softdep \
            modules.symbols \
            modules.symbols.bin
          do
            if [ -f "$MODDIR/$f" ]; then
              cp "$MODDIR/$f" \
                 "analysis/report/$f"
            fi
          done

      - name: Check dependency completeness
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path("analysis/extracted")
          report = Path("analysis/report")

          dep_files = list(root.rglob("modules.dep"))

          if not dep_files:
              (report / "missing_dependencies.txt").write_text(
                  "modules.dep not found\n"
              )
              raise SystemExit(0)

          dep = dep_files[0]

          available = {
              p.name for p in root.rglob("*.ko")
          }

          missing = set()
          entries = 0

          for line in dep.read_text(
              errors="replace"
          ).splitlines():

              if ":" not in line:
                  continue

              entries += 1

              _, dependencies = line.split(":", 1)

              for item in dependencies.split():
                  name = Path(item).name

                  if (
                      name.endswith(".ko")
                      and name not in available
                  ):
                      missing.add(name)

          output = [
              f"modules.dep entries: {entries}",
              f"available modules: {len(available)}",
              f"missing dependencies: {len(missing)}",
              "",
          ]

          output.extend(sorted(missing))

          (report / "missing_dependencies.txt").write_text(
              "\n".join(output) + "\n"
          )

          print("\n".join(output))
          PY

      - name: Analyze touch driver
        run: |
          set +e

          MOD="$(find analysis/extracted \
            -type f \
            -name 'fts_touch_i2c.ko' \
            | head -n1)"

          if [ -z "$MOD" ]; then
            echo "fts_touch_i2c.ko NOT FOUND" \
              | tee analysis/report/touch_driver.txt
            exit 0
          fi

          echo "Touch driver:"
          echo "$MOD"

          modinfo "$MOD" \
            | tee analysis/report/fts_touch_modinfo.txt

          echo
          echo "Firmware references:"

          strings -a "$MOD" |
            grep -Ei \
            'firmware|request_firmware|\.bin|\.fw|/odm/|/vendor/' \
            | sort -u \
            | tee analysis/report/fts_firmware_strings.txt

      - name: Analyze all firmware references
        run: |
          set +e

          : > analysis/report/firmware_references.txt

          while IFS= read -r module
          do
            if strings -a "$module" 2>/dev/null |
              grep -Eiq \
              'request_firmware|/odm/firmware|/vendor/firmware'
            then

              {
                echo "================================"
                echo "$module"
                echo "================================"

                strings -a "$module" |
                  grep -Ei \
                  'request_firmware|firmware|\.bin|\.fw|/odm/|/vendor/'

                echo
              } >> analysis/report/firmware_references.txt
            fi
          done < analysis/report/modules.txt

      - name: Check touch dependency chain
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path("analysis/extracted")
          report = Path("analysis/report")

          required = [
              "fts_touch_i2c.ko",
              "xiaomi_tp.ko",
              "lct_tp.ko",
              "scp.ko",
              "mtk-afe-external.ko",
              "mtk_tinysys_ipi.ko",
              "mtk_rpmsg_mbox.ko",
              "mtk-mbox.ko",
          ]

          available = {
              p.name for p in root.rglob("*.ko")
          }

          lines = []

          for module in required:
              state = (
                  "PRESENT"
                  if module in available
                  else "MISSING"
              )

              lines.append(
                  f"{module}: {state}"
              )

          output = "\n".join(lines) + "\n"

          print(output)

          (report / "touch_dependency_check.txt").write_text(
              output
          )
          PY

      - name: Search firmware directories
        run: |
          find analysis/extracted \
            -type d \
            \( -iname '*firmware*' \
            -o -path '*/odm/*' \
            -o -path '*/vendor/*' \) \
            | sort \
            > analysis/report/firmware_directories.txt

      - name: Generate summary
        run: |
          {
            echo "BERYL vendor_dlkm ANALYSIS"
            echo "=========================="
            echo
            echo "Release:"
            cat analysis/release.json
            echo
            echo "SHA256:"
            cat analysis/report_image_sha256.txt
            echo
            echo "MODULE COUNT:"
            wc -l < analysis/report/modules.txt
            echo
            echo "DEPENDENCY CHECK:"
            cat analysis/report/missing_dependencies.txt
            echo
            echo "TOUCH DEPENDENCY CHECK:"
            cat analysis/report/touch_dependency_check.txt
            echo
            echo "FTS TOUCH FIRMWARE REFERENCES:"
            cat analysis/report/fts_firmware_strings.txt
            echo
            echo "FIRMWARE CANDIDATES:"
            cat analysis/report/firmware_candidates.txt
          } > analysis/report/SUMMARY.txt

          cat analysis/report/SUMMARY.txt

      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        with:
          name: beryl-vendor-dlkm-analysis
          path: analysis/report/
          retention-days: 30
