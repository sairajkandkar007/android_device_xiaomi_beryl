name: Beryl Stock ROM Full Recovery Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ROM_URL: "https://bigota.d.miui.com/OS1.0.4.0.UOQINXM/miui_BERYLINGlobal_OS1.0.4.0.UOQINXM_b51bc03ea2_14.0.zip"
  ROM_NAME: "miui_BERYLINGlobal_OS1.0.4.0.UOQINXM_b51bc03ea2_14.0.zip"
  DEVICE: "beryl"
  DEVICE_PATH: "device/xiaomi/beryl"

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install analysis tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            aria2 \
            7zip \
            unzip \
            zip \
            p7zip-full \
            lz4 \
            cpio \
            file \
            xz-utils \
            zstd \
            gzip \
            bzip2 \
            python3 \
            python3-pip \
            python3-venv \
            python3-dev \
            binutils \
            device-tree-compiler \
            e2fsprogs \
            f2fs-tools \
            erofs-utils \
            android-sdk-libsparse-utils \
            jq \
            rsync \
            wget \
            curl \
            ca-certificates

          python3 -m pip install --break-system-packages lz4

      - name: Prepare analysis workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf analysis
          mkdir -p \
            analysis/rom \
            analysis/rom_extract \
            analysis/payload \
            analysis/partitions \
            analysis/extracted \
            analysis/recovery \
            analysis/reports \
            analysis/scripts

      - name: Download exact Xiaomi stock ROM with maximum practical aria2 parallelism
        shell: bash
        run: |
          set -euo pipefail

          cd analysis/rom

          echo "ROM:"
          echo "$ROM_URL"
          echo

          # 32-way segmentation is deliberately aggressive without creating
          # hundreds of connections to Xiaomi's CDN.
          aria2c \
            --no-conf=true \
            --dry-run=false \
            --continue=true \
            --always-resume=true \
            --allow-overwrite=false \
            --auto-file-renaming=false \
            --file-allocation=none \
            --check-integrity=true \
            --max-tries=0 \
            --retry-wait=2 \
            --connect-timeout=30 \
            --timeout=60 \
            --lowest-speed-limit=0 \
            --max-overall-download-limit=0 \
            --max-download-limit=0 \
            --split=32 \
            --max-connection-per-server=32 \
            --min-split-size=4M \
            --piece-length=1M \
            --stream-piece-selector=geom \
            --reuse-uri=false \
            --enable-http-pipelining=true \
            --http-accept-gzip=false \
            --out="$ROM_NAME" \
            "$ROM_URL"

          test -s "$ROM_NAME"
          echo "ROM size:"
          stat -c '%s bytes' "$ROM_NAME"
          echo "ROM SHA256:"
          sha256sum "$ROM_NAME" | tee ../reports/ROM_SHA256.txt

      - name: Verify ROM archive and list contents
        shell: bash
        run: |
          set -euo pipefail

          cd analysis/rom
          file "$ROM_NAME" | tee ../reports/ROM_FILE_TYPE.txt
          7z t "$ROM_NAME" | tee ../reports/ROM_ARCHIVE_TEST.txt
          7z l -slt "$ROM_NAME" > ../reports/ROM_CONTENTS.txt

          echo "Important ROM entries:"
          grep -Ei \
            '(^|/)(payload\.bin|super\.img|boot\.img|vendor_boot\.img|init_boot\.img|dtbo\.img|vbmeta.*\.img|system\.img|vendor\.img|product\.img|system_ext\.img|odm.*\.img|.*dlkm.*\.img|metadata\.img)' \
            ../reports/ROM_CONTENTS.txt \
            || true

      - name: Extract ROM archive
        shell: bash
        run: |
          set -euo pipefail

          7z x \
            -y \
            "analysis/rom/$ROM_NAME" \
            "-oanalysis/rom_extract"

          find analysis/rom_extract -type f -printf '%p\t%s bytes\n' \
            | sort > analysis/reports/ROM_EXTRACTED_FILES.txt

      - name: Locate and extract payload.bin if present
        shell: bash
        run: |
          set -euo pipefail

          PAYLOAD="$(find analysis/rom_extract -type f -name payload.bin -print -quit || true)"

          if [ -n "$PAYLOAD" ]; then
            echo "Found payload.bin: $PAYLOAD"
            cp "$PAYLOAD" analysis/payload/payload.bin

            sudo apt-get install -y golang-go

            export PATH="$PATH:$(go env GOPATH)/bin"
            go install github.com/ssut/payload-dumper-go@latest

            payload-dumper-go \
              -o analysis/payload/extracted \
              analysis/payload/payload.bin

            find analysis/payload/extracted -type f \
              -printf '%p\t%s bytes\n' \
              | sort > analysis/reports/PAYLOAD_PARTITIONS.txt
          else
            echo "No payload.bin found."
            echo "The ROM appears to contain direct partition images or another layout."
          fi

      - name: Collect every partition image from ROM
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p analysis/partitions

          # Direct images from the ROM.
          find analysis/rom_extract -type f \
            \( -iname '*.img' -o -iname '*.bin' \) \
            -print0 \
            | while IFS= read -r -d '' f; do
                base="$(basename "$f")"
                case "$base" in
                  payload.bin) continue ;;
                esac
                cp -f "$f" "analysis/partitions/$base" || true
              done

          # Images extracted from payload.bin.
          if [ -d analysis/payload/extracted ]; then
            find analysis/payload/extracted -type f \
              \( -iname '*.img' -o -iname '*.bin' \) \
              -print0 \
              | while IFS= read -r -d '' f; do
                  base="$(basename "$f")"
                  cp -f "$f" "analysis/partitions/$base" || true
                done
          fi

          find analysis/partitions -maxdepth 1 -type f \
            -printf '%f\t%s bytes\n' \
            | sort > analysis/reports/PARTITION_IMAGE_LIST.txt

          cat analysis/reports/PARTITION_IMAGE_LIST.txt

      - name: Add current GitHub release stock images as supplemental inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The full ROM is authoritative. These are only used if the ROM
          # archive does not contain one of the low-level images.
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/Berylstock"

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "$API" \
            -o analysis/reports/Berylstock_release.json

          jq -r '.assets[] | [.name,.browser_download_url] | @tsv' \
            analysis/reports/Berylstock_release.json \
            > analysis/reports/Berylstock_assets.tsv

          while IFS=$'\t' read -r name url; do
            [ -n "$name" ] || continue
            target="analysis/partitions/$name"
            if [ ! -s "$target" ]; then
              echo "Supplementing missing $name from Berylstock"
              curl -fL --retry 5 --retry-delay 2 \
                -H "Accept: application/octet-stream" \
                "$url" \
                -o "$target"
            fi
          done < analysis/reports/Berylstock_assets.tsv

      - name: Create partition metadata inventory
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# Beryl Partition Inventory"
            echo
            echo "ROM: $ROM_NAME"
            echo "URL: $ROM_URL"
            echo
            echo "| Image | Bytes | SHA256 | File type |"
            echo "|---|---:|---|---|"
          } > analysis/reports/PARTITION_ANALYSIS.md

          : > analysis/reports/partition_inventory.jsonl

          for img in analysis/partitions/*; do
            [ -f "$img" ] || continue

            name="$(basename "$img")"
            bytes="$(stat -c '%s' "$img")"
            sha="$(sha256sum "$img" | awk '{print $1}')"
            type="$(file -b "$img" | tr '\n' ' ' | sed 's/|/\\|/g')"

            printf '| `%s` | %s | `%s` | %s |\n' \
              "$name" "$bytes" "$sha" "$type" \
              >> analysis/reports/PARTITION_ANALYSIS.md

            jq -cn \
              --arg name "$name" \
              --argjson bytes "$bytes" \
              --arg sha256 "$sha" \
              --arg type "$type" \
              '{name:$name,bytes:$bytes,sha256:$sha256,file_type:$type}' \
              >> analysis/reports/partition_inventory.jsonl
          done

      - name: Analyze Android boot images
        shell: bash
        run: |
          set -euo pipefail

          cat > analysis/scripts/analyze_boot.py <<'PY'
          import struct, sys, os, json

          def u32(b,o): return struct.unpack_from("<I",b,o)[0]
          def u64(b,o): return struct.unpack_from("<Q",b,o)[0]

          def parse(path):
              data=open(path,"rb").read(4096)
              if len(data) < 44:
                  return {"error":"too small"}

              magic=data[:8].decode("ascii","replace")
              out={"file":path,"magic":magic,"size":os.path.getsize(path)}

              if magic == "ANDROID!":
                  # boot header v3/v4 common fields
                  out["kernel_size"]=u32(data,8)
                  out["ramdisk_size"]=u32(data,12)
                  out["os_version"]=u32(data,40)
                  out["header_version"]=u32(data,40+4) if len(data)>=48 else None

                  # Correct v3/v4 header_version offset is 40.
                  out["header_version"]=u32(data,40)

                  if out["header_version"] >= 3:
                      out["header_size"]=u32(data,44)
                  else:
                      out["header_size"]=None

              elif magic == "VNDRBOOT":
                  out["header_version"]=u32(data,8)
                  out["page_size"]=u32(data,12)
                  out["kernel_addr"]=hex(u32(data,16))
                  out["ramdisk_addr"]=hex(u32(data,20))
                  out["vendor_ramdisk_size"]=u32(data,24)
                  out["cmdline"]=data[28:2076].split(b"\0",1)[0].decode("utf-8","replace")
                  out["tags_addr"]=hex(u32(data,2076))
                  out["name"]=data[2080:2120].split(b"\0",1)[0].decode("utf-8","replace")
                  out["dtb_addr"]=hex(u64(data,2120))
                  if len(data)>=2128:
                      out["header_size"]=u32(data,2120)
                  if out["header_version"] >= 4 and len(data)>=2136:
                      out["vendor_ramdisk_table_size"]=u32(data,2124)
                      out["vendor_ramdisk_table_entry_num"]=u32(data,2128)
                      out["vendor_ramdisk_table_entry_size"]=u32(data,2132)
              return out

          for p in sys.argv[1:]:
              try:
                  print(json.dumps(parse(p),indent=2))
              except Exception as e:
                  print(json.dumps({"file":p,"error":str(e)},indent=2))
          PY

          : > analysis/reports/BOOT_IMAGE_DETAILS.txt

          for name in boot.img vendor_boot.img init_boot.img; do
            img="analysis/partitions/$name"
            if [ -f "$img" ]; then
              echo "===== $name =====" >> analysis/reports/BOOT_IMAGE_DETAILS.txt
              python3 analysis/scripts/analyze_boot.py "$img" \
                >> analysis/reports/BOOT_IMAGE_DETAILS.txt
              echo >> analysis/reports/BOOT_IMAGE_DETAILS.txt
            fi
          done

      - name: Extract boot and vendor_boot ramdisks
        shell: bash
        run: |
          set -euo pipefail

          cat > analysis/scripts/extract_boot.py <<'PY'
          import struct, sys, os

          PAGE=4096

          def align(x,p=PAGE):
              return (x+p-1)//p*p

          def u32(b,o):
              return struct.unpack_from("<I",b,o)[0]

          def extract_boot(path,out):
              d=open(path,"rb").read()
              if d[:8] != b"ANDROID!":
                  return
              hs=u32(d,40)
              if hs < 3:
                  return

              k=u32(d,8)
              r=u32(d,12)

              # v3/v4: header is one page, kernel follows; ramdisk follows kernel.
              off=PAGE
              kernel_off=off
              ramdisk_off=align(kernel_off+k)

              os.makedirs(out,exist_ok=True)
              open(os.path.join(out,"kernel"),"wb").write(
                  d[kernel_off:kernel_off+k]
              )
              open(os.path.join(out,"ramdisk.lz4"),"wb").write(
                  d[ramdisk_off:ramdisk_off+r]
              )

          def extract_vendor_boot(path,out):
              d=open(path,"rb").read()
              if d[:8] != b"VNDRBOOT":
                  raise SystemExit("not vendor_boot")
              page=u32(d,12)
              ramdisk_size=u32(d,24)
              ramdisk_off=page
              dtb_off=ramdisk_off + ((ramdisk_size+page-1)//page*page)

              os.makedirs(out,exist_ok=True)
              open(os.path.join(out,"vendor_ramdisk.lz4"),"wb").write(
                  d[ramdisk_off:ramdisk_off+ramdisk_size]
              )
              # v4 stores DTB immediately after aligned vendor ramdisk.
              if dtb_off < len(d):
                  # DTB size is obtained from v4 header/table area when possible;
                  # keep remaining bytes as a raw candidate for later analysis.
                  open(os.path.join(out,"vendor_boot_after_ramdisk.bin"),"wb").write(
                      d[dtb_off:]
                  )

          for p in sys.argv[1:]:
              base=os.path.basename(p)
              out=os.path.join("analysis/recovery",base.replace(".img",""))
              if base=="boot.img" or base=="init_boot.img":
                  extract_boot(p,out)
              elif base=="vendor_boot.img":
                  extract_vendor_boot(p,out)
          PY

          for name in boot.img vendor_boot.img init_boot.img; do
            img="analysis/partitions/$name"
            [ -f "$img" ] || continue
            python3 analysis/scripts/extract_boot.py "$img"
          done

          find analysis/recovery -type f -printf '%p\t%s bytes\n' \
            | sort > analysis/reports/BOOT_EXTRACTED_COMPONENTS.txt

      - name: Decompress recovery ramdisks and extract CPIO
        shell: bash
        run: |
          set -euo pipefail

          for dir in analysis/recovery/*; do
            [ -d "$dir" ] || continue

            for f in "$dir"/*.lz4; do
              [ -f "$f" ] || continue

              out="${f%.lz4}.cpio"

              # Android ramdisks use legacy LZ4. Try the system decoder first.
              if lz4 -d -f "$f" "$out" >/dev/null 2>&1; then
                :
              else
                echo "lz4 command failed for $f; trying python lz4.frame"
                python3 - "$f" "$out" <<'PY'
          import sys, lz4.frame
          src=open(sys.argv[1],"rb").read()
          try:
              dst=lz4.frame.decompress(src)
          except Exception:
              raise SystemExit("Unable to decode LZ4 ramdisk")
          open(sys.argv[2],"wb").write(dst)
          PY
              fi

              root="${f%.lz4}_root"
              mkdir -p "$root"
              (
                cd "$root"
                cpio -idm --no-absolute-filenames < "../$(basename "$out")"
              )
            done
          done

          find analysis/recovery -type f \
            -printf '%p\t%s bytes\n' \
            | sort > analysis/reports/RECOVERY_RAMDISK_FILES.txt

      - name: Analyze DTBO and device trees
        shell: bash
        run: |
          set -euo pipefail

          : > analysis/reports/DTBO_ANALYSIS.txt

          if [ -f analysis/partitions/dtbo.img ]; then
            file analysis/partitions/dtbo.img \
              | tee -a analysis/reports/DTBO_ANALYSIS.txt

            strings -a analysis/partitions/dtbo.img \
              | grep -Ei 'beryl|mt6855|mediatek|pinctrl|ufs|display|panel|dsi|charger|usb' \
              | sort -u \
              >> analysis/reports/DTBO_ANALYSIS.txt \
              || true
          fi

          for dtb in \
            analysis/recovery/vendor_boot/vendor_boot_after_ramdisk.bin \
            analysis/partitions/*.dtb \
            analysis/recovery/vendor_boot/*.dtb; do
            [ -f "$dtb" ] || continue

            echo "===== $dtb =====" >> analysis/reports/DTB_STRINGS.txt
            strings -a "$dtb" \
              | grep -Ei 'beryl|mt6855|mediatek|pinctrl|ufs|display|panel|dsi|charger|usb' \
              | sort -u \
              >> analysis/reports/DTB_STRINGS.txt \
              || true

            if dtc -I dtb -O dts -o "${dtb}.dts" "$dtb" 2>/dev/null; then
              grep -Ei \
                'compatible|model|mediatek|mt6855|ufs|display|panel|charger|usb|pinctrl|firmware' \
                "${dtb}.dts" \
                >> analysis/reports/DTB_MATCHES.txt \
                || true
            fi
          done

      - name: Analyze filesystem partitions
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p analysis/extracted

          cat > analysis/scripts/extract_fs.sh <<'SH'
          set -euo pipefail

          img="$1"
          name="$(basename "$img" .img)"
          out="analysis/extracted/$name"
          mkdir -p "$out"

          type="$(file -b "$img")"
          echo "===== $name =====" >> analysis/reports/FILESYSTEM_ANALYSIS.txt
          echo "$type" >> analysis/reports/FILESYSTEM_ANALYSIS.txt

          # Android sparse image.
          if echo "$type" | grep -qi 'Android sparse'; then
            raw="$out/${name}.raw.img"
            if simg2img "$img" "$raw"; then
              img="$raw"
              type="$(file -b "$img")"
            fi
          fi

          if echo "$type" | grep -qi 'EROFS'; then
            if command -v extract.erofs >/dev/null 2>&1; then
              extract.erofs "$img" "$out" \
                >> analysis/reports/FILESYSTEM_ANALYSIS.txt 2>&1 \
                || true
            elif fsck.erofs --help 2>&1 | grep -q -- '--extract'; then
              fsck.erofs --extract="$out" "$img" \
                >> analysis/reports/FILESYSTEM_ANALYSIS.txt 2>&1 \
                || true
            fi
          elif echo "$type" | grep -qi 'ext4'; then
            # debugfs works without mounting and therefore without privileged mounts.
            debugfs -R "rdump / $out" "$img" \
              >> analysis/reports/FILESYSTEM_ANALYSIS.txt 2>&1 \
              || true
          elif echo "$type" | grep -qi 'F2FS'; then
            # Keep metadata and strings for F2FS; recovery-critical files are
            # normally obtained from the extracted vendor/system partitions.
            strings -a "$img" \
              | grep -Ei 'fstab|init\.|recovery|beryl|mt6855|encrypt|avb' \
              | head -n 1000 \
              >> analysis/reports/FILESYSTEM_ANALYSIS.txt \
              || true
          else
            echo "No supported filesystem extractor selected." \
              >> analysis/reports/FILESYSTEM_ANALYSIS.txt
          fi

          find "$out" -type f \
            -printf '%p\t%s bytes\n' \
            | sort > "analysis/reports/${name}_FILES.txt"
          SH

          : > analysis/reports/FILESYSTEM_ANALYSIS.txt

          for img in analysis/partitions/*.img; do
            [ -f "$img" ] || continue
            name="$(basename "$img")"

            case "$name" in
              boot.img|vendor_boot.img|init_boot.img|dtbo.img|vbmeta*.img)
                continue
                ;;
            esac

            bash analysis/scripts/extract_fs.sh "$img"
          done

      - name: Analyze super partition and logical partitions
        shell: bash
        run: |
          set -euo pipefail

          SUPER="$(find analysis/partitions -maxdepth 1 -type f -iname 'super.img' -print -quit || true)"

          if [ -z "$SUPER" ]; then
            echo "No super.img found in ROM." \
              | tee analysis/reports/SUPER_ANALYSIS.txt
            exit 0
          fi

          echo "===== lpdump =====" > analysis/reports/SUPER_ANALYSIS.txt
          lpdump "$SUPER" >> analysis/reports/SUPER_ANALYSIS.txt 2>&1 || true

          mkdir -p analysis/super
          lpunpack "$SUPER" analysis/super \
            >> analysis/reports/SUPER_ANALYSIS.txt 2>&1 \
            || true

          find analysis/super -type f \
            -printf '%p\t%s bytes\n' \
            | sort > analysis/reports/SUPER_EXTRACTED_FILES.txt

          for img in analysis/super/*.img; do
            [ -f "$img" ] || continue
            cp -f "$img" "analysis/partitions/$(basename "$img")" || true
          done

      - name: Search every stock partition for recovery components
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# Stock Recovery Component Search"
            echo
            echo "## Exact binary names"
          } > analysis/reports/RECOVERY_COMPONENT_SEARCH.md

          find analysis -type f \
            \( -name 'mtk_plpath_utils' \
            -o -name 'init.recovery*.rc' \
            -o -name 'fstab.*' \
            -o -name 'modules.load.recovery' \
            -o -name 'modules.dep' \
            -o -name 'modules.alias' \
            -o -name 'modules.softdep' \) \
            -print \
            | sort \
            >> analysis/reports/RECOVERY_COMPONENT_SEARCH.md

          echo >> analysis/reports/RECOVERY_COMPONENT_SEARCH.md
          echo "## Filename/content matches" >> analysis/reports/RECOVERY_COMPONENT_SEARCH.md

          grep -RIl \
            --exclude='*.dts' \
            -E 'mtk_plpath_utils|init\.recovery|modules\.load\.recovery|fstab\.mt6855|fstab\.emmc' \
            analysis/rom_extract \
            analysis/payload \
            analysis/extracted \
            analysis/recovery \
            2>/dev/null \
            | sort -u \
            >> analysis/reports/RECOVERY_COMPONENT_SEARCH.md \
            || true

          echo >> analysis/reports/RECOVERY_COMPONENT_SEARCH.md
          echo "## All mtk_plpath_utils references" >> analysis/reports/RECOVERY_COMPONENT_SEARCH.md

          grep -RIn \
            -E 'mtk_plpath_utils|plpath' \
            analysis \
            2>/dev/null \
            | head -n 5000 \
            >> analysis/reports/RECOVERY_COMPONENT_SEARCH.md \
            || true

      - name: Build ELF dependency map
        shell: bash
        run: |
          set -euo pipefail

          : > analysis/reports/ELF_DEPENDENCIES.txt

          find analysis/recovery analysis/extracted -type f \
            -print0 2>/dev/null \
            | while IFS= read -r -d '' elf; do

              if ! file -b "$elf" | grep -q 'ELF'; then
                continue
              fi

              echo "===== $elf =====" >> analysis/reports/ELF_DEPENDENCIES.txt

              readelf -l "$elf" 2>/dev/null \
                | grep -E 'Requesting program interpreter|INTERP' \
                >> analysis/reports/ELF_DEPENDENCIES.txt \
                || true

              readelf -d "$elf" 2>/dev/null \
                | grep 'NEEDED' \
                >> analysis/reports/ELF_DEPENDENCIES.txt \
                || true

              echo >> analysis/reports/ELF_DEPENDENCIES.txt
            done

      - name: Analyze vendor_boot recovery modules
        shell: bash
        run: |
          set -euo pipefail

          : > analysis/reports/RECOVERY_MODULE_ANALYSIS.md

          for root in analysis/recovery/*_root; do
            [ -d "$root" ] || continue

            echo "# $root" >> analysis/reports/RECOVERY_MODULE_ANALYSIS.md

            for f in \
              "$root/modules.load.recovery" \
              "$root/lib/modules/modules.load.recovery" \
              "$root/vendor/lib/modules/modules.load.recovery"; do

              if [ -f "$f" ]; then
                echo >> analysis/reports/RECOVERY_MODULE_ANALYSIS.md
                echo "## $f" >> analysis/reports/RECOVERY_MODULE_ANALYSIS.md
                cat "$f" >> analysis/reports/RECOVERY_MODULE_ANALYSIS.md
              fi
            done

            find "$root" -type f -name '*.ko' \
              -printf '%P\n' \
              | sort \
              >> analysis/reports/RECOVERY_MODULE_ANALYSIS.md
          done

          find analysis/recovery -type f -name '*.ko' \
            -exec sha256sum {} \; \
            | sort > analysis/reports/RECOVERY_MODULE_SHA256.txt

      - name: Compare stock recovery requirements with current device tree
        shell: bash
        run: |
          set -euo pipefail

          TREE="$DEVICE_PATH"
          {
            echo "# Beryl Recovery Requirements"
            echo
            echo "Generated from:"
            echo "- ROM: $ROM_NAME"
            echo "- ROM URL: $ROM_URL"
            echo "- Device: $DEVICE"
            echo
            echo "This report is analytical only. This workflow does not modify the device tree."
            echo
            echo "## Current tree"
            echo
          } > analysis/reports/RECOVERY_REQUIREMENTS.md

          if [ -d "$TREE" ]; then
            echo "Current tree exists: $TREE" \
              >> analysis/reports/RECOVERY_REQUIREMENTS.md
          else
            echo "Current tree is missing: $TREE" \
              >> analysis/reports/RECOVERY_REQUIREMENTS.md
          fi

          echo >> analysis/reports/RECOVERY_REQUIREMENTS.md
          echo "## Stock recovery files" \
            >> analysis/reports/RECOVERY_REQUIREMENTS.md

          find analysis/recovery analysis/extracted \
            -type f \
            | sed 's#^analysis/##' \
            | sort \
            | head -n 10000 \
            >> analysis/reports/RECOVERY_REQUIREMENTS.md

          echo >> analysis/reports/RECOVERY_REQUIREMENTS.md
          echo "## Files currently present in device tree recovery/root" \
            >> analysis/reports/RECOVERY_REQUIREMENTS.md

          if [ -d "$TREE/recovery/root" ]; then
            find "$TREE/recovery/root" -type f \
              | sort \
              >> analysis/reports/RECOVERY_REQUIREMENTS.md
          else
            echo "recovery/root is missing" \
              >> analysis/reports/RECOVERY_REQUIREMENTS.md
          fi

          {
            echo
            echo "## Specifically required investigation targets"
            echo
            echo "- mtk_plpath_utils"
            echo "- init.recovery.hardware.rc"
            echo "- init.recovery.mt6855.rc"
            echo "- init.recovery.project.rc"
            echo "- fstab.mt6855"
            echo "- fstab.emmc"
            echo "- modules.load.recovery"
            echo "- modules.dep"
            echo "- modules.softdep"
            echo "- recovery SELinux policy"
            echo "- recovery linker configuration"
            echo "- recovery libraries"
            echo "- MTK UFS / display / USB / PMIC modules"
            echo "- firmware referenced by recovery modules"
            echo "- DTBO / vendor_boot DTB dependencies"
            echo
            echo "## mtk_plpath_utils exact matches"
          } >> analysis/reports/RECOVERY_REQUIREMENTS.md

          find analysis -type f -name 'mtk_plpath_utils' -print \
            | sort \
            >> analysis/reports/RECOVERY_REQUIREMENTS.md \
            || true

          grep -RIn \
            -E 'mtk_plpath_utils|plpath' \
            analysis \
            2>/dev/null \
            | head -n 5000 \
            >> analysis/reports/RECOVERY_REQUIREMENTS.md \
            || true

      - name: Generate missing-from-tree report
        shell: bash
        run: |
          set -euo pipefail

          TREE="$DEVICE_PATH"
          : > analysis/reports/MISSING_FROM_TREE.md

          echo "# Missing / Unverified Recovery Components" \
            >> analysis/reports/MISSING_FROM_TREE.md
          echo >> analysis/reports/MISSING_FROM_TREE.md

          check_path() {
            local rel="$1"
            if [ -e "$TREE/$rel" ]; then
              printf '%-7s %s\n' "PRESENT" "$rel"
            else
              printf '%-7s %s\n' "MISSING" "$rel"
            fi
          }

          {
            check_path "recovery/root"
            check_path "recovery/root/init.recovery.hardware.rc"
            check_path "recovery/root/init.recovery.mt6855.rc"
            check_path "recovery/root/init.recovery.project.rc"
            check_path "recovery/root/first_stage_ramdisk/fstab.mt6855"
            check_path "recovery/root/first_stage_ramdisk/fstab.emmc"
            check_path "recovery/root/lib/modules"
            check_path "mtk_plpath_utils"
            check_path "prebuilt/kernel"
            check_path "prebuilt/beryl.dtb"
          } >> analysis/reports/MISSING_FROM_TREE.md

          echo >> analysis/reports/MISSING_FROM_TREE.md
          echo "## Exact stock binary locations" \
            >> analysis/reports/MISSING_FROM_TREE.md

          find analysis -type f \
            \( -name 'mtk_plpath_utils' \
            -o -name 'init.recovery.project.rc' \
            -o -name 'modules.load.recovery' \) \
            -print \
            | sort \
            >> analysis/reports/MISSING_FROM_TREE.md \
            || true

      - name: Generate recovery dependency summary
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# Beryl Recovery Dependency Summary"
            echo
            echo "## Recovery architecture indicators"
            echo
            grep -Ei \
              'vendor_boot|header|ramdisk|recovery|GKI|mt6855|dynamic|AVB|F2FS' \
              analysis/reports/BOOT_IMAGE_DETAILS.txt \
              analysis/reports/ROM_CONTENTS.txt \
              analysis/reports/DTBO_ANALYSIS.txt \
              2>/dev/null \
              | head -n 5000 \
              || true

            echo
            echo "## Recovery modules"
            echo
            cat analysis/reports/RECOVERY_MODULE_ANALYSIS.md 2>/dev/null || true

            echo
            echo "## ELF dependencies"
            echo
            cat analysis/reports/ELF_DEPENDENCIES.txt 2>/dev/null || true

            echo
            echo "## Recovery component search"
            echo
            cat analysis/reports/RECOVERY_COMPONENT_SEARCH.md 2>/dev/null || true
          } > analysis/reports/RECOVERY_DEPENDENCIES.md

      - name: Generate final machine-readable summary
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json, os, glob

          records=[]
          p="analysis/reports/partition_inventory.jsonl"
          if os.path.exists(p):
              for line in open(p):
                  line=line.strip()
                  if line:
                      records.append(json.loads(line))

          summary={
              "device": os.environ.get("DEVICE","beryl"),
              "rom_name": os.environ.get("ROM_NAME"),
              "rom_url": os.environ.get("ROM_URL"),
              "partition_count": len(records),
              "partitions": records,
              "reports": sorted(
                  os.path.relpath(x,"analysis/reports")
                  for x in glob.glob("analysis/reports/*")
                  if os.path.isfile(x)
              ),
          }

          json.dump(
              summary,
              open("analysis/reports/analysis_summary.json","w"),
              indent=2,
              sort_keys=True
          )
          PY

      - name: Show key findings in Actions log
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "================ KEY FINDINGS ================"
          echo
          echo "Partition inventory:"
          cat analysis/reports/PARTITION_IMAGE_LIST.txt || true
          echo
          echo "Recovery component matches:"
          grep -RIn \
            -E 'mtk_plpath_utils|modules.load.recovery|init.recovery|fstab.mt6855' \
            analysis/reports \
            2>/dev/null \
            | head -n 200 \
            || true
          echo
          echo "Missing/unverified tree components:"
          cat analysis/reports/MISSING_FROM_TREE.md || true
          echo
          echo "================================================"

      - name: Upload complete stock analysis
        uses: actions/upload-artifact@v4
        with:
          name: beryl-stock-rom-recovery-analysis
          path: |
            analysis/reports/
            analysis/recovery/
            analysis/extracted/
            analysis/super/
          if-no-files-found: warn
          retention-days: 14
