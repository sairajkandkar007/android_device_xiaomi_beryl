name: Generate beryl Universal Recovery Device Tree

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04

    env:
      DEVICE: beryl
      VENDOR: xiaomi
      TREE: device/xiaomi/beryl

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git curl wget python3 python3-pip python3-venv \
            python3-yaml cpio lz4 liblz4-tool xz-utils gzip \
            unzip file rsync device-tree-compiler binutils gawk zstd

          python3 --version
          git --version
          lz4 --version | head -1
          cpio --version | head -1
          dtc --version

      - name: Validate workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          path = Path(".github/workflows/main.yml")
          with path.open("r", encoding="utf-8") as f:
              yaml.safe_load(f)

          print("Workflow YAML syntax: OK")
          PY

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf stock work generated .venv
          mkdir -p stock work generated

      - name: Download stock files
        shell: bash
        run: |
          set -euo pipefail

          download() {
            local id="$1"
            local name="$2"

            echo
            echo "=========================================="
            echo "Downloading: $name"
            echo "PixelDrain ID: $id"
            echo "=========================================="

            curl \
              --fail \
              --location \
              --retry 10 \
              --retry-delay 5 \
              --connect-timeout 30 \
              --output "stock/$name" \
              "https://pixeldrain.com/api/file/$id?download"

            test -s "stock/$name"
            ls -lh "stock/$name"
          }

          download "NchNVhH6" "boot.img"
          download "KdKehwxA" "vendor_boot.img"
          download "Ynu3y6Ai" "vendor_dlkm.img"
          download "tj28QSM9" "odm_dlkm.img"
          download "VGYNgUbF" "dtbo.img"
          download "6itKKkne" "vbmeta.img"
          download "49XQu8yU" "vbmeta_system.img"
          download "J8PcuWZH" "vbmeta_vendor.img"

      - name: Verify downloaded files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== FILES ====="
          ls -lh stock/

          echo
          echo "===== FILE TYPES ====="
          for f in stock/*.img; do
            file "$f"
          done

          echo
          echo "===== SHA256 ====="
          sha256sum stock/*.img | tee stock/SHA256SUMS.txt

      - name: Verify boot header v4
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import struct
          from pathlib import Path

          data = Path("stock/boot.img").read_bytes()

          if data[:8] != b"ANDROID!":
              raise SystemExit("Invalid Android boot image")

          kernel_size = struct.unpack_from("<I", data, 8)[0]
          ramdisk_size = struct.unpack_from("<I", data, 12)[0]
          os_version = struct.unpack_from("<I", data, 16)[0]
          header_size = struct.unpack_from("<I", data, 20)[0]
          header_version = struct.unpack_from("<I", data, 40)[0]

          print("boot.img")
          print("  kernel size   :", kernel_size)
          print("  ramdisk size  :", ramdisk_size)
          print("  os version    :", hex(os_version))
          print("  header size   :", header_size)
          print("  header version:", header_version)
          print("  page size     :", 4096)

          if header_version != 4:
              raise SystemExit(f"Expected boot header v4, got {header_version}")
          if kernel_size == 0:
              raise SystemExit("Kernel size is zero")
          if ramdisk_size == 0:
              raise SystemExit("Ramdisk size is zero")

          print("BOOT HEADER OK")
          PY

      - name: Verify vendor_boot header v4
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import struct
          from pathlib import Path

          data = Path("stock/vendor_boot.img").read_bytes()

          if data[:8] != b"VNDRBOOT":
              raise SystemExit("Invalid vendor_boot image")

          header_version = struct.unpack_from("<I", data, 8)[0]
          page_size = struct.unpack_from("<I", data, 12)[0]
          ramdisk_size = struct.unpack_from("<I", data, 24)[0]
          dtb_size = struct.unpack_from("<I", data, 28)[0]
          table_size = struct.unpack_from("<I", data, 44)[0]
          table_entries = struct.unpack_from("<I", data, 48)[0]

          print("vendor_boot.img")
          print("  header version:", header_version)
          print("  page size     :", page_size)
          print("  ramdisk size  :", ramdisk_size)
          print("  DTB size      :", dtb_size)
          print("  table size    :", table_size)
          print("  table entries :", table_entries)

          if header_version != 4:
              raise SystemExit(f"Expected vendor_boot v4, got {header_version}")
          if page_size != 4096:
              raise SystemExit(f"Expected 4096 page size, got {page_size}")
          if ramdisk_size == 0:
              raise SystemExit("vendor ramdisk size is zero")

          print("VENDOR_BOOT HEADER OK")
          PY

      - name: Install twrpdtgen
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv .venv
          . .venv/bin/activate

          python -m pip install --upgrade pip
          python -m pip install twrpdtgen==3.0.0

          python -m twrpdtgen --help

      - name: Verify BuildProp API
        shell: bash
        run: |
          set -euo pipefail

          . .venv/bin/activate

          python3 <<'PY'
          from sebaubuntu_libs.libandroid.props import BuildProp

          print("BuildProp class:", BuildProp)

          attrs = [x for x in dir(BuildProp) if "prop" in x.lower()]
          print("Property methods:", attrs)

          if not hasattr(BuildProp, "set_prop"):
              raise SystemExit("BuildProp.set_prop() is unavailable")

          print("BuildProp.set_prop(): OK")
          PY

      - name: Patch twrpdtgen for beryl GKI boot
        shell: bash
        run: |
          set -euo pipefail

          . .venv/bin/activate

          DTGEN_DIR="$(
            python3 - <<'PY'
          import twrpdtgen
          from pathlib import Path
          print(Path(twrpdtgen.__file__).resolve().parent)
          PY
          )"

          TARGET="$DTGEN_DIR/device_tree.py"
          cp "$TARGET" "$TARGET.original"

          python3 - "$TARGET" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          location = (
              'Path("system") / "etc" / '
              '"ramdisk" / "build.prop"'
          )

          if location not in text:
              marker = "BUILDPROP_LOCATIONS = ["
              start = text.find(marker)

              if start < 0:
                  raise SystemExit("BUILDPROP_LOCATIONS not found")

              insert_at = text.find("\n", start)

              text = (
                  text[:insert_at + 1]
                  + "    "
                  + location
                  + ",\n"
                  + text[insert_at + 1:]
              )

          needle = (
              "self.device_info = "
              "DeviceInfo(self.build_prop)"
          )

          if needle not in text:
              raise SystemExit(
                  "DeviceInfo initialization not found"
              )

          replacement = """
        # beryl GKI hardware fallbacks

        fallback_props = {
            "ro.product.board": "mt6855",
            "ro.board.platform": "mt6855",

            "ro.bionic.arch": "arm64",
            "ro.bionic.cpu_variant": "generic",

            "ro.bionic.2nd_arch": "arm",
            "ro.bionic.2nd_cpu_variant": "generic",

            "ro.product.device": "beryl",
            "ro.product.system.device": "beryl",
            "ro.product.vendor.device": "beryl",
            "ro.product.product.device": "beryl",
            "ro.product.system_ext.device": "beryl",
            "ro.product.system_dlkm.device": "beryl",
            "ro.product.vendor_dlkm.device": "beryl",
            "ro.product.odm.device": "beryl",
            "ro.product.odm_dlkm.device": "beryl",

            "ro.product.brand": "POCO",
            "ro.product.manufacturer": "Xiaomi",
            "ro.product.model": "POCO M7 Pro 5G",

            "ro.build.ab_update": "true",
            "ro.boot.dynamic_partitions": "true",
            "ro.virtual_ab.enabled": "true",

            "ro.system.product.cpu.abilist":
                "arm64-v8a,armeabi-v7a,armeabi",

            "ro.product.cpu.abilist":
                "arm64-v8a,armeabi-v7a,armeabi",

            "ro.product.cpu.abilist64":
                "arm64-v8a",

            "ro.product.cpu.abilist32":
                "armeabi-v7a,armeabi",

            "ro.minui.pixel_format":
                "RGBA_8888",

            "ro.product.first_api_level":
                "31",

            "ro.build.version.sdk":
                "31",

            "ro.build.version.release":
                "12",

            "ro.build.system_root_image":
                "true",
        }

        for _key, _value in fallback_props.items():
            self.build_prop.set_prop(
                _key,
                _value
            )

"""

          text = text.replace(
              needle,
              replacement + needle,
              1
          )

          path.write_text(text, encoding="utf-8")
          print("twrpdtgen patched successfully")
          PY

          python3 -m py_compile "$TARGET"
          echo "twrpdtgen Python syntax: OK"

      - name: Extract boot image
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/boot

          python3 <<'PY'
          from pathlib import Path
          import struct
          import subprocess

          image = Path("stock/boot.img")
          out = Path("work/boot")
          data = image.read_bytes()

          if data[:8] != b"ANDROID!":
              raise SystemExit("Invalid boot image")

          kernel_size = struct.unpack_from("<I", data, 8)[0]
          ramdisk_size = struct.unpack_from("<I", data, 12)[0]
          header_version = struct.unpack_from("<I", data, 40)[0]

          if header_version != 4:
              raise SystemExit(
                  f"Expected boot header v4, got {header_version}"
              )

          page = 4096
          kernel_off = page
          ramdisk_off = (
              kernel_off
              + ((kernel_size + page - 1) // page) * page
          )

          kernel = data[
              kernel_off:
              kernel_off + kernel_size
          ]

          ramdisk = data[
              ramdisk_off:
              ramdisk_off + ramdisk_size
          ]

          (out / "kernel").write_bytes(kernel)
          (out / "ramdisk.lz4").write_bytes(ramdisk)

          print("kernel:", len(kernel))
          print("ramdisk:", len(ramdisk))

          raw = out / "ramdisk.raw"

          normal = subprocess.run(
              [
                  "lz4", "-d", "-f",
                  str(out / "ramdisk.lz4"),
                  str(raw)
              ],
              capture_output=True,
              text=True
          )

          if normal.returncode != 0:
              print("Standard LZ4 failed; trying legacy block stream")

              source = ramdisk
              magic = b"\x02\x21\x4c\x18"
              position = 0
              decoded = bytearray()
              blocks = 0

              while True:
                  index = source.find(magic, position)

                  if index < 0:
                      break

                  if index + 8 > len(source):
                      break

                  size = int.from_bytes(
                      source[index + 4:index + 8],
                      "little"
                  )

                  start = index + 8
                  end = start + size

                  if end > len(source):
                      break

                  block = (
                      magic
                      + size.to_bytes(4, "little")
                      + source[start:end]
                  )

                  block_in = out / f"block_{blocks}.lz4"
                  block_out = out / f"block_{blocks}.raw"

                  block_in.write_bytes(block)

                  subprocess.run(
                      [
                          "lz4", "-d", "-f",
                          str(block_in),
                          str(block_out)
                      ],
                      check=True
                  )

                  decoded.extend(block_out.read_bytes())

                  position = end
                  blocks += 1

              if not decoded:
                  raise SystemExit(
                      "Unable to decode boot ramdisk"
                  )

              raw.write_bytes(decoded)
              print("Decoded", blocks, "legacy LZ4 blocks")

          ramdisk_dir = out / "ramdisk"
          ramdisk_dir.mkdir(parents=True, exist_ok=True)

          with raw.open("rb") as stream:
              subprocess.run(
                  ["cpio", "-idmuv"],
                  cwd=ramdisk_dir,
                  stdin=stream,
                  check=True
              )

          print("boot ramdisk extracted")
          PY

          find work/boot/ramdisk -type f | sort

      - name: Generate initial TWRP tree
        shell: bash
        run: |
          set -euo pipefail

          . .venv/bin/activate

          rm -rf generated

          python -m twrpdtgen \
            -o generated \
            stock/boot.img

          echo "===== GENERATED TREE ====="
          find generated -maxdepth 5 -type f | sort

      - name: Locate generated device tree
        shell: bash
        run: |
          set -euo pipefail

          TREE_SOURCE="$(
            find generated \
              -type f \
              -name BoardConfig.mk \
              -print \
              | head -1 \
              | xargs -r dirname
          )"

          if [ -z "$TREE_SOURCE" ]; then
            echo "ERROR: BoardConfig.mk was not generated"
            exit 1
          fi

          echo "Generated tree: $TREE_SOURCE"
          echo "$TREE_SOURCE" > work/generated_tree_path.txt

      - name: Extract vendor_boot
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import struct
          import subprocess
          import shutil

          image = Path("stock/vendor_boot.img")
          output = Path("work/vendor_boot")

          output.mkdir(parents=True, exist_ok=True)

          data = image.read_bytes()

          if data[:8] != b"VNDRBOOT":
              raise SystemExit("Invalid vendor_boot image")

          page = struct.unpack_from("<I", data, 12)[0]
          ramdisk_size = struct.unpack_from("<I", data, 24)[0]
          dtb_size = struct.unpack_from("<I", data, 28)[0]
          table_size = struct.unpack_from("<I", data, 44)[0]
          table_entries = struct.unpack_from("<I", data, 48)[0]

          def align(value, alignment):
              return (
                  (value + alignment - 1)
                  // alignment
                  * alignment
              )

          ramdisk_offset = page

          dtb_offset = align(
              ramdisk_offset + ramdisk_size,
              page
          )

          table_offset = align(
              dtb_offset + dtb_size,
              page
          )

          ramdisk = data[
              ramdisk_offset:
              ramdisk_offset + ramdisk_size
          ]

          dtb = data[
              dtb_offset:
              dtb_offset + dtb_size
          ]

          table = data[
              table_offset:
              table_offset + table_size
          ]

          (output / "vendor_ramdisk.lz4").write_bytes(ramdisk)
          (output / "dtb.img").write_bytes(dtb)
          (output / "vendor_ramdisk_table.bin").write_bytes(table)

          print("vendor ramdisk:", len(ramdisk))
          print("DTB:", len(dtb))
          print("ramdisk table:", len(table))
          print("table entries:", table_entries)

          raw = output / "vendor_ramdisk.cpio"

          normal = subprocess.run(
              [
                  "lz4", "-d", "-f",
                  str(output / "vendor_ramdisk.lz4"),
                  str(raw)
              ],
              capture_output=True,
              text=True
          )

          if normal.returncode != 0:
              print("Normal LZ4 failed.")

              source = ramdisk
              magic = b"\x02\x21\x4c\x18"
              position = 0
              decoded = bytearray()
              block_number = 0

              while True:
                  index = source.find(magic, position)

                  if index < 0:
                      break

                  if index + 8 > len(source):
                      break

                  size = int.from_bytes(
                      source[index + 4:index + 8],
                      "little"
                  )

                  start = index + 8
                  end = start + size

                  if end > len(source):
                      break

                  block = (
                      magic
                      + size.to_bytes(4, "little")
                      + source[start:end]
                  )

                  block_in = (
                      output /
                      f"block_{block_number}.lz4"
                  )

                  block_out = (
                      output /
                      f"block_{block_number}.raw"
                  )

                  block_in.write_bytes(block)

                  subprocess.run(
                      [
                          "lz4", "-d", "-f",
                          str(block_in),
                          str(block_out)
                      ],
                      check=True
                  )

                  decoded.extend(block_out.read_bytes())

                  position = end
                  block_number += 1

              if not decoded:
                  raise SystemExit(
                      "Could not decode vendor ramdisk"
                  )

              raw.write_bytes(decoded)

              print(
                  "Decoded",
                  block_number,
                  "legacy LZ4 blocks"
              )

          ramdisk_dir = output / "ramdisk"

          if ramdisk_dir.exists():
              shutil.rmtree(ramdisk_dir)

          ramdisk_dir.mkdir(parents=True)

          with raw.open("rb") as stream:
              subprocess.run(
                  ["cpio", "-idmuv"],
                  cwd=ramdisk_dir,
                  stdin=stream,
                  check=True
              )

          print("vendor_boot extraction: OK")
          PY

      - name: Inspect vendor ramdisk
        shell: bash
        run: |
          set -euo pipefail

          echo "===== VENDOR RAMDISK ====="
          find work/vendor_boot/ramdisk \
            -maxdepth 4 \
            -type f \
            | sort

          echo
          echo "===== RECOVERY MODULE LIST ====="

          if [ -f \
            work/vendor_boot/ramdisk/modules.load.recovery
          ]; then
            cat \
              work/vendor_boot/ramdisk/modules.load.recovery
          fi

          echo
          echo "===== FSTAB ====="

          find work/vendor_boot/ramdisk \
            -type f \
            \( \
              -name 'fstab.*' \
              -o \
              -name 'recovery.fstab' \
            \) \
            -print \
            -exec sh -c '
              echo "----- $1 -----"
              cat "$1"
            ' _ {} \;

      - name: Analyze stock properties
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/props

          find work \
            -type f \
            -name build.prop \
            -print \
            -exec cp {} work/props/ \; \
            || true

          echo "===== BUILD PROP FILES ====="
          find work/props -type f -print || true

          echo
          echo "===== BUILD PROP CONTENT ====="

          for f in work/props/*; do
            [ -f "$f" ] || continue
            echo
            echo "----- $f -----"
            cat "$f"
          done

      - name: Merge stock vendor_boot components
        shell: bash
        run: |
          set -euo pipefail

          TREE_SOURCE="$(
            cat work/generated_tree_path.txt
          )"

          mkdir -p \
            "$TREE_SOURCE/recovery/root" \
            "$TREE_SOURCE/prebuilt" \
            "$TREE_SOURCE/bootctrl" \
            "$TREE_SOURCE/mtk_plpath_utils"

          if [ -f work/vendor_boot/dtb.img ]; then
            cp \
              work/vendor_boot/dtb.img \
              "$TREE_SOURCE/prebuilt/beryl.dtb"
          fi

          if [ -d \
            work/vendor_boot/ramdisk/first_stage_ramdisk
          ]; then

            mkdir -p \
              "$TREE_SOURCE/recovery/root/first_stage_ramdisk"

            rsync -a \
              work/vendor_boot/ramdisk/first_stage_ramdisk/ \
              "$TREE_SOURCE/recovery/root/first_stage_ramdisk/"
          fi

          for f in \
            init.recovery.hardware.rc \
            init.recovery.mt6855.rc
          do
            if [ -f \
              "work/vendor_boot/ramdisk/$f"
            ]; then
              cp \
                "work/vendor_boot/ramdisk/$f" \
                "$TREE_SOURCE/recovery/root/"
            fi
          done

          if [ -d \
            work/vendor_boot/ramdisk/lib/modules
          ]; then

            mkdir -p \
              "$TREE_SOURCE/recovery/root/lib/modules"

            rsync -a \
              work/vendor_boot/ramdisk/lib/modules/ \
              "$TREE_SOURCE/recovery/root/lib/modules/"
          fi

          for f in \
            modules.alias \
            modules.dep \
            modules.softdep \
            modules.load \
            modules.load.recovery
          do
            if [ -f \
              "work/vendor_boot/ramdisk/$f"
            ]; then
              cp \
                "work/vendor_boot/ramdisk/$f" \
                "$TREE_SOURCE/recovery/root/"
            fi
          done

          echo "Vendor_boot components merged."

      - name: Install stock recovery fstab
        shell: bash
        run: |
          set -euo pipefail

          TREE_SOURCE="$(
            cat work/generated_tree_path.txt
          )"

          FSTAB="$(
            find \
              work/vendor_boot/ramdisk \
              -type f \
              \( \
                -name 'fstab.mt6855' \
                -o \
                -name 'fstab.*' \
              \) \
              | head -1
          )"

          if [ -z "$FSTAB" ]; then
            echo "No vendor fstab found"
            exit 1
          fi

          echo "Selected fstab: $FSTAB"

          cp \
            "$FSTAB" \
            "$TREE_SOURCE/recovery.fstab"

          echo
          echo "===== recovery.fstab ====="
          cat "$TREE_SOURCE/recovery.fstab"

      - name: Record mtk_plpath_utils requirements
        shell: bash
        run: |
          set -euo pipefail

          TREE_SOURCE="$(
            cat work/generated_tree_path.txt
          )"

          cat > \
            "$TREE_SOURCE/mtk_plpath_utils/STOCK_DISCOVERY.txt" \
            <<'EOF'
          Stock beryl vendor_boot recovery requirements.

          init.recovery.mt6855.rc executes:

          /system/bin/mtk_plpath_utils

          under the update_engine SELinux domain.

          The stock binary must be supplied separately during
          final proprietary blob extraction/build integration.

          This file intentionally does not fabricate a binary.
          EOF

      - name: Record bootctrl requirements
        shell: bash
        run: |
          set -euo pipefail

          TREE_SOURCE="$(
            cat work/generated_tree_path.txt
          )"

          cat > \
            "$TREE_SOURCE/bootctrl/BOOTCTRL_DISCOVERY.txt" \
            <<'EOF'
          beryl boot control discovery.

          Device:
            POCO M7 Pro 5G

          Codename:
            beryl

          Platform:
            mt6855

          Architecture:
            ARM64

          A/B:
            true

          Dynamic partitions:
            true

          GKI:
            true

          Boot header:
            v4

          Vendor boot header:
            v4

          IMPORTANT:

          Do not fabricate a boot-control implementation.

          The final bootctrl implementation must be derived from
          the stock/vendor boot-control HAL or ROM source used by
          the recovery build.
          EOF

      - name: Configure beryl BoardConfig
        shell: bash
        run: |
          set -euo pipefail

          TREE_SOURCE="$(
            cat work/generated_tree_path.txt
          )"

          cat > \
            "$TREE_SOURCE/BoardConfigRecovery.mk" \
            <<'EOF'
          # beryl recovery-specific configuration

          TARGET_ARCH := arm64
          TARGET_ARCH_VARIANT := armv8-a

          TARGET_CPU_ABI := arm64-v8a
          TARGET_CPU_ABI2 := armeabi-v7a

          TARGET_BOARD_PLATFORM := mt6855

          BOARD_BOOT_HEADER_VERSION := 4
          BOARD_VENDOR_BOOT_HEADER_VERSION := 4

          BOARD_KERNEL_PAGESIZE := 4096

          BOARD_BOOTIMAGE_PARTITION_SIZE := 134217728
          BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE := 67108864

          BOARD_SUPER_PARTITION_SIZE := 9126805504

          TARGET_USES_A/B := true
          AB_OTA_UPDATER := true

          BOARD_AVB_ENABLE := true

          BOARD_BUILD_SYSTEM_ROOT_IMAGE := true

          TARGET_USERIMAGES_USE_F2FS := true
          EOF

          cat \
            "$TREE_SOURCE/BoardConfigRecovery.mk" \
            >> "$TREE_SOURCE/BoardConfig.mk"

      - name: Create recovery product files
        shell: bash
        run: |
          set -euo pipefail

          TREE_SOURCE="$(
            cat work/generated_tree_path.txt
          )"

          cat > \
            "$TREE_SOURCE/twrp_beryl.mk" \
            <<'EOF'
          PRODUCT_DEVICE := beryl
          PRODUCT_NAME := twrp_beryl
          PRODUCT_BRAND := POCO
          PRODUCT_MODEL := POCO M7 Pro 5G
          PRODUCT_MANUFACTURER := Xiaomi

          $(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)
          EOF

          cat > \
            "$TREE_SOURCE/fox_beryl.mk" \
            <<'EOF'
          PRODUCT_DEVICE := beryl
          PRODUCT_NAME := fox_beryl
          PRODUCT_BRAND := POCO
          PRODUCT_MODEL := POCO M7 Pro 5G
          PRODUCT_MANUFACTURER := Xiaomi

          $(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)
          EOF

          cat > \
            "$TREE_SOURCE/AndroidProducts.mk" \
            <<'EOF'
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/twrp_beryl.mk \
              $(LOCAL_DIR)/fox_beryl.mk
          EOF

          cat > \
            "$TREE_SOURCE/board-info.txt" \
            <<'EOF'
          require board=beryl
          EOF

          cat > \
            "$TREE_SOURCE/system.prop" \
            <<'EOF'
          ro.product.device=beryl
          ro.product.board=mt6855
          ro.board.platform=mt6855
          EOF

      - name: Create recovery vendorsetup
        shell: bash
        run: |
          set -euo pipefail

          TREE_SOURCE="$(
            cat work/generated_tree_path.txt
          )"

          cat > \
            "$TREE_SOURCE/vendorsetup.sh" \
            <<'EOF'
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=1

          add_lunch_combo twrp_beryl-eng
          add_lunch_combo fox_beryl-eng
          EOF

      - name: Create tree README
        shell: bash
        run: |
          set -euo pipefail

          TREE_SOURCE="$(
            cat work/generated_tree_path.txt
          )"

          cat > \
            "$TREE_SOURCE/README_STOCK_DERIVED.md" \
            <<'EOF'
          # POCO M7 Pro 5G — beryl

          Stock-derived recovery device tree.

          ## Hardware

          - Device: POCO M7 Pro 5G
          - Codename: beryl
          - Platform: MediaTek MT6855
          - Architecture: ARM64
          - Boot header: v4
          - Vendor boot header: v4
          - A/B: yes
          - Dynamic partitions: yes
          - GKI: yes
          - AVB: yes
          - UFS: yes
          - Userdata: F2FS

          ## Source

          Initial tree generated from the supplied stock boot
          image with twrpdtgen, then corrected using the supplied
          stock vendor_boot image.

          ## Validation still required

          - bootctrl implementation
          - mtk_plpath_utils
          - recovery SELinux policy
          - vendor_boot recovery integration
          - kernel modules
          - DTB/DTBO handling
          - TWRP 12.1 packaging
          - OrangeFox 12.1 packaging
          - AVB/vbmeta behavior

          Missing proprietary components are not fabricated.
          EOF

      - name: Install final device tree
        shell: bash
        run: |
          set -euo pipefail

          TREE_SOURCE="$(
            cat work/generated_tree_path.txt
          )"

          FINAL="$TREE"

          rm -rf "$FINAL"
          mkdir -p "$(dirname "$FINAL")"

          rsync -a \
            "$TREE_SOURCE/" \
            "$FINAL/"

          echo "Final tree: $FINAL"

      - name: Clean generated tree
        shell: bash
        run: |
          set -euo pipefail

          find "$TREE" \
            -name "*.original" \
            -delete

          find "$TREE" \
            -name "__pycache__" \
            -type d \
            -prune \
            -exec rm -rf {} +

          rm -f \
            "$TREE/BoardConfigRecovery.mk"

      - name: Save stock metadata
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$TREE/prebuilt"

          cp \
            stock/SHA256SUMS.txt \
            "$TREE/prebuilt/STOCK_SHA256SUMS.txt"

          python3 <<'PY'
          from pathlib import Path
          import struct

          boot = Path("stock/boot.img").read_bytes()
          vendor_boot = Path("stock/vendor_boot.img").read_bytes()

          boot_header = struct.unpack_from(
              "<I", boot, 40
          )[0]

          vendor_header = struct.unpack_from(
              "<I", vendor_boot, 8
          )[0]

          text = f"""beryl stock image metadata

          boot.img:
            size: {len(boot)}
            header: {boot_header}
            page size: 4096

          vendor_boot.img:
            size: {len(vendor_boot)}
            header: {vendor_header}

          Device:
            beryl

          Platform:
            mt6855

          Architecture:
            arm64

          A/B:
            true

          Dynamic partitions:
            true

          GKI:
            true

          AVB:
            true
          """

          Path(
              "device/xiaomi/beryl/prebuilt/STOCK_METADATA.txt"
          ).write_text(text, encoding="utf-8")
          PY

      - name: Validate final tree
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINAL DEVICE TREE"
          echo "=========================================="

          find "$TREE" \
            -maxdepth 5 \
            -print \
            | sort

          echo
          echo "=========================================="
          echo "REQUIRED FILES"
          echo "=========================================="

          required=(
            "$TREE/BoardConfig.mk"
            "$TREE/AndroidProducts.mk"
            "$TREE/device.mk"
            "$TREE/recovery.fstab"
            "$TREE/twrp_beryl.mk"
            "$TREE/fox_beryl.mk"
            "$TREE/vendorsetup.sh"
            "$TREE/bootctrl/BOOTCTRL_DISCOVERY.txt"
            "$TREE/mtk_plpath_utils/STOCK_DISCOVERY.txt"
          )

          for f in "${required[@]}"; do
            if [ ! -e "$f" ]; then
              echo "MISSING: $f"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Show git status
        shell: bash
        run: |
          set -euo pipefail

          git status --short

          echo
          echo "===== TREE FILE COUNT ====="

          find "$TREE" \
            -type f \
            | wc -l

      - name: Commit generated tree
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$TREE"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit \
              -m "device: xiaomi: beryl: generate stock-derived recovery tree"

            git push
          fi

      - name: Package generated tree
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          tar \
            -czf \
            artifacts/android_device_xiaomi_beryl.tar.gz \
            "$TREE"

          sha256sum \
            artifacts/android_device_xiaomi_beryl.tar.gz \
            > artifacts/android_device_xiaomi_beryl.tar.gz.sha256

          ls -lh artifacts/

      - name: Upload generated tree
        uses: actions/upload-artifact@v4
        with:
          name: android_device_xiaomi_beryl
          path: artifacts/
          if-no-files-found: error
