name: Generate beryl Universal Recovery Device Tree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04

    env:
      DEVICE: beryl
      VENDOR: xiaomi
      TREE: device/xiaomi/beryl

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # HOST TOOLS
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            python3 \
            python3-pip \
            python3-venv \
            cpio \
            lz4 \
            liblz4-tool \
            xz-utils \
            gzip \
            unzip \
            file \
            rsync \
            device-tree-compiler \
            binutils \
            gawk \
            zstd

          python3 --version
          git --version
          lz4 --version | head -1
          cpio --version | head -1
          dtc --version

      # ==========================================================
      # WORKSPACE
      # ==========================================================

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            stock \
            work \
            generated \
            .venv

          mkdir -p \
            stock \
            work \
            generated

      # ==========================================================
      # PIXELDRAIN
      # ==========================================================

      - name: Download stock files
        shell: bash
        run: |
          set -euo pipefail

          download() {
            local id="$1"
            local name="$2"

            echo
            echo "=========================================="
            echo "Downloading $name"
            echo "PixelDrain ID: $id"
            echo "=========================================="

            curl \
              --fail \
              --location \
              --retry 10 \
              --retry-delay 5 \
              --connect-timeout 30 \
              --output "stock/$name" \
              "https://pixeldrain.com/api/file/$id?download"

            test -s "stock/$name"

            ls -lh "stock/$name"
          }

          download "NchNVhH6" "boot.img"
          download "KdKehwxA" "vendor_boot.img"
          download "Ynu3y6Ai" "vendor_dlkm.img"
          download "tj28QSM9" "odm_dlkm.img"
          download "VGYNgUbF" "dtbo.img"
          download "6itKKkne" "vbmeta.img"
          download "49XQu8yU" "vbmeta_system.img"
          download "J8PcuWZH" "vbmeta_vendor.img"

      # ==========================================================
      # HASHES / FILE TYPES
      # ==========================================================

      - name: Verify downloaded files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== FILES ====="
          ls -lh stock/

          echo
          echo "===== TYPES ====="

          for f in stock/*.img; do
            file "$f"
          done

          echo
          echo "===== SHA256 ====="

          sha256sum stock/*.img \
            | tee stock/SHA256SUMS.txt

      # ==========================================================
      # BOOT HEADER V4
      # ==========================================================

      - name: Verify boot header v4
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import struct
          from pathlib import Path

          data = Path("stock/boot.img").read_bytes()

          if data[:8] != b"ANDROID!":
              raise SystemExit(
                  "Invalid Android boot image"
              )

          # Android boot v3/v4:
          #
          # 0x08 kernel_size
          # 0x0c ramdisk_size
          # 0x10 os_version
          # 0x14 header_size
          # 0x28 header_version
          #
          # v3/v4 page size = 4096

          kernel_size = struct.unpack_from(
              "<I", data, 8
          )[0]

          ramdisk_size = struct.unpack_from(
              "<I", data, 12
          )[0]

          os_version = struct.unpack_from(
              "<I", data, 16
          )[0]

          header_size = struct.unpack_from(
              "<I", data, 20
          )[0]

          header_version = struct.unpack_from(
              "<I", data, 40
          )[0]

          print("boot.img")
          print("  kernel size   :", kernel_size)
          print("  ramdisk size  :", ramdisk_size)
          print("  os version    :", hex(os_version))
          print("  header size   :", header_size)
          print("  header version:", header_version)
          print("  page size     :", 4096)

          if header_version != 4:
              raise SystemExit(
                  f"Expected header v4, got {header_version}"
              )

          if kernel_size == 0:
              raise SystemExit("Kernel size is zero")

          if ramdisk_size == 0:
              raise SystemExit("Ramdisk size is zero")

          print("BOOT HEADER OK")
          PY

      # ==========================================================
      # VENDOR_BOOT V4
      # ==========================================================

      - name: Verify vendor_boot header v4
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import struct
          from pathlib import Path

          data = Path(
              "stock/vendor_boot.img"
          ).read_bytes()

          if data[:8] != b"VNDRBOOT":
              raise SystemExit(
                  "Invalid vendor_boot image"
              )

          header_version = struct.unpack_from(
              "<I", data, 8
          )[0]

          page_size = struct.unpack_from(
              "<I", data, 12
          )[0]

          ramdisk_size = struct.unpack_from(
              "<I", data, 24
          )[0]

          dtb_size = struct.unpack_from(
              "<I", data, 28
          )[0]

          table_size = struct.unpack_from(
              "<I", data, 44
          )[0]

          table_entry_num = struct.unpack_from(
              "<I", data, 48
          )[0]

          print("vendor_boot.img")
          print("  header version :", header_version)
          print("  page size      :", page_size)
          print("  ramdisk size   :", ramdisk_size)
          print("  DTB size       :", dtb_size)
          print("  table size     :", table_size)
          print("  table entries  :", table_entry_num)

          if header_version != 4:
              raise SystemExit(
                  f"Expected vendor_boot v4, got {header_version}"
              )

          if page_size != 4096:
              raise SystemExit(
                  f"Expected 4096 page size, got {page_size}"
              )

          print("VENDOR_BOOT HEADER OK")
          PY

      # ==========================================================
      # INSTALL TWRPDTGEN
      # ==========================================================

      - name: Install twrpdtgen
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv .venv

          . .venv/bin/activate

          python -m pip install --upgrade pip

          python -m pip install \
            twrpdtgen==3.0.0

          python -m twrpdtgen --help

      # ==========================================================
      # EXTRACT STOCK BOOT
      # ==========================================================

      - name: Extract boot image
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/boot

          . .venv/bin/activate

          python3 <<'PY'
          from pathlib import Path
          from sebaubuntu_libs.libaik import AIKManager
          import shutil

          image = Path("stock/boot.img")
          output = Path("work/boot")

          aik = AIKManager()

          info = aik.unpackimg(image)

          print("AIK workspace:", aik.path)
          print("Ramdisk:", info.ramdisk)

          if Path(info.ramdisk).exists():
              shutil.copytree(
                  info.ramdisk,
                  output / "ramdisk",
                  dirs_exist_ok=True
              )
          PY

          find work/boot \
            -type f \
            | sort

      # ==========================================================
      # EXTRACT VENDOR_BOOT
      # ==========================================================

      - name: Extract vendor_boot
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import struct
          import subprocess
          import shutil

          image = Path(
              "stock/vendor_boot.img"
          )

          output = Path(
              "work/vendor_boot"
          )

          output.mkdir(
              parents=True,
              exist_ok=True
          )

          data = image.read_bytes()

          assert data[:8] == b"VNDRBOOT"

          page = struct.unpack_from(
              "<I", data, 12
          )[0]

          ramdisk_size = struct.unpack_from(
              "<I", data, 24
          )[0]

          dtb_size = struct.unpack_from(
              "<I", data, 28
          )[0]

          table_size = struct.unpack_from(
              "<I", data, 44
          )[0]

          table_entries = struct.unpack_from(
              "<I", data, 48
          )[0]

          def align(value, alignment):
              return (
                  (value + alignment - 1)
                  // alignment
                  * alignment
              )

          ramdisk_offset = page

          dtb_offset = align(
              ramdisk_offset + ramdisk_size,
              page
          )

          table_offset = align(
              dtb_offset + dtb_size,
              page
          )

          ramdisk = data[
              ramdisk_offset:
              ramdisk_offset + ramdisk_size
          ]

          dtb = data[
              dtb_offset:
              dtb_offset + dtb_size
          ]

          table = data[
              table_offset:
              table_offset + table_size
          ]

          (
              output / "vendor_ramdisk.lz4"
          ).write_bytes(ramdisk)

          (
              output / "dtb.img"
          ).write_bytes(dtb)

          (
              output / "vendor_ramdisk_table.bin"
          ).write_bytes(table)

          print("ramdisk bytes:", len(ramdisk))
          print("DTB bytes:", len(dtb))
          print("table bytes:", len(table))
          print("table entries:", table_entries)

          # ------------------------------------------------------
          # Decode vendor ramdisk.
          # ------------------------------------------------------

          raw = output / "vendor_ramdisk.lz4"
          cpio = output / "vendor_ramdisk.cpio"

          normal = subprocess.run(
              [
                  "lz4",
                  "-d",
                  "-f",
                  str(raw),
                  str(cpio)
              ],
              capture_output=True,
              text=True
          )

          if normal.returncode != 0:

              print(
                  "Normal LZ4 decoding failed."
              )

              source = ramdisk
              magic = b"\x02\x21\x4c\x18"

              position = 0
              decoded = bytearray()
              block_number = 0

              while True:

                  index = source.find(
                      magic,
                      position
                  )

                  if index < 0:
                      break

                  if index + 8 > len(source):
                      break

                  size = int.from_bytes(
                      source[index + 4:index + 8],
                      "little"
                  )

                  start = index + 8
                  end = start + size

                  if end > len(source):
                      break

                  block = source[start:end]

                  block_in = (
                      output /
                      f"block_{block_number}.lz4"
                  )

                  block_out = (
                      output /
                      f"block_{block_number}.raw"
                  )

                  block_in.write_bytes(
                      magic
                      + size.to_bytes(4, "little")
                      + block
                  )

                  subprocess.run(
                      [
                          "lz4",
                          "-d",
                          "-f",
                          str(block_in),
                          str(block_out)
                      ],
                      check=True
                  )

                  decoded.extend(
                      block_out.read_bytes()
                  )

                  position = end
                  block_number += 1

              if not decoded:
                  raise SystemExit(
                      "Could not decode vendor ramdisk"
                  )

              cpio.write_bytes(decoded)

              print(
                  "Decoded",
                  block_number,
                  "legacy LZ4 blocks"
              )

          ramdisk_dir = output / "ramdisk"

          if ramdisk_dir.exists():
              shutil.rmtree(ramdisk_dir)

          ramdisk_dir.mkdir(
              parents=True
          )

          with cpio.open("rb") as stream:

              subprocess.run(
                  ["cpio", "-idmuv"],
                  cwd=ramdisk_dir,
                  stdin=stream,
                  check=True
              )

          print("vendor_boot extraction complete")
          PY

      # ==========================================================
      # ANALYZE STOCK GKI BUILD PROPERTIES
      # ==========================================================

      - name: Analyze stock boot properties
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/props

          find work/boot/ramdisk \
            -type f \
            -name "build.prop" \
            -print \
            -exec cp {} work/props/ \; \
            || true

          find work/vendor_boot/ramdisk \
            -type f \
            -name "build.prop" \
            -print \
            -exec cp {} work/props/ \; \
            || true

          echo "===== BUILD PROPS ====="

          find work/props \
            -type f \
            -print \
            -exec cat {} \; \
            || true

      # ==========================================================
      # PATCH TWRPDTGEN ONLY FOR GENERATION
      # ==========================================================

      - name: Patch twrpdtgen for beryl GKI layout
        shell: bash
        run: |
          set -euo pipefail

          . .venv/bin/activate

          DTGEN_DIR="$(
            python3 <<'PY'
          import twrpdtgen
          from pathlib import Path

          print(
              Path(
                  twrpdtgen.__file__
              ).resolve().parent
          )
          PY
          )"

          TARGET="$DTGEN_DIR/device_tree.py"

          cp \
            "$TARGET" \
            "$TARGET.original"

          python3 - "$TARGET" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          # ------------------------------------------------------
          # Stock beryl GKI boot ramdisk:
          #
          # system/etc/ramdisk/build.prop
          # ------------------------------------------------------

          location = (
              'Path("system") / "etc" / '
              '"ramdisk" / "build.prop"'
          )

          if location not in text:

              marker = "BUILDPROP_LOCATIONS = ["

              start = text.find(marker)

              if start < 0:
                  raise SystemExit(
                      "BUILDPROP_LOCATIONS not found"
                  )

              end = text.find(
                  "]",
                  start
              )

              block = text[start:end + 1]

              replacement = (
                  block[:-1]
                  + ",\n    "
                  + location
                  + "\n]"
              )

              text = (
                  text[:start]
                  + replacement
                  + text[end + 1:]
              )

          # ------------------------------------------------------
          # beryl hardware properties.
          #
          # Do NOT fabricate security-patch properties.
          # ------------------------------------------------------

          needle = (
              "self.device_info = "
              "DeviceInfo(self.build_prop)"
          )

          replacement = """# beryl GKI hardware fallbacks

        fallback_props = {
            "ro.product.board": "mt6855",
            "ro.board.platform": "mt6855",

            "ro.bionic.arch": "arm64",
            "ro.bionic.cpu_variant": "generic",

            "ro.product.device": "beryl",
            "ro.product.system.device": "beryl",
            "ro.product.vendor.device": "beryl",
            "ro.product.product.device": "beryl",
            "ro.product.system_ext.device": "beryl",
            "ro.product.system_dlkm.device": "beryl",
            "ro.product.vendor_dlkm.device": "beryl",
            "ro.product.odm.device": "beryl",
            "ro.product.odm_dlkm.device": "beryl",

            "ro.product.brand": "POCO",
            "ro.product.manufacturer": "Xiaomi",
            "ro.product.model": "POCO M7 Pro 5G",

            "ro.product.system.brand": "POCO",
            "ro.product.system.manufacturer": "Xiaomi",
            "ro.product.system.model": "POCO M7 Pro 5G",

            "ro.product.vendor.brand": "POCO",
            "ro.product.vendor.manufacturer": "Xiaomi",
            "ro.product.vendor.model": "POCO M7 Pro 5G",

            "ro.product.odm.brand": "Redmi",
            "ro.product.odm.manufacturer": "Xiaomi",
            "ro.product.odm.model": "beryl",

            "ro.build.ab_update": "true",
            "ro.boot.dynamic_partitions": "true",
            "ro.virtual_ab.enabled": "true",

            "ro.system.product.cpu.abilist":
                "arm64-v8a,armeabi-v7a,armeabi",

            "ro.product.cpu.abilist":
                "arm64-v8a,armeabi-v7a,armeabi",

            "ro.product.cpu.abilist64":
                "arm64-v8a",

            "ro.product.cpu.abilist32":
                "armeabi-v7a,armeabi",
        }

        for _key, _value in fallback_props.items():
            self.build_prop.set_prop(
                _key,
                _value
            )

        self.device_info = DeviceInfo(
            self.build_prop
        )"""

          if needle not in text:
              raise SystemExit(
                  "DeviceInfo initialization not found"
              )

          text = text.replace(
              needle,
              replacement,
              1
          )

          path.write_text(text)
          PY

          python3 -m py_compile "$TARGET"

      # ==========================================================
      # RUN TWRPDTGEN
      # ==========================================================

      - name: Run twrpdtgen
        shell: bash
        run: |
          set -euo pipefail

          . .venv/bin/activate

          rm -rf generated

          mkdir -p generated

          python -m twrpdtgen \
            --no-git \
            -o generated \
            stock/boot.img

          echo
          echo "===== TWRPDTGEN OUTPUT ====="

          find generated \
            -type f \
            | sort

      # ==========================================================
      # LOCATE GENERATED TREE
      # ==========================================================

      - name: Locate generated beryl tree
        shell: bash
        run: |
          set -euo pipefail

          FOUND="$(
            find generated \
              -type d \
              -path "*/device/xiaomi/beryl" \
              | head -1
          )"

          if [ -z "$FOUND" ]; then
            FOUND="$(
              find generated \
                -type d \
                -name beryl \
                | head -1
            )"
          fi

          if [ -z "$FOUND" ]; then
            echo "ERROR: no beryl tree generated"
            exit 1
          fi

          echo "GENERATED_TREE=$FOUND" \
            >> "$GITHUB_ENV"

          echo "Generated tree:"
          echo "$FOUND"

      # ==========================================================
      # MERGE STOCK VENDOR_BOOT DATA
      # ==========================================================

      - name: Merge stock vendor_boot recovery data
        shell: bash
        run: |
          set -euo pipefail

          TREE="$GENERATED_TREE"

          mkdir -p \
            "$TREE/recovery/root" \
            "$TREE/prebuilt" \
            "$TREE/bootctrl" \
            "$TREE/mtk_plpath_utils" \
            "$TREE/sepolicy/vendor"

          # ------------------------------------------------------
          # Stock recovery init
          # ------------------------------------------------------

          for FILE in \
            init.recovery.hardware.rc \
            init.recovery.mt6855.rc
          do

            if [ -f \
              "work/vendor_boot/ramdisk/$FILE"
            ]; then

              cp \
                "work/vendor_boot/ramdisk/$FILE" \
                "$TREE/recovery/root/$FILE"

            fi

          done

          # ------------------------------------------------------
          # First-stage ramdisk
          # ------------------------------------------------------

          if [ -d \
            "work/vendor_boot/ramdisk/first_stage_ramdisk"
          ]; then

            cp -a \
              "work/vendor_boot/ramdisk/first_stage_ramdisk/." \
              "$TREE/recovery/root/"

          fi

          # ------------------------------------------------------
          # DTB
          # ------------------------------------------------------

          cp \
            work/vendor_boot/dtb.img \
            "$TREE/prebuilt/dtb.img"

          # ------------------------------------------------------
          # Recovery modules
          # ------------------------------------------------------

          if [ -d \
            "work/vendor_boot/ramdisk/lib/modules"
          ]; then

            mkdir -p \
              "$TREE/recovery/root/lib"

            cp -a \
              "work/vendor_boot/ramdisk/lib/modules" \
              "$TREE/recovery/root/lib/"

          fi

          # ------------------------------------------------------
          # Module metadata
          # ------------------------------------------------------

          for FILE in \
            modules.alias \
            modules.dep \
            modules.load \
            modules.load.recovery \
            modules.softdep
          do

            if [ -f \
              "work/vendor_boot/ramdisk/$FILE"
            ]; then

              cp \
                "work/vendor_boot/ramdisk/$FILE" \
                "$TREE/recovery/root/$FILE"

            fi

          done

          # ------------------------------------------------------
          # Preserve the complete stock vendor_boot for OrangeFox
          # reference use.
          #
          # It is kept outside the final source tree below unless
          # explicitly enabled by the build.
          # ------------------------------------------------------

          mkdir -p work/reference

          cp \
            stock/vendor_boot.img \
            work/reference/stock-vendor_boot.img

      # ==========================================================
      # FSTAB
      # ==========================================================

      - name: Import stock recovery fstab
        shell: bash
        run: |
          set -euo pipefail

          TREE="$GENERATED_TREE"

          if [ -f \
            work/vendor_boot/ramdisk/first_stage_ramdisk/fstab.mt6855
          ]; then

            cp \
              work/vendor_boot/ramdisk/first_stage_ramdisk/fstab.mt6855 \
              "$TREE/recovery.fstab"

          elif [ -f \
            work/vendor_boot/ramdisk/first_stage_ramdisk/fstab.emmc
          ]; then

            cp \
              work/vendor_boot/ramdisk/first_stage_ramdisk/fstab.emmc \
              "$TREE/recovery.fstab"

          else

            echo "ERROR: no MT6855 stock fstab"
            exit 1

          fi

      # ==========================================================
      # DISCOVER MTK PLPATH UTILS
      # ==========================================================

      - name: Discover mtk_plpath_utils
        shell: bash
        run: |
          set -euo pipefail

          TREE="$GENERATED_TREE"

          REPORT="$TREE/mtk_plpath_utils/STOCK_DISCOVERY.txt"

          {
            echo "# mtk_plpath_utils stock discovery"
            echo

            echo "Files:"
            find \
              work/boot/ramdisk \
              work/vendor_boot/ramdisk \
              -type f \
              -iname "*plpath*" \
              -print \
              2>/dev/null \
              || true

            echo
            echo "References:"
            grep -Rai \
              "mtk_plpath_utils" \
              work/boot/ramdisk \
              work/vendor_boot/ramdisk \
              2>/dev/null \
              | head -100 \
              || true

          } | tee "$REPORT"

      # ==========================================================
      # BOOTCTRL DISCOVERY
      # ==========================================================

      - name: Discover boot control
        shell: bash
        run: |
          set -euo pipefail

          TREE="$GENERATED_TREE"

          {
            echo "# beryl boot-control discovery"
            echo

            echo "## Candidate files"

            find \
              work/boot/ramdisk \
              work/vendor_boot/ramdisk \
              -type f \
              \( \
                -iname "*bootctrl*" \
                -o -iname "*boot_control*" \
                -o -iname "*android.hardware.boot*" \
              \) \
              -print \
              2>/dev/null \
              || true

            echo
            echo "## A/B properties"

            grep -Rai \
              -E \
              "ro.build.ab_update|ro.virtual_ab.enabled|slot_suffix|active_slot" \
              work/boot/ramdisk \
              work/vendor_boot/ramdisk \
              2>/dev/null \
              | head -300 \
              || true

            echo
            echo "## Boot-control references"

            grep -Rai \
              -E \
              "bootctrl|boot_control|markBootSuccessful|setActiveBootSlot|activeBootSlot" \
              work/boot/ramdisk \
              work/vendor_boot/ramdisk \
              2>/dev/null \
              | head -500 \
              || true

          } | tee \
            "$TREE/bootctrl/BOOTCTRL_DISCOVERY.txt"

      # ==========================================================
      # COMPLETE BOARD CONFIG
      # ==========================================================

      - name: Generate BoardConfig
        shell: bash
        run: |
          set -euo pipefail

          TREE="$GENERATED_TREE"

          cat > "$TREE/BoardConfig.mk" <<'EOF'
          #
          # POCO M7 Pro 5G
          # Redmi Note 14 5G
          #
          # Codename: beryl
          # Platform: MT6855
          #

          DEVICE_PATH := device/xiaomi/beryl

          ALLOW_MISSING_DEPENDENCIES := true

          # -------------------------------------------------------
          # Architecture
          # -------------------------------------------------------

          TARGET_ARCH := arm64
          TARGET_ARCH_VARIANT := armv8-a

          TARGET_CPU_ABI := arm64-v8a
          TARGET_CPU_ABI2 :=

          TARGET_CPU_VARIANT := generic
          TARGET_CPU_VARIANT_RUNTIME := generic

          TARGET_2ND_ARCH := arm
          TARGET_2ND_ARCH_VARIANT := armv7-a-neon

          TARGET_2ND_CPU_ABI := armeabi-v7a
          TARGET_2ND_CPU_ABI2 := armeabi

          TARGET_2ND_CPU_VARIANT := generic
          TARGET_2ND_CPU_VARIANT_RUNTIME := generic

          # -------------------------------------------------------
          # Platform
          # -------------------------------------------------------

          TARGET_BOARD_PLATFORM := mt6855

          TARGET_BOOTLOADER_BOARD_NAME := beryl
          TARGET_NO_BOOTLOADER := true

          # -------------------------------------------------------
          # Kernel / GKI
          # -------------------------------------------------------

          BOARD_BOOTIMG_HEADER_VERSION := 4
          BOARD_BOOT_HEADER_VERSION := 4

          BOARD_KERNEL_PAGESIZE := 4096

          BOARD_KERNEL_CMDLINE := bootopt=64S3,32N2,64N2

          BOARD_MKBOOTIMG_ARGS += \
              --header_version $(BOARD_BOOTIMG_HEADER_VERSION)

          BOARD_MKBOOTIMG_ARGS += \
              --pagesize $(BOARD_KERNEL_PAGESIZE)

          BOARD_KERNEL_IMAGE_NAME := Image

          BOARD_USES_GENERIC_KERNEL_IMAGE := true

          # -------------------------------------------------------
          # Partitions
          # -------------------------------------------------------

          BOARD_FLASH_BLOCK_SIZE := 262144

          BOARD_BOOTIMAGE_PARTITION_SIZE := 134217728

          BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE := 67108864

          BOARD_SUPER_PARTITION_SIZE := 9126805504

          BOARD_SUPER_PARTITION_GROUPS := \
              xiaomi_dynamic_partitions

          BOARD_XIAOMI_DYNAMIC_PARTITIONS_SIZE := \
              9122611200

          BOARD_XIAOMI_DYNAMIC_PARTITIONS_PARTITION_LIST := \
              system \
              system_ext \
              product \
              vendor \
              odm \
              vendor_dlkm \
              odm_dlkm \
              system_dlkm \
              mi_ext

          # -------------------------------------------------------
          # Filesystems
          # -------------------------------------------------------

          BOARD_SYSTEMIMAGE_FILE_SYSTEM_TYPE := erofs
          BOARD_VENDORIMAGE_FILE_SYSTEM_TYPE := erofs
          BOARD_PRODUCTIMAGE_FILE_SYSTEM_TYPE := erofs
          BOARD_SYSTEM_EXTIMAGE_FILE_SYSTEM_TYPE := erofs
          BOARD_ODMIMAGE_FILE_SYSTEM_TYPE := erofs
          BOARD_VENDOR_DLKMIMAGE_FILE_SYSTEM_TYPE := erofs
          BOARD_ODM_DLKMIMAGE_FILE_SYSTEM_TYPE := erofs

          TARGET_USERIMAGES_USE_F2FS := true

          BOARD_HAS_LARGE_FILESYSTEM := true

          # -------------------------------------------------------
          # A/B
          # -------------------------------------------------------

          AB_OTA_UPDATER := true

          AB_OTA_PARTITIONS += \
              boot \
              vendor_boot \
              dtbo \
              vbmeta \
              vbmeta_system \
              vbmeta_vendor \
              system \
              system_ext \
              product \
              vendor \
              odm \
              vendor_dlkm \
              odm_dlkm \
              system_dlkm

          # -------------------------------------------------------
          # Dynamic partitions
          # -------------------------------------------------------

          TARGET_USE_DYNAMIC_PARTITIONS := true

          # -------------------------------------------------------
          # AVB
          # -------------------------------------------------------

          BOARD_AVB_ENABLE := true

          # -------------------------------------------------------
          # Recovery
          # -------------------------------------------------------

          BOARD_INCLUDE_RECOVERY_DTBO := true

          TARGET_RECOVERY_FSTAB := \
              $(DEVICE_PATH)/recovery.fstab

          TARGET_RECOVERY_PIXEL_FORMAT := RGBX_8888

          # -------------------------------------------------------
          # Encryption
          # -------------------------------------------------------

          TW_INCLUDE_CRYPTO := true
          TW_INCLUDE_FBE := true

          # -------------------------------------------------------
          # Common recovery options
          # -------------------------------------------------------

          TW_THEME := portrait_hdpi
          TW_USE_TOOLBOX := true

          EOF

      # ==========================================================
      # ANDROID PRODUCT FILES
      # ==========================================================

      - name: Generate Android product files
        shell: bash
        run: |
          set -euo pipefail

          TREE="$GENERATED_TREE"

          cat > "$TREE/AndroidProducts.mk" <<'EOF'
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/twrp_beryl.mk
          EOF

          cat > "$TREE/twrp_beryl.mk" <<'EOF'
          LOCAL_PATH := device/xiaomi/beryl

          $(call inherit-product, $(SRC_TARGET_DIR)/product/aosp_arm64.mk)

          PRODUCT_DEVICE := beryl
          PRODUCT_NAME := twrp_beryl

          PRODUCT_BRAND := POCO
          PRODUCT_MODEL := POCO M7 Pro 5G
          PRODUCT_MANUFACTURER := Xiaomi
          EOF

          cat > "$TREE/device.mk" <<'EOF'
          LOCAL_PATH := device/xiaomi/beryl

          PRODUCT_DEVICE := beryl

          PRODUCT_BRAND := POCO
          PRODUCT_MODEL := POCO M7 Pro 5G
          PRODUCT_MANUFACTURER := Xiaomi
          EOF

          cat > "$TREE/vendorsetup.sh" <<'EOF'
          add_lunch_combo twrp_beryl-eng
          EOF

          cat > "$TREE/Android.bp" <<'EOF'
          soong_namespace {
          }
          EOF

      # ==========================================================
      # COMMON DOCUMENTATION
      # ==========================================================

      - name: Generate device documentation
        shell: bash
        run: |
          set -euo pipefail

          TREE="$GENERATED_TREE"

          cat > "$TREE/README.md" <<'EOF'
          # Xiaomi beryl Recovery Device Tree

          Device:
            POCO M7 Pro 5G / Redmi Note 14 5G

          Codename:
            beryl

          SoC:
            MediaTek MT6855

          Architecture:
            ARM64

          Boot:
            Android boot header v4

          Vendor boot:
            vendor_boot header v4

          Kernel:
            GKI / Linux 5.10

          Partition layout:
            A/B
            Dynamic partitions

          Recovery:
            vendor_boot based

          Intended common recovery base:
            TWRP 12.1
            OrangeFox 12.1

          This tree was generated from stock images using twrpdtgen
          followed by stock vendor_boot/device-specific processing.

          The tree must be build-tested before any flashing.
          EOF

      # ==========================================================
      # VALIDATE
      # ==========================================================

      - name: Validate final tree
        shell: bash
        run: |
          set -euo pipefail

          TREE="$GENERATED_TREE"

          required=(
            BoardConfig.mk
            AndroidProducts.mk
            device.mk
            vendorsetup.sh
            recovery.fstab
            Android.bp
            README.md
            bootctrl/BOOTCTRL_DISCOVERY.txt
            mtk_plpath_utils/STOCK_DISCOVERY.txt
          )

          for file in "${required[@]}"; do
            if [ ! -f "$TREE/$file" ]; then
              echo "MISSING: $TREE/$file"
              exit 1
            fi
          done

          grep -q \
            "TARGET_BOARD_PLATFORM := mt6855" \
            "$TREE/BoardConfig.mk"

          grep -q \
            "BOARD_BOOTIMG_HEADER_VERSION := 4" \
            "$TREE/BoardConfig.mk"

          grep -q \
            "BOARD_KERNEL_PAGESIZE := 4096" \
            "$TREE/BoardConfig.mk"

          grep -q \
            "BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE := 67108864" \
            "$TREE/BoardConfig.mk"

          grep -q \
            "BOARD_SUPER_PARTITION_SIZE := 9126805504" \
            "$TREE/BoardConfig.mk"

          echo
          echo "=========================================="
          echo "VALIDATION PASSED"
          echo "=========================================="

          find "$TREE" \
            -type f \
            | sort

      # ==========================================================
      # INSTALL NORMAL ANDROID DEVICE TREE
      # ==========================================================

      - name: Install device/xiaomi/beryl
        shell: bash
        run: |
          set -euo pipefail

          rm -rf device/xiaomi/beryl

          mkdir -p device/xiaomi

          cp -a \
            "$GENERATED_TREE" \
            device/xiaomi/beryl

          echo "Installed device/xiaomi/beryl"

      # ==========================================================
      # CLEAN STOCK IMAGES
      # ==========================================================

      - name: Remove temporary stock files
        shell: bash
        run: |
          rm -rf \
            stock \
            work \
            generated \
            .venv

      # ==========================================================
      # COMMIT
      # ==========================================================

      - name: Commit generated tree
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "beryl: generate universal recovery device tree"

          git push
