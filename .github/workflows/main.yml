name: Generate Complete beryl Recovery Device Tree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04

    env:
      DEVICE: beryl
      VENDOR: xiaomi
      TREE: device/xiaomi/beryl

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            python3 \
            python3-pip \
            python3-venv \
            cpio \
            lz4 \
            liblz4-tool \
            xz-utils \
            gzip \
            unzip \
            file \
            rsync \
            device-tree-compiler \
            binutils \
            grep \
            sed \
            awk

      # ============================================================
      # WORKSPACE
      # ============================================================

      - name: Prepare workspace
        run: |
          set -e

          rm -rf \
            stock \
            work \
            generated \
            .venv

          mkdir -p \
            stock \
            work \
            generated

      # ============================================================
      # PIXELDRAIN DOWNLOADS
      # ============================================================

      - name: Download stock images
        shell: bash
        run: |
          set -euo pipefail

          download() {
            ID="$1"
            NAME="$2"

            echo
            echo "=========================================="
            echo "Downloading $NAME"
            echo "PixelDrain ID: $ID"
            echo "=========================================="

            curl \
              --fail \
              --location \
              --retry 10 \
              --retry-delay 5 \
              --connect-timeout 30 \
              --output "stock/$NAME" \
              "https://pixeldrain.com/api/file/$ID?download"

            test -s "stock/$NAME"

            ls -lh "stock/$NAME"
          }

          download "NchNVhH6" "boot.img"
          download "KdKehwxA" "vendor_boot.img"
          download "Ynu3y6Ai" "vendor_dlkm.img"
          download "tj28QSM9" "odm_dlkm.img"
          download "VGYNgUbF" "dtbo.img"
          download "6itKKkne" "vbmeta.img"
          download "49XQu8yU" "vbmeta_system.img"
          download "J8PcuWZH" "vbmeta_vendor.img"

      # ============================================================
      # STOCK VERIFICATION
      # ============================================================

      - name: Verify stock images
        shell: bash
        run: |
          set -euo pipefail

          echo "===== FILES ====="
          ls -lh stock/

          echo
          echo "===== TYPES ====="
          file stock/*.img

          echo
          echo "===== HASHES ====="
          sha256sum stock/*.img | tee stock/SHA256SUMS.txt

      # ============================================================
      # VERIFY BOOT
      # ============================================================

      - name: Inspect boot image
        run: |
          python3 <<'PY'
          import struct

          p = "stock/boot.img"

          with open(p, "rb") as f:
              d = f.read(4096)

          if d[:8] != b"ANDROID!":
              raise SystemExit("Invalid boot.img")

          header = struct.unpack_from("<I", d, 8)[0]
          page = struct.unpack_from("<I", d, 36)[0]

          kernel_size = struct.unpack_from("<I", d, 16)[0]
          ramdisk_size = struct.unpack_from("<I", d, 24)[0]

          print("boot header version :", header)
          print("page size           :", page)
          print("kernel size         :", kernel_size)
          print("ramdisk size        :", ramdisk_size)

          if header != 4:
              raise SystemExit("Expected boot header v4")

          if page != 4096:
              raise SystemExit("Expected 4096-byte pages")
          PY

      # ============================================================
      # VERIFY VENDOR BOOT
      # ============================================================

      - name: Inspect vendor_boot image
        run: |
          python3 <<'PY'
          import struct

          p = "stock/vendor_boot.img"

          with open(p, "rb") as f:
              d = f.read(4096)

          if d[:8] != b"VNDRBOOT":
              raise SystemExit("Invalid vendor_boot.img")

          header = struct.unpack_from("<I", d, 8)[0]
          page = struct.unpack_from("<I", d, 12)[0]
          ramdisk = struct.unpack_from("<I", d, 24)[0]
          dtb = struct.unpack_from("<I", d, 28)[0]

          print("vendor_boot header :", header)
          print("page size          :", page)
          print("vendor ramdisk     :", ramdisk)
          print("DTB size           :", dtb)

          if header != 4:
              raise SystemExit("Expected vendor_boot header v4")

          if page != 4096:
              raise SystemExit("Expected 4096-byte pages")
          PY

      # ============================================================
      # TWRPDTGEN
      # ============================================================

      - name: Install twrpdtgen
        run: |
          set -e

          python3 -m venv .venv

          . .venv/bin/activate

          python -m pip install --upgrade pip

          python -m pip install twrpdtgen

          python -m twrpdtgen --help

      # ============================================================
      # EXTRACT BOOT
      # ============================================================

      - name: Extract stock boot.img
        shell: bash
        run: |
          set -e

          mkdir -p work/boot

          . .venv/bin/activate

          python3 <<'PY'
          from pathlib import Path
          from sebaubuntu_libs.libaik import AIKManager
          import shutil

          image = Path("stock/boot.img")
          out = Path("work/boot")

          aik = AIKManager()

          info = aik.unpackimg(image)

          print("AIK workspace:", aik.path)
          print("Ramdisk:", info.ramdisk)

          if Path(info.ramdisk).exists():
              shutil.copytree(
                  info.ramdisk,
                  out / "ramdisk",
                  dirs_exist_ok=True
              )
          PY

          echo
          echo "===== BOOT RAMDISK ====="

          find work/boot \
            -type f \
            | sort

      # ============================================================
      # EXTRACT VENDOR_BOOT
      # ============================================================

      - name: Extract vendor_boot.img
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import struct
          import subprocess
          import shutil

          image = Path("stock/vendor_boot.img")
          out = Path("work/vendor_boot")

          out.mkdir(parents=True, exist_ok=True)

          data = image.read_bytes()

          assert data[:8] == b"VNDRBOOT"

          page = struct.unpack_from("<I", data, 12)[0]
          ramdisk_size = struct.unpack_from("<I", data, 24)[0]
          dtb_size = struct.unpack_from("<I", data, 28)[0]

          def align(x, a):
              return ((x + a - 1) // a) * a

          ramdisk_offset = page

          dtb_offset = align(
              ramdisk_offset + ramdisk_size,
              page
          )

          ramdisk = data[
              ramdisk_offset:
              ramdisk_offset + ramdisk_size
          ]

          dtb = data[
              dtb_offset:
              dtb_offset + dtb_size
          ]

          raw = out / "vendor_ramdisk.lz4"
          cpio = out / "vendor_ramdisk.cpio"

          raw.write_bytes(ramdisk)

          (out / "dtb.img").write_bytes(dtb)

          # --------------------------------------------------------
          # Normal LZ4
          # --------------------------------------------------------

          result = subprocess.run(
              [
                  "lz4",
                  "-d",
                  "-f",
                  str(raw),
                  str(cpio)
              ],
              capture_output=True,
              text=True
          )

          # --------------------------------------------------------
          # Legacy block fallback
          # --------------------------------------------------------

          if result.returncode != 0:

              print("Normal LZ4 decode failed.")
              print("Trying legacy LZ4 blocks.")

              src = ramdisk

              MAGIC = b"\x02\x21\x4c\x18"

              pos = 0
              decoded = bytearray()
              block_number = 0

              while True:

                  idx = src.find(MAGIC, pos)

                  if idx < 0:
                      break

                  if idx + 8 > len(src):
                      break

                  size = int.from_bytes(
                      src[idx + 4:idx + 8],
                      "little"
                  )

                  start = idx + 8
                  end = start + size

                  if end > len(src):
                      break

                  compressed = src[start:end]

                  block_in = (
                      out / f"block_{block_number}.lz4"
                  )

                  block_out = (
                      out / f"block_{block_number}.raw"
                  )

                  block_in.write_bytes(
                      MAGIC +
                      size.to_bytes(4, "little") +
                      compressed
                  )

                  subprocess.run(
                      [
                          "lz4",
                          "-d",
                          "-f",
                          str(block_in),
                          str(block_out)
                      ],
                      check=True
                  )

                  decoded.extend(
                      block_out.read_bytes()
                  )

                  pos = end
                  block_number += 1

              if not decoded:
                  raise SystemExit(
                      "Unable to decode vendor_boot ramdisk"
                  )

              cpio.write_bytes(decoded)

              print(
                  "Decoded",
                  block_number,
                  "LZ4 blocks"
              )

          # --------------------------------------------------------
          # CPIO extraction
          # --------------------------------------------------------

          ramdisk_dir = out / "ramdisk"

          if ramdisk_dir.exists():
              shutil.rmtree(ramdisk_dir)

          ramdisk_dir.mkdir(parents=True)

          with cpio.open("rb") as f:

              subprocess.run(
                  ["cpio", "-idmuv"],
                  cwd=ramdisk_dir,
                  stdin=f,
                  check=True
              )

          print("vendor_boot extracted.")
          PY

          echo
          echo "===== VENDOR BOOT RAMDISK ====="

          find work/vendor_boot/ramdisk \
            -type f \
            | sort

      # ============================================================
      # RUN TWRPDTGEN
      # ============================================================

      - name: Generate initial TWRP device tree
        shell: bash
        run: |
          set -e

          . .venv/bin/activate

          rm -rf generated

          mkdir -p generated

          python -m twrpdtgen \
            -o generated \
            stock/boot.img

          echo
          echo "===== TWRPDTGEN OUTPUT ====="

          find generated \
            -type f \
            | sort

      # ============================================================
      # FIND GENERATED TREE
      # ============================================================

      - name: Locate generated tree
        shell: bash
        run: |
          set -e

          FOUND="$(
            find generated \
              -type d \
              -path "*/device/xiaomi/beryl" \
              | head -1
          )"

          if [ -z "$FOUND" ]; then
            FOUND="$(
              find generated \
                -type d \
                -name beryl \
                | head -1
            )"
          fi

          if [ -z "$FOUND" ]; then
            echo "ERROR: twrpdtgen did not create a beryl tree."
            exit 1
          fi

          echo "GENERATED_TREE=$FOUND" >> "$GITHUB_ENV"

          echo "Generated tree:"
          echo "$FOUND"

      # ============================================================
      # IMPORT COMPLETE STOCK RECOVERY ENVIRONMENT
      # ============================================================

      - name: Import vendor recovery environment
        shell: bash
        run: |
          set -e

          TREE="$GENERATED_TREE"

          mkdir -p \
            "$TREE/root" \
            "$TREE/root/system" \
            "$TREE/root/vendor" \
            "$TREE/modules" \
            "$TREE/dtb" \
            "$TREE/prebuilt"

          # --------------------------------------------------------
          # Recovery init
          # --------------------------------------------------------

          for f in \
            init.recovery.hardware.rc \
            init.recovery.mt6855.rc
          do

            if [ -f "work/vendor_boot/ramdisk/$f" ]; then

              cp \
                "work/vendor_boot/ramdisk/$f" \
                "$TREE/root/$f"

            fi

          done

          # --------------------------------------------------------
          # first_stage_ramdisk
          # --------------------------------------------------------

          if [ -d \
            "work/vendor_boot/ramdisk/first_stage_ramdisk"
          ]; then

            cp -a \
              "work/vendor_boot/ramdisk/first_stage_ramdisk" \
              "$TREE/root/"

          fi

          # --------------------------------------------------------
          # DTB
          # --------------------------------------------------------

          cp \
            work/vendor_boot/dtb.img \
            "$TREE/dtb/vendor_boot.dtb"

          # --------------------------------------------------------
          # Kernel modules
          # --------------------------------------------------------

          if [ -d \
            "work/vendor_boot/ramdisk/lib/modules"
          ]; then

            cp -a \
              "work/vendor_boot/ramdisk/lib/modules" \
              "$TREE/modules/"

          fi

          for f in \
            modules.alias \
            modules.dep \
            modules.load \
            modules.load.recovery \
            modules.softdep
          do

            if [ -f \
              "work/vendor_boot/ramdisk/$f"
            ]; then

              cp \
                "work/vendor_boot/ramdisk/$f" \
                "$TREE/modules/$f"

            fi

          done

      # ============================================================
      # STOCK FSTAB
      # ============================================================

      - name: Import stock fstab
        shell: bash
        run: |
          set -e

          TREE="$GENERATED_TREE"

          FSTAB=""

          if [ -f \
            work/vendor_boot/ramdisk/first_stage_ramdisk/fstab.mt6855
          ]; then

            FSTAB=\
            work/vendor_boot/ramdisk/first_stage_ramdisk/fstab.mt6855

          elif [ -f \
            work/vendor_boot/ramdisk/first_stage_ramdisk/fstab.emmc
          ]; then

            FSTAB=\
            work/vendor_boot/ramdisk/first_stage_ramdisk/fstab.emmc

          fi

          if [ -z "$FSTAB" ]; then
            echo "ERROR: Stock fstab not found."
            exit 1
          fi

          cp "$FSTAB" "$TREE/recovery.fstab"

          echo
          echo "===== STOCK FSTAB ====="
          cat "$TREE/recovery.fstab"

      # ============================================================
      # BOOT CONTROL / A-B DISCOVERY
      # ============================================================

      - name: Discover boot control implementation
        shell: bash
        run: |
          set -e

          TREE="$GENERATED_TREE"

          mkdir -p "$TREE/bootctrl"

          REPORT="$TREE/bootctrl/BOOTCTRL_DISCOVERY.txt"

          {
            echo "beryl boot-control discovery"
            echo
            echo "========================================"
            echo "STOCK RAMDISK"
            echo "========================================"

            find work/boot/ramdisk \
              -type f \
              \( \
                -iname "*bootctrl*" \
                -o -iname "*boot_control*" \
              \) \
              -print || true

            echo
            echo "========================================"
            echo "VENDOR RAMDISK"
            echo "========================================"

            find work/vendor_boot/ramdisk \
              -type f \
              \( \
                -iname "*bootctrl*" \
                -o -iname "*boot_control*" \
                -o -iname "*android.hardware.boot*" \
              \) \
              -print || true

            echo
            echo "========================================"
            echo "STOCK MODULES"
            echo "========================================"

            find work/vendor_boot/ramdisk \
              -type f \
              -iname "*.ko" \
              -print \
              | grep -Ei \
                "boot|slot|ab|mtk" \
              || true

            echo
            echo "========================================"
            echo "STRING SEARCH"
            echo "========================================"

            grep -Rai \
              -E \
              "bootctrl|boot_control|android.hardware.boot|markBootSuccessful|setActiveBootSlot|activeBootSlot" \
              work/boot/ramdisk \
              work/vendor_boot/ramdisk \
              2>/dev/null \
              | head -300 \
              || true

          } | tee "$REPORT"

          echo
          echo "Boot-control discovery completed."

      # ============================================================
      # BUILD COMPLETE BOARD CONFIG
      # ============================================================

      - name: Generate complete BoardConfig
        shell: bash
        run: |
          set -e

          TREE="$GENERATED_TREE"

          cat > "$TREE/BoardConfig.mk" <<'EOF'
          #
          # POCO M7 Pro 5G
          # Redmi Note 14 5G
          #
          # Codename: beryl
          # SoC: MediaTek MT6855
          #
          # Common TWRP 12.1 / OrangeFox 12.1 tree
          #

          DEVICE_PATH := device/xiaomi/beryl

          TARGET_ARCH := arm64
          TARGET_ARCH_VARIANT := armv8-a

          TARGET_CPU_ABI := arm64-v8a
          TARGET_CPU_ABI2 := armeabi-v7a

          TARGET_BOARD_PLATFORM := mt6855

          BOARD_BOOT_HEADER_VERSION := 4
          BOARD_KERNEL_PAGESIZE := 4096

          BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE := 67108864

          BOARD_SUPER_PARTITION_SIZE := 9126805504

          BOARD_USES_GENERIC_KERNEL_IMAGE := true

          AB_OTA_UPDATER := true

          TARGET_NO_RECOVERY := true

          TARGET_USERIMAGES_USE_F2FS := true

          BOARD_INCLUDE_RECOVERY_DTBO := true

          TARGET_RECOVERY_FSTAB := $(DEVICE_PATH)/recovery.fstab

          TW_INCLUDE_CRYPTO := true
          TW_INCLUDE_FBE := true

          TW_USE_TOOLBOX := true

          EOF

      # ============================================================
      # PRODUCT FILES
      # ============================================================

      - name: Generate Android build files
        shell: bash
        run: |
          set -e

          TREE="$GENERATED_TREE"

          cat > "$TREE/AndroidProducts.mk" <<'EOF'
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/twrp_beryl.mk
          EOF

          cat > "$TREE/twrp_beryl.mk" <<'EOF'
          LOCAL_PATH := device/xiaomi/beryl

          $(call inherit-product, $(SRC_TARGET_DIR)/product/aosp_arm64.mk)

          PRODUCT_DEVICE := beryl
          PRODUCT_NAME := twrp_beryl

          PRODUCT_BRAND := POCO
          PRODUCT_MODEL := POCO M7 Pro 5G
          PRODUCT_MANUFACTURER := Xiaomi
          EOF

          cat > "$TREE/device.mk" <<'EOF'
          LOCAL_PATH := device/xiaomi/beryl

          PRODUCT_DEVICE := beryl

          PRODUCT_BRAND := POCO
          PRODUCT_MODEL := POCO M7 Pro 5G
          PRODUCT_MANUFACTURER := Xiaomi
          EOF

          cat > "$TREE/vendorsetup.sh" <<'EOF'
          add_lunch_combo twrp_beryl-eng
          EOF

      # ============================================================
      # RECOVERY INIT DIRECTORY
      # ============================================================

      - name: Organize recovery init files
        shell: bash
        run: |
          set -e

          TREE="$GENERATED_TREE"

          mkdir -p "$TREE/init"

          for f in \
            init.recovery.hardware.rc \
            init.recovery.mt6855.rc
          do

            if [ -f "$TREE/root/$f" ]; then

              cp \
                "$TREE/root/$f" \
                "$TREE/init/$f"

            fi

          done

      # ============================================================
      # STOCK IMAGE METADATA
      # ============================================================

      - name: Generate stock hardware report
        shell: bash
        run: |
          set -e

          TREE="$GENERATED_TREE"

          cat > "$TREE/STOCK_HARDWARE.md" <<'EOF'
          # POCO M7 Pro 5G — beryl

          ## Hardware

          - Device: POCO M7 Pro 5G
          - Codename: beryl
          - Manufacturer: Xiaomi
          - SoC: MediaTek Dimensity 7025-Ultra
          - Platform: MT6855
          - Architecture: ARM64
          - Kernel family: GKI / Linux 5.10
          - Storage: UFS
          - Layout: A/B
          - Dynamic partitions: yes
          - Boot header: v4
          - Page size: 4096
          - Recovery environment: vendor_boot
          - AVB: enabled
          - userdata: F2FS
          - FBE/inline encryption: enabled

          ## Recovery targets

          This hardware tree is intended to be shared by:

          - TWRP 12.1
          - OrangeFox 12.1

          Framework-specific configuration should be layered on top of
          this common hardware tree.

          ## Stock sources

          - boot.img
          - vendor_boot.img
          - vendor_dlkm.img
          - odm_dlkm.img
          - dtbo.img
          - vbmeta.img
          - vbmeta_system.img
          - vbmeta_vendor.img
          EOF

          {
            echo
            echo "## Stock SHA256"
            echo
            cat stock/SHA256SUMS.txt
          } >> "$TREE/STOCK_HARDWARE.md"

      # ============================================================
      # CREATE COMMON RECOVERY MAKEFILES
      # ============================================================

      - name: Generate recovery Android makefiles
        shell: bash
        run: |
          set -e

          TREE="$GENERATED_TREE"

          cat > "$TREE/Android.mk" <<'EOF'
          LOCAL_PATH := $(call my-dir)

          include $(CLEAR_VARS)

          LOCAL_MODULE := beryl_recovery_modules
          LOCAL_MODULE_CLASS := ETC
          LOCAL_MODULE_TAGS := optional

          include $(BUILD_PREBUILT)
          EOF

          cat > "$TREE/Android.bp" <<'EOF'
          soong_namespace {
          }
          EOF

      # ============================================================
      # CHECK BOOTCTRL RESULTS
      # ============================================================

      - name: Show bootctrl discovery
        run: |
          echo
          echo "============================================"
          echo "BOOTCTRL DISCOVERY"
          echo "============================================"

          cat \
            "$GENERATED_TREE/bootctrl/BOOTCTRL_DISCOVERY.txt"

      # ============================================================
      # VALIDATE COMPLETE TREE
      # ============================================================

      - name: Validate complete device tree
        shell: bash
        run: |
          set -e

          TREE="$GENERATED_TREE"

          echo "===== REQUIRED FILES ====="

          test -f "$TREE/BoardConfig.mk"
          test -f "$TREE/AndroidProducts.mk"
          test -f "$TREE/device.mk"
          test -f "$TREE/vendorsetup.sh"
          test -f "$TREE/recovery.fstab"

          echo "Core files OK."

          echo
          echo "===== BOARD CONFIG ====="

          grep -q \
            "TARGET_BOARD_PLATFORM := mt6855" \
            "$TREE/BoardConfig.mk"

          grep -q \
            "BOARD_BOOT_HEADER_VERSION := 4" \
            "$TREE/BoardConfig.mk"

          grep -q \
            "BOARD_KERNEL_PAGESIZE := 4096" \
            "$TREE/BoardConfig.mk"

          grep -q \
            "BOARD_USES_GENERIC_KERNEL_IMAGE := true" \
            "$TREE/BoardConfig.mk"

          echo "BoardConfig OK."

          echo
          echo "===== MODULES ====="

          if [ -d "$TREE/modules" ]; then
            find "$TREE/modules" -type f | sort
          fi

          echo
          echo "===== INIT ====="

          if [ -d "$TREE/init" ]; then
            find "$TREE/init" -type f | sort
          fi

          echo
          echo "===== TREE ====="

          find "$TREE" -type f | sort

      # ============================================================
      # COPY TREE TO NORMAL DEVICE TREE LOCATION
      #
      # The final repository contains:
      #
      # device/xiaomi/beryl/
      #
      # NOT a repository-root beryl folder.
      # ============================================================

      - name: Install final device tree
        shell: bash
        run: |
          set -e

          FINAL="device/xiaomi/beryl"

          rm -rf "$FINAL"

          mkdir -p device/xiaomi

          cp -a \
            "$GENERATED_TREE" \
            "$FINAL"

          echo "Final tree:"
          find "$FINAL" -type f | sort

      # ============================================================
      # REMOVE STOCK IMAGES FROM GIT TREE
      # ============================================================

      - name: Remove temporary stock data
        run: |
          rm -rf \
            stock \
            work \
            generated \
            .venv

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit generated device tree
        shell: bash
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit \
            -m "beryl: generate complete universal recovery tree"

          git push
