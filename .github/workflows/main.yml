name: Generate Complete beryl Recovery Device Tree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04

    env:
      DEVICE: beryl
      VENDOR: xiaomi
      TREE: device/xiaomi/beryl

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # HOST DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            python3 \
            python3-pip \
            python3-venv \
            cpio \
            lz4 \
            liblz4-tool \
            xz-utils \
            gzip \
            unzip \
            file \
            rsync \
            device-tree-compiler \
            binutils \
            gawk

          echo
          echo "===== TOOL VERSIONS ====="

          python3 --version
          git --version
          curl --version | head -1
          lz4 --version | head -1
          cpio --version | head -1
          dtc --version
          gawk --version | head -1

      # ============================================================
      # WORKSPACE
      # ============================================================

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            stock \
            work \
            generated \
            .venv

          mkdir -p \
            stock \
            work \
            generated

      # ============================================================
      # PIXELDRAIN
      # ============================================================

      - name: Download stock images
        shell: bash
        run: |
          set -euo pipefail

          download() {
            local id="$1"
            local name="$2"

            echo
            echo "============================================"
            echo "Downloading: $name"
            echo "PixelDrain ID: $id"
            echo "============================================"

            curl \
              --fail \
              --location \
              --retry 10 \
              --retry-delay 5 \
              --connect-timeout 30 \
              --output "stock/$name" \
              "https://pixeldrain.com/api/file/$id?download"

            test -s "stock/$name"

            echo "Downloaded:"
            ls -lh "stock/$name"
          }

          download "NchNVhH6" "boot.img"
          download "KdKehwxA" "vendor_boot.img"
          download "Ynu3y6Ai" "vendor_dlkm.img"
          download "tj28QSM9" "odm_dlkm.img"
          download "VGYNgUbF" "dtbo.img"
          download "6itKKkne" "vbmeta.img"
          download "49XQu8yU" "vbmeta_system.img"
          download "J8PcuWZH" "vbmeta_vendor.img"

      # ============================================================
      # VERIFY DOWNLOADS
      # ============================================================

      - name: Verify stock files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== STOCK FILES ====="
          ls -lh stock/

          echo
          echo "===== FILE TYPES ====="

          for f in stock/*.img; do
            file "$f"
          done

          echo
          echo "===== SHA256 ====="

          sha256sum stock/*.img | tee stock/SHA256SUMS.txt

      # ============================================================
      # BOOT HEADER
      # ============================================================

      - name: Inspect boot image
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import struct

          with open("stock/boot.img", "rb") as f:
              data = f.read(4096)

          if data[:8] != b"ANDROID!":
              raise SystemExit("boot.img is not an Android boot image")

          header = struct.unpack_from("<I", data, 8)[0]
          kernel = struct.unpack_from("<I", data, 16)[0]
          ramdisk = struct.unpack_from("<I", data, 24)[0]
          page = struct.unpack_from("<I", data, 36)[0]

          print("BOOT")
          print("  header version :", header)
          print("  page size      :", page)
          print("  kernel size    :", kernel)
          print("  ramdisk size   :", ramdisk)

          assert header == 4
          assert page == 4096
          PY

      # ============================================================
      # VENDOR BOOT HEADER
      # ============================================================

      - name: Inspect vendor_boot image
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import struct

          with open("stock/vendor_boot.img", "rb") as f:
              data = f.read(4096)

          if data[:8] != b"VNDRBOOT":
              raise SystemExit(
                  "vendor_boot.img is not a vendor_boot image"
              )

          header = struct.unpack_from("<I", data, 8)[0]
          page = struct.unpack_from("<I", data, 12)[0]
          ramdisk = struct.unpack_from("<I", data, 24)[0]
          dtb = struct.unpack_from("<I", data, 28)[0]

          print("VENDOR BOOT")
          print("  header version :", header)
          print("  page size      :", page)
          print("  ramdisk size   :", ramdisk)
          print("  DTB size       :", dtb)

          assert header == 4
          assert page == 4096
          PY

      # ============================================================
      # TWRPDTGEN
      # ============================================================

      - name: Install twrpdtgen
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv .venv

          . .venv/bin/activate

          python -m pip install --upgrade pip

          python -m pip install \
            twrpdtgen==3.0.0

          python -m twrpdtgen --help

      # ============================================================
      # EXTRACT BOOT
      # ============================================================

      - name: Extract boot image
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/boot

          . .venv/bin/activate

          python3 <<'PY'
          from pathlib import Path
          from sebaubuntu_libs.libaik import AIKManager
          import shutil

          image = Path("stock/boot.img")
          output = Path("work/boot")

          aik = AIKManager()

          info = aik.unpackimg(image)

          print("AIK workspace:", aik.path)
          print("Ramdisk:", info.ramdisk)

          if Path(info.ramdisk).exists():
              shutil.copytree(
                  info.ramdisk,
                  output / "ramdisk",
                  dirs_exist_ok=True
              )
          PY

          echo
          echo "===== BOOT RAMDISK ====="

          find work/boot \
            -type f \
            | sort

      # ============================================================
      # EXTRACT VENDOR_BOOT
      # ============================================================

      - name: Extract vendor_boot image
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import struct
          import subprocess
          import shutil

          image = Path("stock/vendor_boot.img")
          output = Path("work/vendor_boot")

          output.mkdir(parents=True, exist_ok=True)

          data = image.read_bytes()

          assert data[:8] == b"VNDRBOOT"

          page_size = struct.unpack_from("<I", data, 12)[0]
          ramdisk_size = struct.unpack_from("<I", data, 24)[0]
          dtb_size = struct.unpack_from("<I", data, 28)[0]

          def align(value, alignment):
              return (
                  (value + alignment - 1)
                  // alignment
                  * alignment
              )

          ramdisk_offset = page_size

          dtb_offset = align(
              ramdisk_offset + ramdisk_size,
              page_size
          )

          ramdisk = data[
              ramdisk_offset:
              ramdisk_offset + ramdisk_size
          ]

          dtb = data[
              dtb_offset:
              dtb_offset + dtb_size
          ]

          raw = output / "vendor_ramdisk.lz4"
          cpio = output / "vendor_ramdisk.cpio"

          raw.write_bytes(ramdisk)
          (output / "dtb.img").write_bytes(dtb)

          # --------------------------------------------------------
          # Try standard LZ4 first
          # --------------------------------------------------------

          result = subprocess.run(
              [
                  "lz4",
                  "-d",
                  "-f",
                  str(raw),
                  str(cpio)
              ],
              capture_output=True,
              text=True
          )

          if result.returncode != 0:

              print(
                  "Standard LZ4 decode failed; "
                  "using legacy LZ4 block decoder."
              )

              source = ramdisk
              magic = b"\x02\x21\x4c\x18"

              position = 0
              decoded = bytearray()
              block_number = 0

              while True:

                  index = source.find(magic, position)

                  if index < 0:
                      break

                  if index + 8 > len(source):
                      break

                  compressed_size = int.from_bytes(
                      source[index + 4:index + 8],
                      "little"
                  )

                  start = index + 8
                  end = start + compressed_size

                  if end > len(source):
                      break

                  compressed = source[start:end]

                  block_in = (
                      output / f"block_{block_number}.lz4"
                  )

                  block_out = (
                      output / f"block_{block_number}.raw"
                  )

                  block_in.write_bytes(
                      magic
                      + compressed_size.to_bytes(4, "little")
                      + compressed
                  )

                  subprocess.run(
                      [
                          "lz4",
                          "-d",
                          "-f",
                          str(block_in),
                          str(block_out)
                      ],
                      check=True
                  )

                  decoded.extend(
                      block_out.read_bytes()
                  )

                  position = end
                  block_number += 1

              if not decoded:
                  raise SystemExit(
                      "Unable to decode vendor_boot ramdisk"
                  )

              cpio.write_bytes(decoded)

              print(
                  "Decoded",
                  block_number,
                  "legacy LZ4 blocks."
              )

          # --------------------------------------------------------
          # Extract CPIO
          # --------------------------------------------------------

          ramdisk_dir = output / "ramdisk"

          if ramdisk_dir.exists():
              shutil.rmtree(ramdisk_dir)

          ramdisk_dir.mkdir(parents=True)

          with cpio.open("rb") as f:

              subprocess.run(
                  ["cpio", "-idmuv"],
                  cwd=ramdisk_dir,
                  stdin=f,
                  check=True
              )

          print("vendor_boot ramdisk extracted.")
          PY

          echo
          echo "===== VENDOR RAMDISK ====="

          find work/vendor_boot/ramdisk \
            -type f \
            | sort

      # ============================================================
      # STOCK BOOT CONTROL DISCOVERY
      # ============================================================

      - name: Scan stock boot control
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/bootctrl

          {
            echo "============================================"
            echo "BOOT CONTROL SCAN"
            echo "============================================"
            echo

            echo "Possible bootctrl files:"
            find work/boot/ramdisk \
              work/vendor_boot/ramdisk \
              -type f \
              \( \
                -iname "*bootctrl*" \
                -o -iname "*boot_control*" \
              \) \
              -print \
              2>/dev/null || true

            echo
            echo "Possible boot HAL files:"
            find work/boot/ramdisk \
              work/vendor_boot/ramdisk \
              -type f \
              \( \
                -iname "*android.hardware.boot*" \
                -o -iname "*boot*.hal*" \
              \) \
              -print \
              2>/dev/null || true

            echo
            echo "A/B related files:"
            find work/boot/ramdisk \
              work/vendor_boot/ramdisk \
              -type f \
              | grep -Ei \
                "bootctrl|boot.control|slot|ab_update|boot_hal" \
              || true

            echo
            echo "Boot-control strings:"
            grep -Rai \
              -E \
              "bootctrl|boot_control|android.hardware.boot|markBootSuccessful|setActiveBootSlot|activeBootSlot" \
              work/boot/ramdisk \
              work/vendor_boot/ramdisk \
              2>/dev/null \
              | head -500 \
              || true

          } | tee work/bootctrl/discovery.txt

      # ============================================================
      # RUN TWRPDTGEN
      # ============================================================

      - name: Run twrpdtgen
        shell: bash
        run: |
          set -euo pipefail

          . .venv/bin/activate

          rm -rf generated

          mkdir -p generated

          python -m twrpdtgen \
            stock/boot.img \
            -o generated

          echo
          echo "===== TWRPDTGEN OUTPUT ====="

          find generated \
            -type f \
            | sort

      # ============================================================
      # FIND TREE
      # ============================================================

      - name: Locate generated beryl tree
        shell: bash
        run: |
          set -euo pipefail

          FOUND="$(
            find generated \
              -type d \
              -path "*/device/xiaomi/beryl" \
              | head -1
          )"

          if [ -z "$FOUND" ]; then
            FOUND="$(
              find generated \
                -type d \
                -name beryl \
                | head -1
            )"
          fi

          if [ -z "$FOUND" ]; then
            echo "ERROR: twrpdtgen did not produce a beryl tree."
            exit 1
          fi

          echo "GENERATED_TREE=$FOUND" >> "$GITHUB_ENV"

          echo "Generated tree:"
          echo "$FOUND"

      # ============================================================
      # CREATE COMPLETE DEVICE TREE DIRECTORIES
      # ============================================================

      - name: Prepare complete device tree
        shell: bash
        run: |
          set -euo pipefail

          TREE="$GENERATED_TREE"

          mkdir -p \
            "$TREE/root" \
            "$TREE/root/system" \
            "$TREE/root/vendor" \
            "$TREE/init" \
            "$TREE/modules" \
            "$TREE/dtb" \
            "$TREE/prebuilt" \
            "$TREE/bootctrl"

      # ============================================================
      # IMPORT RECOVERY INIT
      # ============================================================

      - name: Import recovery init
        shell: bash
        run: |
          set -euo pipefail

          TREE="$GENERATED_TREE"

          for FILE in \
            init.recovery.hardware.rc \
            init.recovery.mt6855.rc
          do

            if [ -f \
              "work/vendor_boot/ramdisk/$FILE"
            ]; then

              cp \
                "work/vendor_boot/ramdisk/$FILE" \
                "$TREE/init/$FILE"

              cp \
                "work/vendor_boot/ramdisk/$FILE" \
                "$TREE/root/$FILE"

            fi

          done

      # ============================================================
      # IMPORT FIRST STAGE RAMDISK
      # ============================================================

      - name: Import first stage ramdisk
        shell: bash
        run: |
          set -euo pipefail

          TREE="$GENERATED_TREE"

          if [ -d \
            "work/vendor_boot/ramdisk/first_stage_ramdisk"
          ]; then

            cp -a \
              "work/vendor_boot/ramdisk/first_stage_ramdisk/." \
              "$TREE/root/"

          fi

      # ============================================================
      # IMPORT MODULES
      # ============================================================

      - name: Import recovery kernel modules
        shell: bash
        run: |
          set -euo pipefail

          TREE="$GENERATED_TREE"

          if [ -d \
            "work/vendor_boot/ramdisk/lib/modules"
          ]; then

            mkdir -p "$TREE/modules/lib"

            cp -a \
              "work/vendor_boot/ramdisk/lib/modules" \
              "$TREE/modules/lib/"

          fi

          for FILE in \
            modules.alias \
            modules.dep \
            modules.load \
            modules.load.recovery \
            modules.softdep
          do

            if [ -f \
              "work/vendor_boot/ramdisk/$FILE"
            ]; then

              cp \
                "work/vendor_boot/ramdisk/$FILE" \
                "$TREE/modules/$FILE"

            fi

          done

      # ============================================================
      # IMPORT DTB
      # ============================================================

      - name: Import stock DTB
        shell: bash
        run: |
          set -euo pipefail

          TREE="$GENERATED_TREE"

          cp \
            work/vendor_boot/dtb.img \
            "$TREE/dtb/vendor_boot.dtb"

      # ============================================================
      # IMPORT STOCK FSTAB
      # ============================================================

      - name: Import stock recovery fstab
        shell: bash
        run: |
          set -euo pipefail

          TREE="$GENERATED_TREE"

          if [ -f \
            work/vendor_boot/ramdisk/first_stage_ramdisk/fstab.mt6855
          ]; then

            cp \
              work/vendor_boot/ramdisk/first_stage_ramdisk/fstab.mt6855 \
              "$TREE/recovery.fstab"

          elif [ -f \
            work/vendor_boot/ramdisk/first_stage_ramdisk/fstab.emmc
          ]; then

            cp \
              work/vendor_boot/ramdisk/first_stage_ramdisk/fstab.emmc \
              "$TREE/recovery.fstab"

          else

            echo "ERROR: no stock fstab found."
            exit 1

          fi

          echo
          echo "===== RECOVERY FSTAB ====="
          cat "$TREE/recovery.fstab"

      # ============================================================
      # COMPLETE BOARD CONFIG
      # ============================================================

      - name: Generate BoardConfig
        shell: bash
        run: |
          set -euo pipefail

          TREE="$GENERATED_TREE"

          cat > "$TREE/BoardConfig.mk" <<'EOF'
          #
          # POCO M7 Pro 5G
          # Redmi Note 14 5G
          #
          # Codename: beryl
          # Platform: MT6855
          #
          # Common recovery hardware tree
          # TWRP 12.1 / OrangeFox 12.1
          #

          DEVICE_PATH := device/xiaomi/beryl

          TARGET_ARCH := arm64
          TARGET_ARCH_VARIANT := armv8-a

          TARGET_CPU_ABI := arm64-v8a
          TARGET_CPU_ABI2 := armeabi-v7a

          TARGET_BOARD_PLATFORM := mt6855

          BOARD_BOOT_HEADER_VERSION := 4
          BOARD_KERNEL_PAGESIZE := 4096

          BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE := 67108864

          BOARD_SUPER_PARTITION_SIZE := 9126805504

          BOARD_USES_GENERIC_KERNEL_IMAGE := true

          AB_OTA_UPDATER := true

          TARGET_NO_RECOVERY := true

          TARGET_USERIMAGES_USE_F2FS := true

          BOARD_INCLUDE_RECOVERY_DTBO := true

          TARGET_RECOVERY_FSTAB := $(DEVICE_PATH)/recovery.fstab

          TW_INCLUDE_CRYPTO := true
          TW_INCLUDE_FBE := true

          TW_USE_TOOLBOX := true

          EOF

      # ============================================================
      # PRODUCT CONFIG
      # ============================================================

      - name: Generate Android product files
        shell: bash
        run: |
          set -euo pipefail

          TREE="$GENERATED_TREE"

          cat > "$TREE/AndroidProducts.mk" <<'EOF'
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/twrp_beryl.mk
          EOF

          cat > "$TREE/twrp_beryl.mk" <<'EOF'
          LOCAL_PATH := device/xiaomi/beryl

          $(call inherit-product, $(SRC_TARGET_DIR)/product/aosp_arm64.mk)

          PRODUCT_DEVICE := beryl
          PRODUCT_NAME := twrp_beryl

          PRODUCT_BRAND := POCO
          PRODUCT_MODEL := POCO M7 Pro 5G
          PRODUCT_MANUFACTURER := Xiaomi
          EOF

          cat > "$TREE/device.mk" <<'EOF'
          LOCAL_PATH := device/xiaomi/beryl

          PRODUCT_DEVICE := beryl

          PRODUCT_BRAND := POCO
          PRODUCT_MODEL := POCO M7 Pro 5G
          PRODUCT_MANUFACTURER := Xiaomi
          EOF

          cat > "$TREE/vendorsetup.sh" <<'EOF'
          add_lunch_combo twrp_beryl-eng
          EOF

          cat > "$TREE/Android.bp" <<'EOF'
          soong_namespace {
          }
          EOF

      # ============================================================
      # BOOTCTRL REPORT
      # ============================================================

      - name: Save bootctrl discovery
        shell: bash
        run: |
          set -euo pipefail

          cp \
            work/bootctrl/discovery.txt \
            "$GENERATED_TREE/bootctrl/BOOTCTRL_DISCOVERY.txt"

      # ============================================================
      # HARDWARE REPORT
      # ============================================================

      - name: Generate hardware documentation
        shell: bash
        run: |
          set -euo pipefail

          TREE="$GENERATED_TREE"

          cat > "$TREE/STOCK_HARDWARE.md" <<'EOF'
          # beryl Recovery Device Tree

          ## Device

          POCO M7 Pro 5G / Redmi Note 14 5G

          ## Codename

          beryl

          ## Platform

          MediaTek MT6855

          ## Architecture

          ARM64

          ## Kernel

          GKI / Linux 5.10

          ## Boot

          Android boot header v4

          Page size: 4096

          ## Recovery

          vendor_boot based recovery environment

          ## Partition layout

          A/B

          Dynamic partitions

          ## Storage

          UFS

          ## Encryption

          F2FS userdata with inline encryption

          ## Security

          AVB enabled

          ## Target recoveries

          This is intended as the common hardware/device layer for:

          - TWRP 12.1
          - OrangeFox 12.1

          Recovery-framework-specific features should be kept outside
          the common hardware configuration.

          ## Boot control

          Boot-control components are discovered from the stock images.
          No fabricated HAL or bootctrl implementation is included.
          EOF

      # ============================================================
      # VALIDATE
      # ============================================================

      - name: Validate device tree
        shell: bash
        run: |
          set -euo pipefail

          TREE="$GENERATED_TREE"

          echo "============================================"
          echo "CORE DEVICE TREE"
          echo "============================================"

          test -f "$TREE/BoardConfig.mk"
          test -f "$TREE/AndroidProducts.mk"
          test -f "$TREE/device.mk"
          test -f "$TREE/vendorsetup.sh"
          test -f "$TREE/recovery.fstab"

          grep -q \
            "TARGET_BOARD_PLATFORM := mt6855" \
            "$TREE/BoardConfig.mk"

          grep -q \
            "BOARD_BOOT_HEADER_VERSION := 4" \
            "$TREE/BoardConfig.mk"

          grep -q \
            "BOARD_KERNEL_PAGESIZE := 4096" \
            "$TREE/BoardConfig.mk"

          grep -q \
            "BOARD_USES_GENERIC_KERNEL_IMAGE := true" \
            "$TREE/BoardConfig.mk"

          echo "Core validation passed."

          echo
          echo "============================================"
          echo "DIRECTORIES"
          echo "============================================"

          find "$TREE" \
            -type d \
            | sort

          echo
          echo "============================================"
          echo "FILES"
          echo "============================================"

          find "$TREE" \
            -type f \
            | sort

      # ============================================================
      # INSTALL AS STANDARD ANDROID DEVICE TREE
      # ============================================================

      - name: Install device tree
        shell: bash
        run: |
          set -euo pipefail

          FINAL="device/xiaomi/beryl"

          rm -rf "$FINAL"

          mkdir -p device/xiaomi

          cp -a \
            "$GENERATED_TREE" \
            "$FINAL"

          echo "Installed:"
          echo "$FINAL"

      # ============================================================
      # REMOVE TEMPORARY FILES
      # ============================================================

      - name: Remove temporary files
        shell: bash
        run: |
          rm -rf \
            stock \
            work \
            generated \
            .venv

      # ============================================================
      # COMMIT TREE
      # ============================================================

      - name: Commit device tree
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "beryl: generate complete universal recovery tree"

          git push
