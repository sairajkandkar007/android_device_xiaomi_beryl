name: Fix generated beryl recovery tree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04

    env:
      TREE: device/xiaomi/beryl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check generated tree
        shell: bash
        run: |
          set -euo pipefail

          test -d "$TREE"
          test -f "$TREE/BoardConfig.mk"
          test -f "$TREE/recovery.fstab"

          echo "Existing tree:"
          find "$TREE" -maxdepth 3 -type f | sort

      - name: Backup generated files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$TREE/.generated-backup"

          for f in \
            BoardConfig.mk \
            device.mk \
            AndroidProducts.mk \
            Android.mk \
            Android.bp \
            vendorsetup.sh \
            omni_beryl.mk \
            recovery.fstab; do
            if [ -f "$TREE/$f" ]; then
              cp "$TREE/$f" "$TREE/.generated-backup/$f"
            fi
          done

      - name: Replace BoardConfig with stock-derived beryl configuration
        shell: bash
        run: |
          set -euo pipefail

          cat > "$TREE/BoardConfig.mk" <<'EOF'
          #
          # POCO M7 Pro 5G / Redmi Note 14 5G
          # Codename: beryl
          #

          DEVICE_PATH := device/xiaomi/beryl

          # Minimal recovery build
          ALLOW_MISSING_DEPENDENCIES := true

          # Vendor
          BOARD_VENDOR := xiaomi

          # A/B
          TARGET_USES_A/B := true
          AB_OTA_UPDATER := true

          AB_OTA_PARTITIONS := \
              boot \
              dtbo \
              odm \
              odm_dlkm \
              product \
              system \
              system_dlkm \
              system_ext \
              vbmeta \
              vbmeta_system \
              vbmeta_vendor \
              vendor \
              vendor_boot \
              vendor_dlkm

          # Architecture
          TARGET_ARCH := arm64
          TARGET_ARCH_VARIANT := armv8-a
          TARGET_CPU_ABI := arm64-v8a
          TARGET_CPU_ABI2 := armeabi-v7a
          TARGET_CPU_VARIANT := generic

          TARGET_2ND_ARCH := arm
          TARGET_2ND_ARCH_VARIANT := armv7-a-neon
          TARGET_2ND_CPU_ABI := armeabi-v7a
          TARGET_2ND_CPU_ABI2 := armeabi
          TARGET_2ND_CPU_VARIANT := generic

          # Bootloader
          TARGET_BOOTLOADER_BOARD_NAME := mt6855
          TARGET_NO_BOOTLOADER := true

          # MediaTek platform
          TARGET_BOARD_PLATFORM := mt6855

          # GKI
          BOARD_USES_GENERIC_KERNEL_IMAGE := true
          BOARD_KERNEL_IMAGE_NAME := Image
          TARGET_KERNEL_ARCH := arm64
          TARGET_FORCE_PREBUILT_KERNEL := true
          TARGET_PREBUILT_KERNEL := $(DEVICE_PATH)/prebuilt/kernel

          # Boot image
          BOARD_BOOT_HEADER_VERSION := 4
          BOARD_BOOTIMAGE_PARTITION_SIZE := 134217728
          BOARD_KERNEL_PAGESIZE := 4096

          BOARD_MKBOOTIMG_ARGS += --header_version $(BOARD_BOOT_HEADER_VERSION)
          BOARD_MKBOOTIMG_ARGS += --pagesize $(BOARD_KERNEL_PAGESIZE)

          # vendor_boot v4
          BOARD_VENDOR_BOOT_HEADER_VERSION := 4
          BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE := 67108864

          # Recovery is provided through vendor_boot on this device.
          BOARD_USES_RECOVERY_AS_BOOT := false
          BOARD_EXCLUDE_KERNEL_FROM_RECOVERY_IMAGE := true
          BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT := true

          # Stock vendor_boot uses LZ4-compressed ramdisk.
          BOARD_RAMDISK_USE_LZ4 := true

          # Partitions
          BOARD_BUILD_SYSTEM_ROOT_IMAGE := true
          BOARD_HAS_LARGE_FILESYSTEM := true

          BOARD_SYSTEMIMAGE_PARTITION_TYPE := ext4
          BOARD_VENDORIMAGE_FILE_SYSTEM_TYPE := ext4
          BOARD_USERDATAIMAGE_FILE_SYSTEM_TYPE := f2fs

          TARGET_COPY_OUT_VENDOR := vendor

          # Dynamic partitions / super
          BOARD_SUPER_PARTITION_SIZE := 9126805504
          BOARD_SUPER_PARTITION_GROUPS := beryl_dynamic_partitions
          BOARD_BERYL_DYNAMIC_PARTITIONS_SIZE := 9122611200

          BOARD_BERYL_DYNAMIC_PARTITIONS_PARTITION_LIST := \
              odm \
              odm_dlkm \
              product \
              system \
              system_dlkm \
              system_ext \
              vendor \
              vendor_dlkm

          # Recovery filesystem support
          TARGET_RECOVERY_FSTAB := $(DEVICE_PATH)/recovery.fstab
          TARGET_RECOVERY_PIXEL_FORMAT := RGBA_8888
          TARGET_USERIMAGES_USE_EXT4 := true
          TARGET_USERIMAGES_USE_F2FS := true

          # AVB
          BOARD_AVB_ENABLE := true

          # TWRP
          TW_THEME := portrait_hdpi
          TW_EXTRA_LANGUAGES := true
          TW_SCREEN_BLANK_ON_BOOT := true
          TW_INPUT_BLACKLIST := "hbtp_vm"
          TW_USE_TOOLBOX := true
          TW_INCLUDE_REPACKTOOLS := true

          # Device
          TARGET_OTA_ASSERT_DEVICE := beryl
          EOF

          echo "===== BoardConfig.mk ====="
          cat "$TREE/BoardConfig.mk"

      - name: Remove invalid generated kernel and security settings
        shell: bash
        run: |
          set -euo pipefail

          # These values came from the generic twrpdtgen template and are
          # not valid device-specific implementations.
          sed -i \
            -e '/TARGET_KERNEL_SOURCE := kernel\/unknown\/beryl/d' \
            -e '/TARGET_KERNEL_CONFIG := beryl_defconfig/d' \
            -e '/VENDOR_SECURITY_PATCH := 2021-08-01/d' \
            -e '/PLATFORM_SECURITY_PATCH := 2099-12-31/d' \
            -e '/VENDOR_SECURITY_PATCH := 2099-12-31/d' \
            -e '/PLATFORM_VERSION := 16.1.0/d' \
            "$TREE/BoardConfig.mk"

      - name: Replace device.mk
        shell: bash
        run: |
          set -euo pipefail

          cat > "$TREE/device.mk" <<'EOF'
          #
          # POCO M7 Pro 5G / beryl recovery device
          #

          LOCAL_PATH := device/xiaomi/beryl

          # Recovery device tree does not provide a fabricated boot-control HAL.
          # Boot-control implementation must be added only when its real source
          # or stock-compatible implementation has been recovered.

          # Recovery fstab
          PRODUCT_COPY_FILES += \
              $(LOCAL_PATH)/recovery.fstab:$(TARGET_COPY_OUT_RECOVERY)/recovery.fstab
          EOF

      - name: Replace AndroidProducts.mk
        shell: bash
        run: |
          set -euo pipefail

          cat > "$TREE/AndroidProducts.mk" <<'EOF'
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/twrp_beryl.mk \
              $(LOCAL_DIR)/fox_beryl.mk
          EOF

      - name: Replace TWRP and OrangeFox product makefiles
        shell: bash
        run: |
          set -euo pipefail

          cat > "$TREE/twrp_beryl.mk" <<'EOF'
          PRODUCT_DEVICE := beryl
          PRODUCT_NAME := twrp_beryl
          PRODUCT_BRAND := POCO
          PRODUCT_MODEL := POCO M7 Pro 5G
          PRODUCT_MANUFACTURER := Xiaomi

          $(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)
          $(call inherit-product, $(LOCAL_PATH)/device.mk)
          EOF

          cat > "$TREE/fox_beryl.mk" <<'EOF'
          PRODUCT_DEVICE := beryl
          PRODUCT_NAME := fox_beryl
          PRODUCT_BRAND := POCO
          PRODUCT_MODEL := POCO M7 Pro 5G
          PRODUCT_MANUFACTURER := Xiaomi

          $(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)
          $(call inherit-product, $(LOCAL_PATH)/device.mk)
          EOF

          rm -f "$TREE/omni_beryl.mk"

      - name: Replace Android.mk
        shell: bash
        run: |
          set -euo pipefail

          cat > "$TREE/Android.mk" <<'EOF'
          LOCAL_PATH := $(call my-dir)
          EOF

      - name: Replace vendorsetup.sh
        shell: bash
        run: |
          set -euo pipefail

          cat > "$TREE/vendorsetup.sh" <<'EOF'
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=1

          add_lunch_combo twrp_beryl-eng
          add_lunch_combo fox_beryl-eng
          EOF

      - name: Create board-info and system properties
        shell: bash
        run: |
          set -euo pipefail

          cat > "$TREE/board-info.txt" <<'EOF'
          require board=beryl
          EOF

          cat > "$TREE/system.prop" <<'EOF'
          ro.product.device=beryl
          ro.product.board=mt6855
          ro.board.platform=mt6855
          EOF

      - name: Remove fabricated bootctrl and unknown-platform references
        shell: bash
        run: |
          set -euo pipefail

          # Do not leave generated placeholder implementations in the tree.
          rm -rf "$TREE/bootctrl"

          if grep -RIn \
              --exclude-dir=.git \
              --exclude-dir=.generated-backup \
              -E 'device/unknown|kernel/unknown|unknown_dynamic_partitions|bootctrl\.mt6855|BOARD_USES_RECOVERY_AS_BOOT := true|2099-12-31|2021-08-01' \
              "$TREE"; then
            echo "ERROR: invalid generated references remain"
            exit 1
          fi

      - name: Preserve and document stock vendor_boot recovery components
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$TREE/recovery/root"

          cat > "$TREE/recovery/root/BERYL_VENDOR_BOOT_COMPONENTS.txt" <<'EOF'
          Stock vendor_boot recovery information

          Device: POCO M7 Pro 5G
          Codename: beryl
          Platform: mt6855
          Boot header: v4
          Vendor boot header: v4
          GKI: yes
          A/B: yes
          Dynamic partitions: yes

          Stock recovery ramdisk components are supplied by vendor_boot.
          Recovery modules and MTK recovery init scripts must come from the
          stock vendor_boot image and must not be replaced with fabricated
          implementations.
          EOF

      - name: Check critical files
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            BoardConfig.mk \
            device.mk \
            Android.mk \
            Android.bp \
            AndroidProducts.mk \
            twrp_beryl.mk \
            fox_beryl.mk \
            vendorsetup.sh \
            board-info.txt \
            system.prop \
            recovery.fstab; do
            test -f "$TREE/$f" || {
              echo "Missing: $TREE/$f"
              exit 1
            }
          done

          grep -q '^DEVICE_PATH := device/xiaomi/beryl$' "$TREE/BoardConfig.mk"
          grep -q '^TARGET_BOARD_PLATFORM := mt6855$' "$TREE/BoardConfig.mk"
          grep -q '^BOARD_BOOT_HEADER_VERSION := 4$' "$TREE/BoardConfig.mk"
          grep -q '^BOARD_VENDOR_BOOT_HEADER_VERSION := 4$' "$TREE/BoardConfig.mk"
          grep -q '^BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT := true$' "$TREE/BoardConfig.mk"
          grep -q '^TARGET_RECOVERY_FSTAB := $(DEVICE_PATH)/recovery.fstab$' "$TREE/BoardConfig.mk"

          echo "Critical beryl configuration checks passed."

      - name: Show final diff
        shell: bash
        run: |
          set -euo pipefail

          git status --short
          git diff -- "$TREE"

      - name: Commit edited tree
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$TREE"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "device: xiaomi: beryl: clean generated recovery tree"
            git push
          fi

      - name: Package edited tree
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          tar -czf \
            artifacts/android_device_xiaomi_beryl-edited.tar.gz \
            "$TREE"

          sha256sum \
            artifacts/android_device_xiaomi_beryl-edited.tar.gz \
            > artifacts/android_device_xiaomi_beryl-edited.tar.gz.sha256

      - name: Upload edited tree
        uses: actions/upload-artifact@v4
        with:
          name: android_device_xiaomi_beryl-edited
          path: artifacts/
          if-no-files-found: error
