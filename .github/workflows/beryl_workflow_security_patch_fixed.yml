name: Generate beryl Universal Recovery Device Tree

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04

    env:
      DEVICE: beryl
      VENDOR: xiaomi
      TREE: device/xiaomi/beryl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget python3 python3-pip python3-venv \
            python3-yaml cpio lz4 liblz4-tool xz-utils gzip \
            unzip file rsync device-tree-compiler binutils gawk zstd
          python3 --version
          git --version
          lz4 --version | head -1
          cpio --version | head -1
          dtc --version

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf stock work generated .venv
          mkdir -p stock work generated

      - name: Download stock files from GitHub release
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://github.com/sairajkandkar007/android_device_xiaomi_beryl/releases/download/Berylstock"

          download() {
            local name="$1"
            echo "=========================================="
            echo "Downloading: $name"
            echo "=========================================="
            curl --fail --location --retry 10 --retry-delay 5 \
              --connect-timeout 30 \
              --output "stock/$name" \
              "$BASE/$name"
            test -s "stock/$name"
            ls -lh "stock/$name"
          }

          download boot.img
          download vendor_boot.img
          download vendor_dlkm.img
          download odm_dlkm.img
          download dtbo.img
          download vbmeta.img
          download vbmeta_system.img
          download vbmeta_vendor.img

          ls -lh stock/

      - name: Verify downloaded files
        shell: bash
        run: |
          set -euo pipefail
          for f in stock/*.img; do
            file "$f"
          done
          sha256sum stock/*.img | tee stock/SHA256SUMS.txt

      - name: Verify boot and vendor_boot headers
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import struct
          from pathlib import Path

          boot = Path("stock/boot.img").read_bytes()
          if boot[:8] != b"ANDROID!":
              raise SystemExit("Invalid Android boot image")

          boot_header = struct.unpack_from("<I", boot, 40)[0]
          kernel_size = struct.unpack_from("<I", boot, 8)[0]
          ramdisk_size = struct.unpack_from("<I", boot, 12)[0]

          print("boot header:", boot_header)
          print("kernel size:", kernel_size)
          print("ramdisk size:", ramdisk_size)

          if boot_header != 4:
              raise SystemExit(f"Expected boot header v4, got {boot_header}")
          if not kernel_size or not ramdisk_size:
              raise SystemExit("Boot kernel/ramdisk size is zero")

          vb = Path("stock/vendor_boot.img").read_bytes()
          if vb[:8] != b"VNDRBOOT":
              raise SystemExit("Invalid vendor_boot image")

          vh = struct.unpack_from("<I", vb, 8)[0]
          page = struct.unpack_from("<I", vb, 12)[0]
          ramdisk = struct.unpack_from("<I", vb, 24)[0]

          print("vendor_boot header:", vh)
          print("vendor_boot page:", page)
          print("vendor ramdisk size:", ramdisk)

          if vh != 4:
              raise SystemExit(f"Expected vendor_boot v4, got {vh}")
          if page != 4096:
              raise SystemExit(f"Expected 4096 page size, got {page}")
          if not ramdisk:
              raise SystemExit("Vendor ramdisk size is zero")
          PY

      - name: Install twrpdtgen
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install twrpdtgen==3.0.0
          python -m twrpdtgen --help

      - name: Verify BuildProp API
        shell: bash
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python3 <<'PY'
          from sebaubuntu_libs.libandroid.props import BuildProp
          print("BuildProp:", BuildProp)
          if not hasattr(BuildProp, "set_prop"):
              raise SystemExit("BuildProp.set_prop() is unavailable")
          print("BuildProp.set_prop(): OK")
          PY

      - name: Patch twrpdtgen for beryl GKI boot
        shell: bash
        run: |
          set -euo pipefail
          . .venv/bin/activate

          DTGEN_DIR="$(
            python3 - <<'PY'
          import twrpdtgen
          from pathlib import Path
          print(Path(twrpdtgen.__file__).resolve().parent)
          PY
          )"

          TARGET="$DTGEN_DIR/device_tree.py"
          cp "$TARGET" "$TARGET.original"

          python3 - "$TARGET" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8").expandtabs(4)

          # beryl boot.img keeps its build.prop under the GKI ramdisk.
          location = 'Path("system") / "etc" / "ramdisk" / "build.prop"'

          if location not in text:
              marker = "BUILDPROP_LOCATIONS = ["
              start = text.find(marker)
              if start < 0:
                  raise SystemExit("BUILDPROP_LOCATIONS not found")

              insert_at = text.find("\n", start)
              if insert_at < 0:
                  raise SystemExit("Cannot locate BUILDPROP_LOCATIONS end")

              next_end = text.find("\n", insert_at + 1)
              next_line = text[insert_at + 1:next_end]
              indent = next_line[:len(next_line) - len(next_line.lstrip())]
              if not indent:
                  indent = "    "

              text = (
                  text[:insert_at + 1]
                  + f"{indent}{location},\n"
                  + text[insert_at + 1:]
              )

          needle = "self.device_info = DeviceInfo(self.build_prop)"
          target_line = next(
              (line for line in text.splitlines() if needle in line),
              None
          )

          if not target_line:
              raise SystemExit("DeviceInfo initialization not found")

          base = target_line[:len(target_line) - len(target_line.lstrip())]
          unit = "    "
          inner = base + unit

          fallback = [
              f"{base}# beryl GKI hardware fallbacks",
              f"{base}fallback_props = {{",
              f'{inner}"ro.product.board": "mt6855",',
              f'{inner}"ro.board.platform": "mt6855",',
              f'{inner}"ro.bionic.arch": "arm64",',
              f'{inner}"ro.bionic.cpu_variant": "generic",',
              f'{inner}"ro.bionic.2nd_arch": "arm",',
              f'{inner}"ro.bionic.2nd_cpu_variant": "generic",',
              f'{inner}"ro.product.device": "beryl",',
              f'{inner}"ro.product.system.device": "beryl",',
              f'{inner}"ro.product.vendor.device": "beryl",',
              f'{inner}"ro.product.product.device": "beryl",',
              f'{inner}"ro.product.system_ext.device": "beryl",',
              f'{inner}"ro.product.system_dlkm.device": "beryl",',
              f'{inner}"ro.product.vendor_dlkm.device": "beryl",',
              f'{inner}"ro.product.odm.device": "beryl",',
              f'{inner}"ro.product.odm_dlkm.device": "beryl",',
              f'{inner}"ro.product.brand": "POCO",',
              f'{inner}"ro.product.manufacturer": "Xiaomi",',
              f'{inner}"ro.product.model": "POCO M7 Pro 5G",',
              f'{inner}"ro.build.ab_update": "true",',
              f'{inner}"ro.boot.dynamic_partitions": "true",',
              f'{inner}"ro.virtual_ab.enabled": "true",',
              f'{inner}"ro.system.product.cpu.abilist": "arm64-v8a,armeabi-v7a,armeabi",',
              f'{inner}"ro.product.cpu.abilist": "arm64-v8a,armeabi-v7a,armeabi",',
              f'{inner}"ro.product.cpu.abilist64": "arm64-v8a",',
              f'{inner}"ro.product.cpu.abilist32": "armeabi-v7a,armeabi",',
              f'{inner}"ro.minui.pixel_format": "RGBA_8888",',
              f'{inner}"ro.product.first_api_level": "31",',
              f'{inner}"ro.build.version.sdk": "31",',
              f'{inner}"ro.build.version.release": "12",',
              # twrpdtgen 3.0.0 requires this property.
              # This is only a generator fallback, not the real patch level.
              f'{inner}"ro.build.version.security_patch": "1970-01-01",',
              f'{inner}"ro.build.system_root_image": "true",',
              f"{base}}}",
              f"{base}for _key, _value in fallback_props.items():",
              f"{inner}self.build_prop.set_prop(_key, _value)",
              "",
          ]

          text = text.replace(
              target_line,
              "\n".join(fallback) + target_line,
              1
          )

          path.write_text(text, encoding="utf-8")
          print("twrpdtgen patched successfully")
          PY

          python3 -m py_compile "$TARGET"
          echo "twrpdtgen syntax: OK"

      - name: Extract boot image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/boot

          python3 <<'PY'
          from pathlib import Path
          import struct
          import subprocess

          data = Path("stock/boot.img").read_bytes()
          if data[:8] != b"ANDROID!":
              raise SystemExit("Invalid boot image")

          kernel_size = struct.unpack_from("<I", data, 8)[0]
          ramdisk_size = struct.unpack_from("<I", data, 12)[0]
          header = struct.unpack_from("<I", data, 40)[0]

          if header != 4:
              raise SystemExit(f"Expected boot header v4, got {header}")

          page = 4096
          kernel_off = page
          ramdisk_off = kernel_off + ((kernel_size + page - 1) // page) * page

          out = Path("work/boot")
          (out / "kernel").write_bytes(
              data[kernel_off:kernel_off + kernel_size]
          )
          ramdisk = data[ramdisk_off:ramdisk_off + ramdisk_size]
          (out / "ramdisk.lz4").write_bytes(ramdisk)

          raw = out / "ramdisk.raw"
          result = subprocess.run(
              ["lz4", "-d", "-f", str(out / "ramdisk.lz4"), str(raw)],
              capture_output=True,
              text=True
          )

          if result.returncode != 0:
              source = ramdisk
              magic = b"\x02\x21\x4c\x18"
              pos = 0
              decoded = bytearray()
              blocks = 0

              while True:
                  i = source.find(magic, pos)
                  if i < 0 or i + 8 > len(source):
                      break

                  size = int.from_bytes(
                      source[i + 4:i + 8], "little"
                  )
                  start = i + 8
                  end = start + size

                  if end > len(source):
                      break

                  block_in = out / f"block_{blocks}.lz4"
                  block_out = out / f"block_{blocks}.raw"
                  block_in.write_bytes(
                      magic + size.to_bytes(4, "little") +
                      source[start:end]
                  )

                  subprocess.run(
                      ["lz4", "-d", "-f", str(block_in), str(block_out)],
                      check=True
                  )
                  decoded.extend(block_out.read_bytes())
                  pos = end
                  blocks += 1

              if not decoded:
                  raise SystemExit("Unable to decode boot ramdisk")

              raw.write_bytes(decoded)
              print("Decoded legacy LZ4 blocks:", blocks)

          ramdisk_dir = out / "ramdisk"
          ramdisk_dir.mkdir(parents=True, exist_ok=True)

          with raw.open("rb") as stream:
              subprocess.run(
                  ["cpio", "-idmuv"],
                  cwd=ramdisk_dir,
                  stdin=stream,
                  check=True
              )

          find = subprocess.run(
              ["find", str(ramdisk_dir), "-type", "f"],
              check=True
          )
          PY

      - name: Generate initial TWRP tree
        shell: bash
        run: |
          set -euo pipefail
          . .venv/bin/activate
          rm -rf generated
          python -m twrpdtgen -o generated stock/boot.img
          find generated -maxdepth 5 -type f | sort

      - name: Locate generated device tree
        shell: bash
        run: |
          set -euo pipefail

          TREE_SOURCE="$(
            find generated -type f -name BoardConfig.mk -print |
            head -1 | xargs -r dirname
          )"

          if [ -z "$TREE_SOURCE" ]; then
            echo "ERROR: BoardConfig.mk was not generated"
            exit 1
          fi

          echo "$TREE_SOURCE" > work/generated_tree_path.txt
          echo "Generated tree: $TREE_SOURCE"

      - name: Extract vendor_boot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/vendor_boot

          python3 <<'PY'
          from pathlib import Path
          import struct
          import subprocess
          import shutil

          data = Path("stock/vendor_boot.img").read_bytes()

          if data[:8] != b"VNDRBOOT":
              raise SystemExit("Invalid vendor_boot image")

          page = struct.unpack_from("<I", data, 12)[0]
          ramdisk_size = struct.unpack_from("<I", data, 24)[0]
          dtb_size = struct.unpack_from("<I", data, 28)[0]
          table_size = struct.unpack_from("<I", data, 44)[0]

          def align(v, a):
              return ((v + a - 1) // a) * a

          ramdisk_off = page
          dtb_off = align(ramdisk_off + ramdisk_size, page)
          table_off = align(dtb_off + dtb_size, page)

          out = Path("work/vendor_boot")
          ramdisk = data[ramdisk_off:ramdisk_off + ramdisk_size]
          dtb = data[dtb_off:dtb_off + dtb_size]
          table = data[table_off:table_off + table_size]

          (out / "vendor_ramdisk.lz4").write_bytes(ramdisk)
          (out / "dtb.img").write_bytes(dtb)
          (out / "vendor_ramdisk_table.bin").write_bytes(table)

          raw = out / "vendor_ramdisk.cpio"
          result = subprocess.run(
              ["lz4", "-d", "-f",
               str(out / "vendor_ramdisk.lz4"), str(raw)],
              capture_output=True,
              text=True
          )

          if result.returncode != 0:
              source = ramdisk
              magic = b"\x02\x21\x4c\x18"
              pos = 0
              decoded = bytearray()
              blocks = 0

              while True:
                  i = source.find(magic, pos)
                  if i < 0 or i + 8 > len(source):
                      break

                  size = int.from_bytes(
                      source[i + 4:i + 8], "little"
                  )
                  start = i + 8
                  end = start + size

                  if end > len(source):
                      break

                  block_in = out / f"block_{blocks}.lz4"
                  block_out = out / f"block_{blocks}.raw"
                  block_in.write_bytes(
                      magic + size.to_bytes(4, "little") +
                      source[start:end]
                  )

                  subprocess.run(
                      ["lz4", "-d", "-f", str(block_in), str(block_out)],
                      check=True
                  )

                  decoded.extend(block_out.read_bytes())
                  pos = end
                  blocks += 1

              if not decoded:
                  raise SystemExit("Could not decode vendor ramdisk")

              raw.write_bytes(decoded)

          ramdisk_dir = out / "ramdisk"
          if ramdisk_dir.exists():
              shutil.rmtree(ramdisk_dir)
          ramdisk_dir.mkdir(parents=True)

          with raw.open("rb") as stream:
              subprocess.run(
                  ["cpio", "-idmuv"],
                  cwd=ramdisk_dir,
                  stdin=stream,
                  check=True
              )

          print("vendor_boot extraction: OK")
          PY

      - name: Inspect vendor ramdisk
        shell: bash
        run: |
          set -euo pipefail
          find work/vendor_boot/ramdisk -maxdepth 4 -type f | sort

          echo "===== RECOVERY MODULES ====="
          if [ -f work/vendor_boot/ramdisk/modules.load.recovery ]; then
            cat work/vendor_boot/ramdisk/modules.load.recovery
          fi

          echo "===== FSTAB ====="
          find work/vendor_boot/ramdisk -type f \
            \( -name 'fstab.*' -o -name 'recovery.fstab' \) \
            -print \
            -exec sh -c 'echo "----- $1 -----"; cat "$1"' _ {} \;

      - name: Merge stock vendor_boot components
        shell: bash
        run: |
          set -euo pipefail

          TREE_SOURCE="$(cat work/generated_tree_path.txt)"

          mkdir -p \
            "$TREE_SOURCE/recovery/root" \
            "$TREE_SOURCE/prebuilt" \
            "$TREE_SOURCE/bootctrl" \
            "$TREE_SOURCE/mtk_plpath_utils"

          cp work/vendor_boot/dtb.img \
            "$TREE_SOURCE/prebuilt/beryl.dtb"

          if [ -d work/vendor_boot/ramdisk/first_stage_ramdisk ]; then
            mkdir -p "$TREE_SOURCE/recovery/root/first_stage_ramdisk"
            rsync -a \
              work/vendor_boot/ramdisk/first_stage_ramdisk/ \
              "$TREE_SOURCE/recovery/root/first_stage_ramdisk/"
          fi

          for f in init.recovery.hardware.rc init.recovery.mt6855.rc; do
            if [ -f "work/vendor_boot/ramdisk/$f" ]; then
              cp "work/vendor_boot/ramdisk/$f" \
                "$TREE_SOURCE/recovery/root/"
            fi
          done

          if [ -d work/vendor_boot/ramdisk/lib/modules ]; then
            mkdir -p "$TREE_SOURCE/recovery/root/lib/modules"
            rsync -a \
              work/vendor_boot/ramdisk/lib/modules/ \
              "$TREE_SOURCE/recovery/root/lib/modules/"
          fi

          for f in modules.alias modules.dep modules.softdep \
                   modules.load modules.load.recovery; do
            if [ -f "work/vendor_boot/ramdisk/$f" ]; then
              cp "work/vendor_boot/ramdisk/$f" \
                "$TREE_SOURCE/recovery/root/"
            fi
          done

      - name: Install stock recovery fstab
        shell: bash
        run: |
          set -euo pipefail

          TREE_SOURCE="$(cat work/generated_tree_path.txt)"

          FSTAB="$(
            find work/vendor_boot/ramdisk -type f \
              \( -name 'fstab.mt6855' -o -name 'fstab.*' \) |
            head -1
          )"

          if [ -z "$FSTAB" ]; then
            echo "No vendor fstab found"
            exit 1
          fi

          cp "$FSTAB" "$TREE_SOURCE/recovery.fstab"
          cat "$TREE_SOURCE/recovery.fstab"

      - name: Record recovery requirements
        shell: bash
        run: |
          set -euo pipefail
          TREE_SOURCE="$(cat work/generated_tree_path.txt)"

          cat > "$TREE_SOURCE/mtk_plpath_utils/STOCK_DISCOVERY.txt" <<'EOF'
          Stock beryl vendor_boot recovery requirement.

          init.recovery.mt6855.rc executes:
          /system/bin/mtk_plpath_utils

          The proprietary binary is not fabricated here.
          It must be supplied during final proprietary blob integration.
          EOF

          cat > "$TREE_SOURCE/bootctrl/BOOTCTRL_DISCOVERY.txt" <<'EOF'
          beryl boot control discovery.

          Device: POCO M7 Pro 5G
          Codename: beryl
          Platform: mt6855
          Architecture: ARM64
          A/B: true
          Dynamic partitions: true
          GKI: true
          Boot header: v4
          Vendor boot header: v4

          Do not fabricate a boot-control implementation.
          The final implementation must be derived from the stock
          boot-control HAL or appropriate ROM source.
          EOF

      - name: Configure beryl BoardConfig
        shell: bash
        run: |
          set -euo pipefail
          TREE_SOURCE="$(cat work/generated_tree_path.txt)"

          cat > "$TREE_SOURCE/BoardConfigRecovery.mk" <<'EOF'
          TARGET_ARCH := arm64
          TARGET_ARCH_VARIANT := armv8-a
          TARGET_CPU_ABI := arm64-v8a
          TARGET_CPU_ABI2 := armeabi-v7a
          TARGET_BOARD_PLATFORM := mt6855

          BOARD_BOOT_HEADER_VERSION := 4
          BOARD_VENDOR_BOOT_HEADER_VERSION := 4
          BOARD_KERNEL_PAGESIZE := 4096

          BOARD_BOOTIMAGE_PARTITION_SIZE := 134217728
          BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE := 67108864
          BOARD_SUPER_PARTITION_SIZE := 9126805504

          TARGET_USES_A/B := true
          AB_OTA_UPDATER := true
          BOARD_AVB_ENABLE := true
          BOARD_BUILD_SYSTEM_ROOT_IMAGE := true
          TARGET_USERIMAGES_USE_F2FS := true
          EOF

          cat "$TREE_SOURCE/BoardConfigRecovery.mk" \
            >> "$TREE_SOURCE/BoardConfig.mk"

      - name: Create recovery product files
        shell: bash
        run: |
          set -euo pipefail
          TREE_SOURCE="$(cat work/generated_tree_path.txt)"

          cat > "$TREE_SOURCE/twrp_beryl.mk" <<'EOF'
          PRODUCT_DEVICE := beryl
          PRODUCT_NAME := twrp_beryl
          PRODUCT_BRAND := POCO
          PRODUCT_MODEL := POCO M7 Pro 5G
          PRODUCT_MANUFACTURER := Xiaomi

          $(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)
          EOF

          cat > "$TREE_SOURCE/fox_beryl.mk" <<'EOF'
          PRODUCT_DEVICE := beryl
          PRODUCT_NAME := fox_beryl
          PRODUCT_BRAND := POCO
          PRODUCT_MODEL := POCO M7 Pro 5G
          PRODUCT_MANUFACTURER := Xiaomi

          $(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)
          EOF

          cat > "$TREE_SOURCE/AndroidProducts.mk" <<'EOF'
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/twrp_beryl.mk \
              $(LOCAL_DIR)/fox_beryl.mk
          EOF

          cat > "$TREE_SOURCE/board-info.txt" <<'EOF'
          require board=beryl
          EOF

          cat > "$TREE_SOURCE/system.prop" <<'EOF'
          ro.product.device=beryl
          ro.product.board=mt6855
          ro.board.platform=mt6855
          EOF

      - name: Create recovery vendorsetup
        shell: bash
        run: |
          set -euo pipefail
          TREE_SOURCE="$(cat work/generated_tree_path.txt)"

          cat > "$TREE_SOURCE/vendorsetup.sh" <<'EOF'
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=1

          add_lunch_combo twrp_beryl-eng
          add_lunch_combo fox_beryl-eng
          EOF

      - name: Create tree README
        shell: bash
        run: |
          set -euo pipefail
          TREE_SOURCE="$(cat work/generated_tree_path.txt)"

          cat > "$TREE_SOURCE/README_STOCK_DERIVED.md" <<'EOF'
          # POCO M7 Pro 5G — beryl

          Stock-derived recovery device tree.

          Device: POCO M7 Pro 5G
          Codename: beryl
          Platform: MediaTek MT6855
          Architecture: ARM64
          Boot header: v4
          Vendor boot header: v4
          A/B: yes
          Dynamic partitions: yes
          GKI: yes
          AVB: yes
          UFS: yes
          Userdata: F2FS

          Initial tree generated from the supplied stock boot image
          with twrpdtgen and corrected using stock vendor_boot data.

          Proprietary components are not fabricated.
          EOF

      - name: Install final device tree
        shell: bash
        run: |
          set -euo pipefail

          TREE_SOURCE="$(cat work/generated_tree_path.txt)"
          FINAL="$TREE"

          rm -rf "$FINAL"
          mkdir -p "$(dirname "$FINAL")"
          rsync -a "$TREE_SOURCE/" "$FINAL/"

      - name: Clean generated tree
        shell: bash
        run: |
          set -euo pipefail

          find "$TREE" -name "*.original" -delete

          find "$TREE" \
            -name "__pycache__" \
            -type d \
            -prune \
            -exec rm -rf {} +

          rm -f "$TREE/BoardConfigRecovery.mk"

      - name: Save stock metadata
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$TREE/prebuilt"
          cp stock/SHA256SUMS.txt \
            "$TREE/prebuilt/STOCK_SHA256SUMS.txt"

          python3 <<'PY'
          from pathlib import Path
          import struct

          boot = Path("stock/boot.img").read_bytes()
          vendor = Path("stock/vendor_boot.img").read_bytes()

          boot_header = struct.unpack_from("<I", boot, 40)[0]
          vendor_header = struct.unpack_from("<I", vendor, 8)[0]

          text = f"""beryl stock image metadata

          boot.img:
            size: {len(boot)}
            header: {boot_header}
            page size: 4096

          vendor_boot.img:
            size: {len(vendor)}
            header: {vendor_header}

          Device: beryl
          Platform: mt6855
          Architecture: arm64
          A/B: true
          Dynamic partitions: true
          GKI: true
          AVB: true
          """

          Path(
              "device/xiaomi/beryl/prebuilt/STOCK_METADATA.txt"
          ).write_text(text, encoding="utf-8")
          PY

      - name: Show git status
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          echo "===== TREE FILE COUNT ====="
          find "$TREE" -type f | wc -l

      - name: Commit generated tree
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$TREE"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit \
              -m "device: xiaomi: beryl: generate stock-derived recovery tree"
            git push
          fi

      - name: Package generated tree
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          tar -czf \
            artifacts/android_device_xiaomi_beryl.tar.gz \
            "$TREE"

          sha256sum \
            artifacts/android_device_xiaomi_beryl.tar.gz \
            > artifacts/android_device_xiaomi_beryl.tar.gz.sha256

          ls -lh artifacts/

      - name: Upload generated tree
        uses: actions/upload-artifact@v4
        with:
          name: android_device_xiaomi_beryl
          path: artifacts/
          if-no-files-found: error
