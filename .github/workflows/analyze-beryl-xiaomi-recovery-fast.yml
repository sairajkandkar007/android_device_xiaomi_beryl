name: Beryl - Fast Xiaomi ROM Analysis

on:
  workflow_dispatch:
    inputs:
      ROM_VERSION:
        description: "Xiaomi ROM version"
        required: true
        default: "OS1.0.4.0.UOQINXM"
      ROM_FILENAME:
        description: "Recovery ROM ZIP filename"
        required: true
        default: "miui_BERYLINGlobal_OS1.0.4.0.UOQINXM_b51bc03ea2_14.0.zip"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare fast download tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 p7zip-full python3 python3-pip file binutils kmod lz4 erofs-utils
          python3 -m pip install --disable-pip-version-check --no-cache-dir android-payload-dumper

      - name: Resolve Xiaomi ROM URL
        id: rom
        shell: bash
        env:
          ROM_FILENAME: ${{ inputs.ROM_FILENAME }}
        run: |
          set -euo pipefail

          # Known Xiaomi CDN pattern for this ROM.
          # If Xiaomi changes the CDN URL, fail clearly instead of downloading
          # an unrelated file.
          CANDIDATES=(
            "https://bigota.d.miui.com/${{ inputs.ROM_VERSION }}/$ROM_FILENAME"
            "https://bn.d.miui.com/${{ inputs.ROM_VERSION }}/$ROM_FILENAME"
            "https://hugeota.d.miui.com/${{ inputs.ROM_VERSION }}/$ROM_FILENAME"
          )

          mkdir -p work
          URL=""

          for candidate in "${CANDIDATES[@]}"; do
            echo "Testing: $candidate"
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --range 0-1023 --max-time 20 "$candidate" || true)"
            if [[ "$code" == "200" || "$code" == "206" ]]; then
              URL="$candidate"
              break
            fi
          done

          if [[ -z "$URL" ]]; then
            echo "::error::Could not locate the Xiaomi ROM on the tested Xiaomi CDNs."
            exit 1
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Xiaomi URL: $URL"

      - name: Fast parallel ROM download
        shell: bash
        env:
          ROM_URL: ${{ steps.rom.outputs.url }}
          ROM_FILENAME: ${{ inputs.ROM_FILENAME }}
        run: |
          set -euo pipefail
          mkdir -p work/rom

          echo "::group::Downloading ROM"
          START="$(date +%s)"

          aria2c \
            --allow-overwrite=true \
            --auto-file-renaming=false \
            --continue=true \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=4M \
            --file-allocation=none \
            --disk-cache=64M \
            --summary-interval=5 \
            --console-log-level=notice \
            --timeout=30 \
            --connect-timeout=15 \
            --max-tries=5 \
            --retry-wait=2 \
            --out="$ROM_FILENAME" \
            --dir=work/rom \
            "$ROM_URL"

          END="$(date +%s)"
          SIZE="$(stat -c%s "work/rom/$ROM_FILENAME")"
          ELAPSED=$((END-START))
          [[ "$ELAPSED" -gt 0 ]] || ELAPSED=1

          echo "ROM size: $((SIZE/1024/1024)) MiB"
          echo "Average download: $((SIZE/1024/1024/ELAPSED)) MiB/s"
          echo "::endgroup::"

          sha256sum "work/rom/$ROM_FILENAME" | tee work/rom/SHA256SUMS

      - name: Inspect ROM contents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/rom/extracted

          7z l "work/rom/${{ inputs.ROM_FILENAME }}" \
            | tee work/rom/ZIP_CONTENTS.txt

          echo "::group::Locate payload"
          7z l "work/rom/${{ inputs.ROM_FILENAME }}" \
            | grep -E '(^|/)(payload\.bin|payload_properties\.txt)$' || true
          echo "::endgroup::"

      - name: Extract payload.bin only
        shell: bash
        run: |
          set -euo pipefail

          cd work/rom
          7z e "${{ inputs.ROM_FILENAME }}" \
            'payload.bin' \
            -so > payload.bin

          test -s payload.bin
          ls -lh payload.bin

      - name: Extract required partitions with Python payload dumper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/partitions

          python3 -m android_payload_dumper \
            --payload work/rom/payload.bin \
            --output work/partitions \
            vendor vendor_dlkm odm_dlkm vendor_boot boot dtbo vbmeta vbmeta_system vbmeta_vendor

          echo "::group::Extracted partitions"
          find work/partitions -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          echo "::endgroup::"

      - name: Extract vendor and module files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p analysis/vendor analysis/vendor_dlkm analysis/required_modules analysis/firmware

          # vendor is commonly EROFS on this device.
          if [[ -f work/partitions/vendor.img ]]; then
            file work/partitions/vendor.img | tee analysis/vendor/image_info.txt
            fsck.erofs --extract=analysis/vendor work/partitions/vendor.img 2>&1 \
              | tee analysis/vendor/erofs_extract.log || true
          fi

          # vendor_dlkm is known to be EROFS.
          if [[ -f work/partitions/vendor_dlkm.img ]]; then
            file work/partitions/vendor_dlkm.img | tee analysis/vendor_dlkm/image_info.txt
            fsck.erofs --extract=analysis/vendor_dlkm work/partitions/vendor_dlkm.img 2>&1 \
              | tee analysis/vendor_dlkm/erofs_extract.log || true
          fi

          echo "::group::Vendor filesystems"
          find analysis/vendor -type f | head -2000 || true
          echo "::endgroup::"

      - name: Analyze modules and firmware
        shell: bash
        run: |
          set -euo pipefail

          V="analysis/vendor"
          D="analysis/vendor_dlkm"
          OUT="analysis"

          find "$D" -type f -name '*.ko' -print0 | sort -z > "$OUT/all_modules.nul"
          tr '\0' '\n' < "$OUT/all_modules.nul" > "$OUT/all_modules.txt"
          wc -l "$OUT/all_modules.txt" | tee "$OUT/module_count.txt"

          # Search all vendor content for touch/display firmware references.
          find "$V" "$D" -type f \
            \( -iname '*.bin' -o -iname '*.ini' -o -iname '*.fw' -o -iname '*.hex' \) \
            -print | sort > "$OUT/firmware_candidates.txt"

          grep -Ein \
            'ft3519|focaltech|fts[._-]?touch|touchscreen|xiaomi_tp|lct_tp|panel|display' \
            "$OUT/firmware_candidates.txt" \
            | tee "$OUT/touch_display_firmware_candidates.txt" || true

          # Search strings in kernel modules for firmware paths/names.
          : > "$OUT/modules_with_firmware.txt"
          while IFS= read -r module; do
            if strings -a "$module" | grep -Eqi \
              'request_firmware|/odm/firmware|/vendor/firmware|ft3519|focaltech|firmware'; then
              echo "$module" >> "$OUT/modules_with_firmware.txt"
            fi
          done < "$OUT/all_modules.txt"

          echo "::group::Modules requesting firmware"
          cat "$OUT/modules_with_firmware.txt" || true
          echo "::endgroup::"

          # Exact FT3519T search through extracted vendor filesystem.
          grep -RilE \
            'ft3519t|focaltech|fts3519|focaltech_ts_fw' \
            "$V" "$D" 2>/dev/null \
            | sort -u > "$OUT/ft3519_matches.txt" || true

          # Preserve likely required files.
          mkdir -p "$OUT/required_files/modules" "$OUT/required_files/firmware"

          for name in \
            fts_touch_i2c.ko \
            xiaomi_tp.ko \
            lct_tp.ko \
            scp.ko \
            mtk-afe-external.ko \
            mtk_tinysys_ipi.ko \
            mtk_rpmsg_mbox.ko \
            mtk-mbox.ko; do
            found="$(find "$D" -type f -name "$name" -print -quit || true)"
            if [[ -n "$found" ]]; then
              cp -L "$found" "$OUT/required_files/modules/"
              echo "$found" >> "$OUT/required_files/required_touch_modules.txt"
            fi
          done

          # Copy firmware whose filenames/paths strongly identify FT3519T.
          while IFS= read -r f; do
            [[ -f "$f" ]] || continue
            cp -L --parents "$f" "$OUT/required_files/firmware/" 2>/dev/null || \
              cp -L "$f" "$OUT/required_files/firmware/"
          done < <(
            grep -Ei \
              'ft3519t|focaltech.*(touch|ts)|touch.*focaltech|fts.*3519' \
              "$OUT/firmware_candidates.txt" || true
          )

          # Module metadata and dependencies.
          find "$D" -type f \( -name modules.dep -o -name modules.load \
            -o -name modules.alias -o -name modules.softdep \) \
            -exec cp -L {} "$OUT/required_files/" \; || true

          : > "$OUT/required_files/module_metadata.txt"
          for module in "$OUT"/required_files/modules/*.ko; do
            [[ -f "$module" ]] || continue
            {
              echo "===== $(basename "$module") ====="
              modinfo -F filename "$module" 2>/dev/null || true
              modinfo -F vermagic "$module" 2>/dev/null || true
              modinfo -F depends "$module" 2>/dev/null || true
            } >> "$OUT/required_files/module_metadata.txt"
          done

      - name: Analyze all extracted partitions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis/partition_info

          for img in work/partitions/*.img; do
            [[ -f "$img" ]] || continue
            base="$(basename "$img")"
            {
              echo "===== $base ====="
              file "$img"
              stat "$img"
              sha256sum "$img"
            } > "analysis/partition_info/${base}.txt"
          done

      - name: Generate final summary
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "Beryl Xiaomi Recovery ROM Analysis"
            echo "=================================="
            echo
            echo "ROM version: ${{ inputs.ROM_VERSION }}"
            echo "ROM filename: ${{ inputs.ROM_FILENAME }}"
            echo
            echo "ROM SHA256:"
            cat work/rom/SHA256SUMS
            echo
            echo "Extracted partitions:"
            find work/partitions -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
            echo
            echo "Kernel modules:"
            cat analysis/module_count.txt
            echo
            echo "Touch modules:"
            cat analysis/required_files/required_touch_modules.txt 2>/dev/null || true
            echo
            echo "Modules containing firmware references:"
            cat analysis/modules_with_firmware.txt 2>/dev/null || true
            echo
            echo "FT3519T / FocalTech matches:"
            cat analysis/ft3519_matches.txt 2>/dev/null || true
            echo
            echo "Candidate firmware:"
            cat analysis/touch_display_firmware_candidates.txt 2>/dev/null || true
          } > analysis/FINAL_SUMMARY.txt

          cat analysis/FINAL_SUMMARY.txt

      - name: Upload small required-files artifact
        uses: actions/upload-artifact@v4
        with:
          name: beryl-required-touch-files
          path: analysis/required_files
          if-no-files-found: warn
          compression-level: 9

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: beryl-xiaomi-recovery-analysis
          path: |
            analysis/
            work/rom/SHA256SUMS
            work/rom/ZIP_CONTENTS.txt
          if-no-files-found: warn
          compression-level: 9
