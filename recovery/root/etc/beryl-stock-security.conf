# POCO M7 Pro 5G (beryl)
# Stock Android 16 / API 36
# MediaTek MT6855
#
# This file documents stock security components identified during analysis.
# It does NOT by itself start or integrate these services.

[system]
vold=/system/bin/vold
keystore2=/system/bin/keystore2
gatekeeperd=/system/bin/gatekeeperd
vold_prepare_subdirs=/system/bin/vold_prepare_subdirs
recovery_persist=/system/bin/recovery-persist
recovery_refresh=/system/bin/recovery-refresh
uncrypt=/system/bin/uncrypt

[vendor]
tee=/vendor/bin/tee
tee_supplicant=/vendor/bin/tee-supplicant

[keymint]
service=/vendor/bin/hw/android.hardware.security.keymint@4.0-service.mitee
interface=android.hardware.security.keymint.IKeyMintDevice/default
version=4

[gatekeeper]
service=/vendor/bin/hw/android.hardware.gatekeeper-service.mitee
interface=android.hardware.gatekeeper.IGatekeeper/default

[tee]
root=/vendor/mitee
