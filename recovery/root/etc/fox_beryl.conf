# OrangeFox device notes
# Xiaomi POCO M7 Pro 5G
# Codename: beryl
# SoC: MediaTek MT6855
# Android: 16 / API 36
# Recovery architecture: vendor_boot v4
# Partition scheme: A/B + Virtual A/B + Dynamic Partitions

[device]
codename=beryl
platform=mt6855
architecture=arm64
android_api=36

[boot]
boot_header_version=4
vendor_boot_header_version=4
vendor_boot_recovery=true

[partitions]
ab=true
virtual_ab=true
dynamic_partitions=true

[filesystem]
system=erofs
system_ext=erofs
product=erofs
vendor=erofs
mi_ext=erofs
vendor_dlkm=erofs
odm_dlkm=erofs
system_dlkm=erofs
userdata=f2fs
metadata=ext4

[fbe]
version=2
content_encryption=aes-256-xts
filename_encryption=aes-256-cts
inlinecrypt=true
inlinecrypt_optimized=true
metadata_encryption=true
fsverity=true
keydirectory=/metadata/vold/metadata_encryption

[security]
tee=MITEE
keymint=KeyMint-AIDL-v4
gatekeeper=Gatekeeper-AIDL
